# ansible.cfg is read from the current directory, so every command has to be run from
# ansible/. The inventory's token lookup depends on that too.
[defaults]
# A directory, so both sources load together: the dynamic Hetzner one and the static home
# one. Playbooks then select by group rather than by which inventory was passed, which is
# what makes a default safe - k3s.yml says "hosts: k3s" and so cannot touch anything else.
# Do not write a playbook with "hosts: all"; that would give the protection away.
inventory = inventories

# Anything installed from requirements.yml lands here and takes precedence over the
# collections bundled with the ansible package.
collections_path = .collections

# As the default "auto", but without warning about the interpreter it discovered.
interpreter_python = auto_silent

# Readable task output. The obvious "stdout_callback = yaml" instead resolves to a
# community.general callback that was removed in that collection's 12.0.0.
callback_result_format = yaml

[ssh_connection]
# Off by default; saves a round trip per task.
pipelining = true
