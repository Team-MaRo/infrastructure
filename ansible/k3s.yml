---
# Brings up a 3-server k3s cluster with embedded etcd. Every node runs the control plane
# and schedules workloads, so losing one is survivable.
#
# Two plays because --cluster-init has to complete on one node before the others can join
# it, and because hosts: and serial: are play-level settings a role cannot change.
#
# k3s-01 is written out rather than templated: a play's host pattern is resolved before
# any host is selected, so inventory variables are not available to it. The role's
# k3s_init_node default names the same node and must be kept in step.
#
# Getting a kubeconfig onto your machine is kubeconfig.yml, not this playbook: that
# provisions a credential onto a workstation rather than configuring a server.

- name: Initialise the first k3s server
  hosts: k3s-01
  roles:
    - role: k3s
      k3s_cluster_init: true

- name: Join the remaining servers
  # Not all:!k3s-01 - that would sweep in the home group.
  hosts: k3s:!k3s-01
  # One at a time, so etcd keeps a sane quorum while members are added.
  serial: 1
  roles:
    - k3s
