---
# The Hetzner Debian image already runs unattended-upgrades daily (Debian and
# Debian-Security). This only moves when it fetches and installs; Automatic-Reboot stays off,
# because kured reboots one node at a time instead of all of them at once.

- name: Create the timers' drop-in directories
  ansible.builtin.file:
    path: /etc/systemd/system/{{ item }}.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Schedule fetching the package lists and unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/systemd/system/{{ item.timer }}.d/50-ansible.conf
    content: |
      # Managed by Ansible (roles/os_updates).
      [Timer]
      # The empty assignment clears Debian's OnCalendar; without it both schedules would apply.
      OnCalendar=
      OnCalendar={{ item.on_calendar }}
      RandomizedDelaySec={{ item.randomized_delay }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - timer: apt-daily.timer
      on_calendar: "{{ os_updates_refresh_on_calendar }}"
      randomized_delay: "{{ os_updates_refresh_randomized_delay }}"
    - timer: apt-daily-upgrade.timer
      on_calendar: "{{ os_updates_on_calendar }}"
      randomized_delay: "{{ os_updates_randomized_delay }}"
  loop_control:
    label: "{{ item.timer }}"
  register: os_updates_timer

- name: Reload systemd so the timers pick up the schedule
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: os_updates_timer is changed
