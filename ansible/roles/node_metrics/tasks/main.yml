---
- name: Create the textfile and script directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ node_metrics_textfile_dir }}"
    - /usr/local/lib/node-metrics

- name: Install the inotify collector
  ansible.builtin.copy:
    src: inotify-metrics.sh
    dest: /usr/local/lib/node-metrics/inotify-metrics.sh
    owner: root
    group: root
    mode: "0755"

- name: Run the inotify collector every minute
  ansible.builtin.copy:
    dest: /etc/systemd/system/{{ item.name }}
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: node-metrics-inotify.service
      content: |
        # Managed by Ansible (roles/node_metrics).
        [Unit]
        Description=Write inotify use for node-exporter

        [Service]
        Type=oneshot
        ExecStart=/usr/local/lib/node-metrics/inotify-metrics.sh {{ node_metrics_textfile_dir }}/inotify.prom
        Nice=10
    - name: node-metrics-inotify.timer
      content: |
        # Managed by Ansible (roles/node_metrics).
        [Unit]
        Description=Write inotify use for node-exporter every minute

        [Timer]
        OnBootSec=1min
        OnUnitActiveSec=1min
        AccuracySec=10s

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: node_metrics_units

- name: Start the timer
  ansible.builtin.systemd_service:
    name: node-metrics-inotify.timer
    enabled: true
    state: started
    daemon_reload: "{{ node_metrics_units is changed }}"
  # A --check run writes no unit files, so a timer that is new cannot be found yet.
  when: not (ansible_check_mode and node_metrics_units is changed)

# The package enables and starts all its collectors' timers; these four need tools the nodes do
# not have and would only fail. A mask set before the install survives it: the package's postinst
# removes only masks it recorded itself.
- name: Mask the collectors' timers that do not apply
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - prometheus-node-exporter-ipmitool-sensor.timer
    - prometheus-node-exporter-mellanox-hca-temp.timer
    - prometheus-node-exporter-nvme.timer
    - prometheus-node-exporter-smartmon.timer

- name: Install the apt collector
  ansible.builtin.apt:
    name: prometheus-node-exporter-collectors
    install_recommends: false
  register: node_metrics_collectors

- name: Start the apt collector's timer
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter-apt.timer
    enabled: true
    state: started
  # A --check run installs nothing, so the package's timer does not exist yet.
  when: not (ansible_check_mode and node_metrics_collectors is changed)
