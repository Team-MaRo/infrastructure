---
- name: Install k3s and initialise the cluster
  # creates: makes this a no-op on re-runs. That matters more than usual here -
  # --cluster-init against an already-initialised cluster is not something to retry.
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/k3s-install.sh server
      --cluster-init
      {{ k3s_common_args }}
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"

- name: Wait for the first server to be ready
  ansible.builtin.import_tasks: wait_ready.yml

- name: Read the cluster join token
  # Kept in memory and handed to the joining servers through hostvars - server_join.yml
  # reads it as hostvars[k3s_init_node].k3s_token_file. That works only because this runs
  # in an earlier play, which Ansible finishes before starting the next. Never written to
  # the repo or the laptop.
  #
  # slurp reads for real even under --check, and in a dry run the install above was only
  # simulated, so the file does not exist. Skipping it there turns a misleading failure
  # into a skip.
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/token
  register: k3s_token_file
  # The result carries the token base64-encoded, and -v prints every task's result.
  no_log: true
  when: not ansible_check_mode
