---
- name: Find the interface holding the private IP
  # Derived rather than hardcoded as enp7s0: Hetzner's NIC naming is not a contract, and a
  # wrong value here sends flannel over the public internet.
  ansible.builtin.set_fact:
    k3s_private_iface: >-
      {{ ansible_facts.interfaces
         | map('extract', ansible_facts)
         | selectattr('ipv4', 'defined')
         | selectattr('ipv4.address', 'equalto', hcloud_private_ipv4)
         | map(attribute='device')
         | first }}

- name: Assemble the server flags
  # Built once here because server_init.yml and server_join.yml differ only in
  # --cluster-init versus --server. Every node carries the public address of every node in
  # its cluster as a SAN, so the kubeconfig can be repointed at another node if this one is
  # down. The cluster's nodes are the inventory group named after cluster_name - never a
  # literal group, so the role serves any cluster.
  ansible.builtin.set_fact:
    k3s_common_args: >-
      --node-ip {{ hcloud_private_ipv4 }}
      --advertise-address {{ hcloud_private_ipv4 }}
      --flannel-iface {{ k3s_private_iface }}
      {% for h in groups[cluster_name] | sort %}--tls-san {{ hostvars[h].hcloud_ipv4 }} {% endfor %}
      {{ k3s_server_args | join(' ') }}

- name: Show what was detected
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: private {{ hcloud_private_ipv4 }} on {{ k3s_private_iface }}, public {{ hcloud_ipv4 }}"

- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Create the config drop-in directory
  ansible.builtin.file:
    path: /etc/rancher/k3s/config.yaml.d
    state: directory
    mode: "0755"

- name: Write the k3s config drop-in
  # Unlike the install flags, this is not behind creates:, so a change here reaches running
  # nodes. Written before the install tasks, so a new node starts with it from the beginning.
  # k3s reads config.yaml.d even when there is no config.yaml.
  ansible.builtin.copy:
    content: "{{ k3s_config | to_nice_yaml(indent=2) }}"
    dest: /etc/rancher/k3s/config.yaml.d/50-ansible.yaml
    mode: "0600"
  register: k3s_config_dropin

- name: Write the Pod Security Admission configuration
  # Read by the API server through admission-control-config-file in k3s_config, at start -
  # so a change here restarts k3s just like a change to the drop-in.
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/k3s).
      apiVersion: apiserver.config.k8s.io/v1
      kind: AdmissionConfiguration
      plugins:
        - name: PodSecurity
          configuration:
            apiVersion: pod-security.admission.config.k8s.io/v1
            kind: PodSecurityConfiguration
            defaults:
              enforce: restricted
              enforce-version: latest
              audit: restricted
              audit-version: latest
              warn: restricted
              warn-version: latest
            exemptions:
              namespaces: {{ k3s_psa_exempt_namespaces | to_json }}
    dest: /etc/rancher/k3s/psa.yaml
    mode: "0600"
  register: k3s_psa

- name: Restart k3s to apply the drop-in and the Pod Security configuration
  # Only on a node that already runs k3s; a fresh install reads the files when it first
  # starts. Inline rather than a handler, so the node is back and ready before the play
  # moves on - with serial: 1, one server restarts at a time and etcd keeps its quorum.
  when: (k3s_config_dropin.changed or k3s_psa.changed) and k3s_binary.stat.exists
  block:
    - name: Restart k3s
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted

    - name: Wait for the restarted server to be ready
      ansible.builtin.import_tasks: wait_ready.yml

- name: Download the k3s installer
  # From the release's own tag rather than get.k3s.io, which always serves the latest script:
  # the installer then matches k3s_version, a re-run reports no change until the version is
  # bumped, and a script that does not match the checksum - it runs as root - is refused.
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
    checksum: "sha256:{{ k3s_install_sha256 }}"
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Initialise the cluster
  ansible.builtin.import_tasks: server_init.yml
  when: k3s_cluster_init | bool

- name: Join the cluster
  ansible.builtin.import_tasks: server_join.yml
  when: not (k3s_cluster_init | bool)
