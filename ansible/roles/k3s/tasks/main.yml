---
- name: Find the interface holding the private IP
  # Derived rather than hardcoded as enp7s0: Hetzner's NIC naming is not a contract, and a
  # wrong value here sends flannel over the public internet.
  ansible.builtin.set_fact:
    k3s_private_iface: >-
      {{ ansible_facts.interfaces
         | map('extract', ansible_facts)
         | selectattr('ipv4', 'defined')
         | selectattr('ipv4.address', 'equalto', hcloud_private_ipv4)
         | map(attribute='device')
         | first }}

- name: Assemble the server flags
  # Built once here because server_init.yml and server_join.yml differ only in
  # --cluster-init versus --server. Every server carries the public address of every server in
  # its cluster as a SAN, so the kubeconfig can be repointed at another one if this one is
  # down. The cluster's nodes are the inventory group named after cluster_name, its workers
  # the group <cluster_name>_agents - never a literal group, so the role serves any cluster.
  ansible.builtin.set_fact:
    k3s_common_args: >-
      --node-ip {{ hcloud_private_ipv4 }}
      --advertise-address {{ hcloud_private_ipv4 }}
      --flannel-iface {{ k3s_private_iface }}
      {% for h in groups[cluster_name] | difference(groups[cluster_name ~ '_agents'] | default([])) | sort %}--tls-san {{ hostvars[h].hcloud_ipv4 }} {% endfor %}
      {{ k3s_server_args | join(' ') }}
  when: not k3s_agent

- name: Assemble the agent flags
  # Only what places the node in the private network; an agent serves no API, so no SANs, and
  # k3s_server_args are server flags. Its kubelet settings come from the kubelet drop-in.
  ansible.builtin.set_fact:
    k3s_agent_args: >-
      --node-ip {{ hcloud_private_ipv4 }}
      --flannel-iface {{ k3s_private_iface }}
  when: k3s_agent

- name: Show what was detected
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: private {{ hcloud_private_ipv4 }} on {{ k3s_private_iface }}, public {{ hcloud_ipv4 }}"

- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Set kernel parameters
  # Written to one file of the role's own, so it is clear where they come from, and applied
  # at once - none of them needs k3s restarted.
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/50-ansible-k3s.conf
    sysctl_set: true
  loop: "{{ k3s_sysctls | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"

- name: Create the config drop-in directory
  ansible.builtin.file:
    path: /etc/rancher/k3s/config.yaml.d
    state: directory
    mode: "0755"

- name: Write the k3s config drop-in
  # Unlike the install flags, this is not behind creates:, so a change here reaches running
  # nodes. Written before the install tasks, so a new node starts with it from the beginning.
  # k3s reads config.yaml.d even when there is no config.yaml. Agents get their own, since
  # k3s_config's server keys stop an agent from starting.
  ansible.builtin.copy:
    content: "{{ (k3s_agent_config if k3s_agent else k3s_config) | to_nice_yaml(indent=2) }}"
    dest: /etc/rancher/k3s/config.yaml.d/50-ansible.yaml
    mode: "0600"
  register: k3s_config_dropin

- name: Create the kubelet config drop-in directory
  # k3s creates it on first start; created here too, so a new node's first start already
  # reads the drop-in below.
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
    state: directory
    mode: "0700"

- name: Write the kubelet config drop-in
  # Read after k3s's own 00-k3s-defaults.conf in the same directory; every field it names
  # replaces k3s's value as a whole (see k3s_kubelet_config).
  ansible.builtin.copy:
    content: >-
      {{ {'apiVersion': 'kubelet.config.k8s.io/v1beta1', 'kind': 'KubeletConfiguration'}
         | combine(k3s_kubelet_config) | to_nice_yaml(indent=2) }}
    dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/50-ansible.conf
    mode: "0600"
  register: k3s_kubelet_dropin

- name: Write the Pod Security Admission configuration
  # Read by the API server through admission-control-config-file in k3s_config, at start -
  # so a change here restarts k3s just like a change to the drop-in.
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/k3s).
      apiVersion: apiserver.config.k8s.io/v1
      kind: AdmissionConfiguration
      plugins:
        - name: PodSecurity
          configuration:
            apiVersion: pod-security.admission.config.k8s.io/v1
            kind: PodSecurityConfiguration
            defaults:
              enforce: restricted
              enforce-version: latest
              audit: restricted
              audit-version: latest
              warn: restricted
              warn-version: latest
            exemptions:
              namespaces: {{ k3s_psa_exempt_namespaces | to_json }}
    dest: /etc/rancher/k3s/psa.yaml
    mode: "0600"
  register: k3s_psa
  when: not k3s_agent

- name: Write the authentication configuration
  # Read by the API server through authentication-config in k3s_config. The API server
  # reloads the jwt part by itself, but not every part, so a change restarts k3s like the
  # files above. Every username and group from a Zitadel token gets the prefix zitadel:, so
  # none can pose as a built-in system: identity. k3s normally disables anonymous requests
  # with --anonymous-auth=false, but leaves that flag out once this file exists, so the file
  # has to say it itself.
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/k3s).
      apiVersion: apiserver.config.k8s.io/v1
      kind: AuthenticationConfiguration
      anonymous:
        enabled: false
      jwt:
        - issuer:
            url: {{ k3s_oidc_issuer }}
            audiences:
              - "{{ k3s_oidc_client_id }}"
          claimMappings:
            username:
              claim: preferred_username
              prefix: "zitadel:"
            groups:
              claim: groups
              prefix: "zitadel:"
    dest: /etc/rancher/k3s/authn.yaml
    mode: "0600"
  register: k3s_authn
  when: not k3s_agent

- name: Restart k3s to apply the drop-ins and the API server's configuration files
  # Only on a node that already runs k3s; a fresh install reads the files when it first
  # starts. Inline rather than a handler, so the node is back and ready before the play
  # moves on - with serial: 1, one server restarts at a time and etcd keeps its quorum. The
  # installer names the service k3s on a server and k3s-agent on an agent.
  when: >-
    (k3s_config_dropin.changed or k3s_kubelet_dropin.changed or k3s_psa.changed or k3s_authn.changed)
    and k3s_binary.stat.exists
  block:
    - name: Restart k3s
      ansible.builtin.systemd_service:
        name: "{{ 'k3s-agent' if k3s_agent else 'k3s' }}"
        state: restarted

    - name: Wait for the restarted server to be ready
      ansible.builtin.import_tasks: wait_ready.yml
      when: not k3s_agent

    - name: Wait for the restarted agent to be ready
      ansible.builtin.import_tasks: wait_node_ready.yml
      when: k3s_agent

- name: Download the k3s installer
  # From the release's own tag rather than get.k3s.io, which always serves the latest script:
  # the installer then matches k3s_version, a re-run reports no change until the version is
  # bumped, and a script that does not match the checksum - it runs as root - is refused.
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
    checksum: "sha256:{{ k3s_install_sha256 }}"
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Initialise the cluster
  ansible.builtin.import_tasks: server_init.yml
  when: k3s_cluster_init | bool

- name: Join the cluster
  ansible.builtin.import_tasks: server_join.yml
  when: not (k3s_cluster_init | bool) and not k3s_agent

- name: Join the cluster as an agent
  ansible.builtin.import_tasks: agent_join.yml
  when: k3s_agent

- name: Label the node
  ansible.builtin.import_tasks: labels.yml
