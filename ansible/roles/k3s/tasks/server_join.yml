---
- name: Install k3s and join the cluster
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/k3s-install.sh server
      --server https://{{ hostvars[k3s_init_node].hcloud_private_ipv4 }}:6443
      {{ k3s_common_args }}
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_TOKEN: "{{ hostvars[k3s_init_node].k3s_token_file.content | b64decode | trim }}"
  no_log: true
  # The token only exists after a real run of the first play, so a dry run has nothing to
  # evaluate here and would fail on the undefined value. Skipping keeps --check useful for
  # everything it can check: connectivity, interface detection and flag assembly on all
  # three nodes.
  when: not ansible_check_mode

- name: Wait for the API to answer
  ansible.builtin.command: k3s kubectl get --raw /readyz
  changed_when: false
  retries: 30
  delay: 5
  register: k3s_readyz
  until: k3s_readyz.rc == 0
