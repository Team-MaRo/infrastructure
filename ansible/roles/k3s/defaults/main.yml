---
# The version a node is installed with - nothing more. Running nodes are upgraded by the
# system-upgrade-controller (kubernetes/components/system-upgrade-controller), and a new node
# installed at this version catches up in the next upgrade window. Bump it now and then so
# new nodes do not start far behind.
k3s_version: v1.37.1+k3s1

# SHA-256 of install.sh at that release's tag. Bumping k3s_version means bumping this too:
#   curl -sL "https://raw.githubusercontent.com/k3s-io/k3s/<version, + as %2B>/install.sh" | shasum -a 256
k3s_install_sha256: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b

# k3s_init_node - the host --cluster-init runs on - has no default: it names a host, so it
# comes from the inventory's group_vars.

# Set to true by the play that bootstraps the cluster; every other node joins instead.
k3s_cluster_init: false

# true installs k3s as an agent (a worker: kubelet, containerd, flannel - no API server, no
# etcd) that joins k3s_init_node, instead of a server. Set for a group in the inventory
# (group_vars/prod_agents.yml).
k3s_agent: false

# The config drop-in for agents. k3s_config holds server-only keys (etcd, the API server's
# files, disable), on which an agent refuses to start; agents need none of it today - the
# flannel backend, for one, comes from the servers.
k3s_agent_config: {}

# Flags every server gets. The per-node ones (--node-ip, --flannel-iface, --tls-san) are
# derived in tasks/main.yml because they depend on facts.
#
# --secrets-encryption encrypts Secrets at rest in etcd. It is free at install time and
# cannot be enabled on an existing server without restarting it, which is the whole reason
# this install was not postponed again.
#
# --kubelet-arg=fail-swap-on=false lets the swap role be enabled later without kubelet
# refusing to start. Swap is off today, so the flag currently changes nothing.
k3s_server_args:
  - --secrets-encryption
  - --kubelet-arg=fail-swap-on=false

# Settings that may change on a running cluster. Written to
# /etc/rancher/k3s/config.yaml.d/50-ansible.yaml, keys as in the k3s config file (flag names
# without the dashes); a change restarts one server at a time.
#
# local-storage is k3s's local-path provisioner, which keeps volumes in a directory on the
# node's own disk - lost with the node and competing with the OS for 40 GB. Disabled, k3s
# uninstalls it and deletes its manifest. Persistent volumes are to come from Hetzner
# Volumes instead.
#
# etcd-s3 uploads every snapshot (00:00 and 12:00 UTC) to Object Storage as well, where the
# retention of 5 counts all nodes together, not each one. All S3 settings come from the
# named Secret in kube-system, which External Secrets fills from OpenBao; setting any other
# etcd-s3-* option here would make k3s ignore it. A restore cannot read the Secret - see
# "Restoring" in kubernetes/clusters/prod/etcd-snapshots/README.md for what it needs instead.
#
# etcd-expose-metrics makes etcd serve its metrics on the node's own address as well as on
# 127.0.0.1, port 2381, so Prometheus can scrape it from a pod. That address is the private
# IP (--node-ip), so the port never listens on the public interface. Plain HTTP, no
# authentication - metrics only, nothing that could change etcd.
#
# admission-control-config-file points the API server at the Pod Security configuration the
# role writes next to this drop-in (see k3s_psa_exempt_namespaces).
#
# authentication-config makes the API server accept Zitadel's ID tokens (kubectl through
# kubelogin), next to its client certificates and ServiceAccount tokens - see k3s_oidc_issuer.
#
# flannel-backend wireguard-native encrypts pod traffic between nodes: Flannel builds a
# WireGuard tunnel between every pair of nodes (UDP 51820, over the private interface)
# instead of the unencrypted VXLAN default. Flannel options must be identical on all
# servers, and switching a running cluster breaks cross-node pod traffic until the last node
# has restarted - then reboot each node to clear the old flannel.1 interface.
k3s_config:
  disable:
    - local-storage
  etcd-s3: true
  etcd-s3-config-secret: k3s-etcd-snapshot-s3-config
  etcd-expose-metrics: true
  flannel-backend: wireguard-native
  kube-apiserver-arg:
    - admission-control-config-file=/etc/rancher/k3s/psa.yaml
    - authentication-config=/etc/rancher/k3s/authn.yaml

# kubelet settings, written as a KubeletConfiguration drop-in to
# /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/50-ansible.conf; a change restarts one server
# at a time, like k3s_config. Not kubelet-arg in k3s_config: the installer put a --kubelet-arg
# on the command line (k3s_server_args), and k3s lets the command line replace that whole list.
# A drop-in replaces every field it names, maps included.
#
# evictionHard: k3s's defaults set only the two disk thresholds, which drops the kubelet's
# memory one - nothing evicted pods before a node ran out of memory. With memory.available the
# kubelet evicts pods (those furthest over their requests first) before the kernel's OOM killer
# picks anything, k3s and etcd included. The disk thresholds are k3s's own, repeated because the
# map is replaced as a whole.
#
# kubeReserved and systemReserved take memory that k3s itself and the OS use out of the node's
# allocatable, so the scheduler stops placing pods into it. Measured 2026-10-06: k3s (API server,
# etcd, controllers, kubelet, containerd) 1.9-2.7 GiB, the rest of the OS with the kernel about
# 0.2 GiB. kubeReserved is k3s's baseline with embedded etcd (about 1.5 GiB per k3s's resource
# profiling) - less than measured, so the largest node's pod requests still fit; raise it once
# requests are trimmed. The pods together are capped at capacity minus both reservations (the
# kubelet's default enforceNodeAllocatable: [pods]); k3s and the OS are not - enforcing their
# reservations would put a hard memory limit on k3s and etcd.
k3s_kubelet_config:
  evictionHard:
    memory.available: 200Mi
    imagefs.available: 5%
    nodefs.available: 5%
  kubeReserved:
    memory: 1536Mi
  systemReserved:
    memory: 256Mi

# Kernel settings on the node itself. ip_unprivileged_port_start lets non-root processes bind
# ports from 80 up in the host's network namespace (it covers IPv6 too, despite the name):
# Traefik runs on the host network, as UID 65532 without capabilities, and listens on 80 and
# 443 directly. Pods have their own network namespaces and are not affected. The trade is that
# any local non-root process could bind those ports too; these nodes run nothing but k3s.
k3s_sysctls:
  net.ipv4.ip_unprivileged_port_start: 80

# Labels the role puts on the node through kubectl, since k3s's node-label only applies when a
# node first registers. Set per cluster or host in the inventory; empty means none.
k3s_node_labels: {}

# Pod Security Admission enforces the restricted standard on every namespace except these.
# They hold infrastructure, some of which must run privileged (kured and the CSI driver in
# kube-system, the upgrade Jobs in system-upgrade). A new infrastructure component that needs
# more than the restricted standard goes onto this list in the commit that deploys it. This is
# about privileges only; Kyverno's default resources have a list of their own, which is much
# shorter (kubernetes/components/kyverno/default-resources.yaml).
k3s_psa_exempt_namespaces:
  - kube-system
  - kube-public
  - kube-node-lease
  - default
  - argocd
  - openbao
  - external-secrets
  - system-upgrade
  - kyverno
  # The one app here, not infrastructure: its images (d3strukt0r/wedding-manuele-robine:api-latest
  # and :pwa-latest) run supervisord, nginx, php-fpm and cron as root on port 80, which the
  # restricted standard refuses (kubernetes/components/wedding-manuele-robine).
  # TODO: make the images rootless (an unprivileged user, port 8080), then remove this entry.
  - wedding-manuele-robine

