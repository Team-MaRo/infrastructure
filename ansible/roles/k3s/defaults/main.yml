---
# The version a node is installed with - nothing more. Running nodes are upgraded by the
# system-upgrade-controller (kubernetes/components/system-upgrade-controller), and a new node
# installed at this version catches up in the next upgrade window. Bump it now and then so
# new nodes do not start far behind.
k3s_version: v1.37.0+k3s1

# SHA-256 of install.sh at that release's tag. Bumping k3s_version means bumping this too:
#   curl -sL "https://raw.githubusercontent.com/k3s-io/k3s/<version, + as %2B>/install.sh" | shasum -a 256
k3s_install_sha256: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b

# k3s_init_node - the host --cluster-init runs on - has no default: it names a host, so it
# comes from the inventory's group_vars.

# Set to true by the play that bootstraps the cluster; every other node joins instead.
k3s_cluster_init: false

# Flags every server gets. The per-node ones (--node-ip, --flannel-iface, --tls-san) are
# derived in tasks/main.yml because they depend on facts.
#
# --secrets-encryption encrypts Secrets at rest in etcd. It is free at install time and
# cannot be enabled on an existing server without restarting it, which is the whole reason
# this install was not postponed again.
#
# --kubelet-arg=fail-swap-on=false lets the swap role be enabled later without kubelet
# refusing to start. Swap is off today, so the flag currently changes nothing.
k3s_server_args:
  - --secrets-encryption
  - --kubelet-arg=fail-swap-on=false

# Settings that may change on a running cluster. Written to
# /etc/rancher/k3s/config.yaml.d/50-ansible.yaml, keys as in the k3s config file (flag names
# without the dashes); a change restarts one server at a time.
#
# local-storage is k3s's local-path provisioner, which keeps volumes in a directory on the
# node's own disk - lost with the node and competing with the OS for 40 GB. Disabled, k3s
# uninstalls it and deletes its manifest. Persistent volumes are to come from Hetzner
# Volumes instead.
#
# etcd-s3 uploads every snapshot (00:00 and 12:00, 5 kept per node) to Object Storage as
# well. All S3 settings come from the named Secret in kube-system, which External Secrets
# fills from OpenBao; setting any other etcd-s3-* option here would make k3s ignore it. A
# restore cannot read the Secret - see CLAUDE.md for what it needs instead.
#
# admission-control-config-file points the API server at the Pod Security configuration the
# role writes next to this drop-in (see k3s_psa_exempt_namespaces).
#
# flannel-backend wireguard-native encrypts pod traffic between nodes: Flannel builds a
# WireGuard tunnel between every pair of nodes (UDP 51820, over the private interface)
# instead of the unencrypted VXLAN default. Flannel options must be identical on all
# servers, and switching a running cluster breaks cross-node pod traffic until the last node
# has restarted - then reboot each node to clear the old flannel.1 interface.
k3s_config:
  disable:
    - local-storage
  etcd-s3: true
  etcd-s3-config-secret: k3s-etcd-snapshot-s3-config
  flannel-backend: wireguard-native
  kube-apiserver-arg:
    - admission-control-config-file=/etc/rancher/k3s/psa.yaml

# Pod Security Admission enforces the restricted standard on every namespace except these.
# They hold infrastructure, some of which must run privileged (kured and the CSI driver in
# kube-system, the upgrade Jobs in system-upgrade). The same list excludes these namespaces
# from the Kyverno policies in kubernetes/components/kyverno/ - keep the two in step: a new
# infrastructure component goes onto both, in the commit that deploys it.
k3s_psa_exempt_namespaces:
  - kube-system
  - kube-public
  - kube-node-lease
  - default
  - argocd
  - openbao
  - external-secrets
  - system-upgrade
  - kyverno

