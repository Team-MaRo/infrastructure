---
# Writes this cluster's two kubeconfigs onto this machine: the everyday one, which logs in
# through Zitadel, and the cluster-admin one fetched from a node.
#
# Deliberately not part of prod.yml and not imported by site.yml: it provisions a credential
# onto a workstation, which is not configuring a server. Run it when you need the
# credential, and again after the cluster is rebuilt.
#
# What it fetches is the break-glass credential. Its embedded client certificate is
# CN=system:admin, O=system:masters - a group that bypasses RBAC entirely and whose access
# cannot be revoked by removing bindings. Everyday access comes from the Zitadel kubeconfig
# instead, which holds no credential at all: kubelogin (`brew install kubelogin`, run as
# `kubectl oidc-login`) opens the browser, and the API server accepts the ID token it gets
# (roles/k3s writes that configuration). Its rights are the ClusterRoleBinding in
# kubernetes/components/cluster-rbac/.
#
# It also expires. k3s issues 365-day certificates and renews them on startup within 120
# days of expiry, on the node - this copy does not follow, so re-run to refresh it.

- name: Write the cluster's kubeconfigs
  hosts: prod-01
  vars:
    # k3s names the cluster, user and context "default", which says nothing in a KUBECONFIG
    # that also lists other clusters.
    kubeconfig_name: d3strukt0r-prod-admin
    oidc_kubeconfig_name: d3strukt0r-prod
  tasks:
    - name: Make sure the local kube directory exists
      # No mode: the directory usually exists already and rewriting its permissions is not
      # this playbook's business. The credential itself is written 0600 below, which is the
      # part that matters.
      ansible.builtin.file:
        path: "{{ admin_kubeconfig | dirname }}"
        state: directory
      delegate_to: localhost
      become: false

    - name: Read the kubeconfig from the node
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig
      # The result carries the admin private key base64-encoded, and -v prints every
      # task's result.
      no_log: true

    - name: Write it locally, renamed and pointed at the public API
      # Two rewrites of what the node generated:
      #
      # The server address, because the node's own copy says 127.0.0.1. It becomes this
      # node's public address, which the 6443 firewall rule allows from admin_ips only. If
      # it is ever down, edit the server: line to another node - all three are in the
      # certificate's SANs.
      #
      # The names. Each replacement is anchored to its key rather than matching the bare
      # word: base64 contains no colon or space, so "name: default" cannot collide with the
      # certificate blobs, while a bare "default" could and would corrupt them silently.
      ansible.builtin.copy:
        content: >-
          {{ k3s_kubeconfig.content | b64decode
             | replace('https://127.0.0.1:6443', 'https://' ~ hcloud_ipv4 ~ ':6443')
             | replace('name: default', 'name: ' ~ kubeconfig_name)
             | replace('cluster: default', 'cluster: ' ~ kubeconfig_name)
             | replace('user: default', 'user: ' ~ kubeconfig_name)
             | replace('current-context: default', 'current-context: ' ~ kubeconfig_name) }}
        dest: "{{ admin_kubeconfig }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Write the everyday kubeconfig, logging in through Zitadel
      # Same server and CA as the admin kubeconfig; the user is kubelogin instead of a client
      # certificate. offline_access asks for a refresh token, so kubectl renews the hourly ID
      # token without the browser; profile puts preferred_username - the username the API
      # server takes - into it. The tokens are kept in the macOS keychain rather than in a
      # file under ~/.kube/cache. Nothing in it is secret.
      ansible.builtin.copy:
        content: "{{ oidc_kubeconfig | to_nice_yaml(indent=2) }}"
        dest: "{{ admin_kubeconfig | dirname }}/{{ oidc_kubeconfig_name }}.yaml"
        mode: "0600"
      vars:
        oidc_kubeconfig:
          apiVersion: v1
          kind: Config
          clusters:
            - name: "{{ oidc_kubeconfig_name }}"
              cluster:
                server: "https://{{ hcloud_ipv4 }}:6443"
                certificate-authority-data: >-
                  {{ (k3s_kubeconfig.content | b64decode | from_yaml).clusters[0].cluster['certificate-authority-data'] }}
          users:
            - name: "{{ oidc_kubeconfig_name }}"
              user:
                exec:
                  apiVersion: client.authentication.k8s.io/v1
                  command: kubectl
                  args:
                    - oidc-login
                    - get-token
                    - "--oidc-issuer-url={{ k3s_oidc_issuer }}"
                    - "--oidc-client-id={{ k3s_oidc_client_id }}"
                    - --oidc-extra-scope=profile
                    - --oidc-extra-scope=offline_access
                    - --token-cache-storage=keyring
                  interactiveMode: IfAvailable
          contexts:
            - name: "{{ oidc_kubeconfig_name }}"
              context:
                cluster: "{{ oidc_kubeconfig_name }}"
                user: "{{ oidc_kubeconfig_name }}"
          current-context: "{{ oidc_kubeconfig_name }}"
      delegate_to: localhost
      become: false

    - name: How to use them
      ansible.builtin.debug:
        msg:
          - "Everyday: kubectl --context {{ oidc_kubeconfig_name }} get nodes -o wide"
          - "Break-glass: kubectl --context {{ kubeconfig_name }} get nodes -o wide"
