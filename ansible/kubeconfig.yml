---
# Fetches the cluster-admin kubeconfig onto this machine.
#
# Deliberately not part of prod.yml and not imported by site.yml: it provisions a credential
# onto a workstation, which is not configuring a server. Run it when you need the
# credential, and again after the cluster is rebuilt.
#
# What it fetches is the break-glass credential. Its embedded client certificate is
# CN=system:admin, O=system:masters - a group that bypasses RBAC entirely and whose access
# cannot be revoked by removing bindings. Everyday access is meant to come from a scoped
# identity, not from this.
#
# It also expires. k3s issues 365-day certificates and renews them on startup within 120
# days of expiry, on the node - this copy does not follow, so re-run to refresh it.

- name: Fetch the cluster's admin kubeconfig
  hosts: prod-01
  vars:
    # k3s names the cluster, user and context "default", which says nothing in a KUBECONFIG
    # that also lists other clusters.
    kubeconfig_name: d3strukt0r-prod-admin
  tasks:
    - name: Make sure the local kube directory exists
      # No mode: the directory usually exists already and rewriting its permissions is not
      # this playbook's business. The credential itself is written 0600 below, which is the
      # part that matters.
      ansible.builtin.file:
        path: "{{ admin_kubeconfig | dirname }}"
        state: directory
      delegate_to: localhost
      become: false

    - name: Read the kubeconfig from the node
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig
      # The result carries the admin private key base64-encoded, and -v prints every
      # task's result.
      no_log: true

    - name: Write it locally, renamed and pointed at the public API
      # Two rewrites of what the node generated:
      #
      # The server address, because the node's own copy says 127.0.0.1. It becomes this
      # node's public address, which the 6443 firewall rule allows from admin_ips only. If
      # it is ever down, edit the server: line to another node - all three are in the
      # certificate's SANs.
      #
      # The names. Each replacement is anchored to its key rather than matching the bare
      # word: base64 contains no colon or space, so "name: default" cannot collide with the
      # certificate blobs, while a bare "default" could and would corrupt them silently.
      ansible.builtin.copy:
        content: >-
          {{ k3s_kubeconfig.content | b64decode
             | replace('https://127.0.0.1:6443', 'https://' ~ hcloud_ipv4 ~ ':6443')
             | replace('name: default', 'name: ' ~ kubeconfig_name)
             | replace('cluster: default', 'cluster: ' ~ kubeconfig_name)
             | replace('user: default', 'user: ' ~ kubeconfig_name)
             | replace('current-context: default', 'current-context: ' ~ kubeconfig_name) }}
        dest: "{{ admin_kubeconfig }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: How to use it
      ansible.builtin.debug:
        msg: "kubectl --context {{ kubeconfig_name }} get nodes -o wide"
