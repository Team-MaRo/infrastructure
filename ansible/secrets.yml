---
# Writes the Secrets the cluster needs before OpenBao can supply any - today the Hetzner API
# token for the CSI driver, which OpenBao itself depends on for its volumes.
#
# The values come from 1Password on this machine, so 1Password is the root of trust for the
# bootstrap only: the running cluster never talks to it. Expect a Touch ID prompt.
#
# Runs after prod.yml and kubeconfig.yml, from a network position where 6443 is open, like
# argocd.yml. Not imported by site.yml, for the same reason: it depends on workstation
# state - the admin kubeconfig and a signed-in 1Password - rather than only on the nodes.

- name: Write the bootstrap secrets
  # Targets the node only to pick up the prod group's variables (admin_kubeconfig,
  # cluster_secrets); every task runs here, so no SSH connection is made.
  hosts: prod-01
  gather_facts: false
  become: false
  tasks:
    - name: Write the bootstrap secrets from this machine
      ansible.builtin.include_role:
        name: cluster_secrets
        apply:
          delegate_to: localhost
