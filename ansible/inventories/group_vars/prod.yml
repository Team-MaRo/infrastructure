---
# The account cloud-init/node.yaml creates, and the only one its sshd AllowUsers permits.
ansible_user: d3strukt0r

# cloud-init grants that account NOPASSWD sudo, so escalation needs no password and the
# default become_ask_pass = false is correct.
ansible_become: true

# Which directory under kubernetes/clusters/ is this cluster's root. It is inventory data
# because it identifies the cluster, not the role: a second cluster becomes a second group
# with its own name here.
cluster_name: prod

# Where kubeconfig.yml writes this cluster's break-glass kubeconfig, and where argocd.yml
# reads it. Outside the repo on purpose: it is a cluster-admin credential and the repo is
# public.
admin_kubeconfig: ~/.kube/d3strukt0r-prod-admin.yaml

# The node --cluster-init runs on; the others point at its private address and take its
# join token. Inventory data because it names a host. Must match the host patterns in
# prod.yml, which cannot be templated from here - a play's pattern is resolved before any
# host is selected.
k3s_init_node: prod-01

# Where secrets.yml reads bootstrap secrets from. Two 1Password accounts are signed in on
# the admin's machine, so the account is pinned rather than left to op's default.
onepassword_account: my.1password.com
onepassword_vault: Server

# The Secrets secrets.yml writes - only what the cluster needs before OpenBao can supply
# secrets itself. Each value is one field of one 1Password item.
cluster_secrets:
  # Hetzner Cloud API token (read+write) for the CSI driver; the name and key are what
  # hetznercloud/csi-driver's manifest expects. A dedicated token, so it can be revoked
  # without touching the one OpenTofu uses.
  - namespace: kube-system
    name: hcloud
    key: token
    item: "Hetzner | Prod CSI"
    # An API Credential item; its "credential" field is labelled "Anmeldedaten" in the
    # German app.
    field: credential

  # OpenBao's static seal key: 32 random bytes, hex-encoded. OpenBao unseals itself with it
  # on every start; losing it makes all of OpenBao's data unreadable. The namespace comes
  # from the openbao Application, so this runs after that has synced. Written once and never
  # edited; the recovery keys and root token from `bao operator init` are a separate item.
  - namespace: openbao
    name: openbao-seal
    key: key
    item: "OpenBao | Prod | Seal key"
    field: credential
