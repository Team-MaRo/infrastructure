---
# Installed into .collections/ (ansible.cfg's collections_path), which takes precedence over
# the collections bundled with the `ansible` package:
#
#   ansible-galaxy collection install -r requirements.yml
#
# The bundle satisfies the first two floors. It does not satisfy hetzner.hcloud's: until
# the `ansible` package ships 7.x, this install is what gets the inventory plugin past 6.12.
# Check what is in use with `ansible-galaxy collection list`.
collections:
  # sysctl, mount
  - name: ansible.posix
    version: ">=2.2.2"
  # filesize
  - name: community.general
    version: ">=13.4.0"
  # The Hetzner dynamic inventory plugin. 7.0 removed the hcloud_datacenter host variable;
  # 6.12 warns about it on every run even though nothing here uses it.
  - name: hetzner.hcloud
    version: ">=7.0.0"
