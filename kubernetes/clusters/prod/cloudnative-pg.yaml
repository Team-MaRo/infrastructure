---
# CloudNativePG, the PostgreSQL operator, and its Barman Cloud plugin, which ships the backups
# and the WAL archive to Object Storage. Values from kubernetes/components/cloudnative-pg/. The
# plugin must run in the operator's namespace, where the operator finds it by its Service.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  project: default
  sources:
    # Pinned: bumping a version is the upgrade. The CRDs come with the operator chart and carry
    # helm.sh/resource-policy: keep, so Argo CD never deletes them - that would delete every
    # PostgreSQL cluster with them.
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.1
      helm:
        valueFiles:
          - $repo/kubernetes/components/cloudnative-pg/values.yaml
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: plugin-barman-cloud
      targetRevision: 0.8.0
      helm:
        valueFiles:
          - $repo/kubernetes/components/cloudnative-pg/plugin-values.yaml
    - repoURL: https://github.com/Team-MaRo/infrastructure.git
      targetRevision: master
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The operator chart's CRDs are too large for client-side apply's annotation.
      - ServerSideApply=true
