---
# The KubeElasti proof, from kubernetes/components/scale-to-zero-test. Temporary.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scale-to-zero-test
  namespace: argocd
  # Removing this file removes everything it deployed, namespace included.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Team-MaRo/infrastructure.git
    targetRevision: master
    path: kubernetes/components/scale-to-zero-test
  destination:
    server: https://kubernetes.default.svc
    namespace: scale-to-zero-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Not required here (no large CRDs); used for consistency.
      - ServerSideApply=true
