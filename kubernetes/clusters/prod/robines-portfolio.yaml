---
# The old WordPress portfolio at old.robines.space, from kubernetes/components/robines-portfolio.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: robines-portfolio
  namespace: argocd
  # Removing this file removes everything it deployed, namespace included; its database and user
  # in the shared MariaDB stay (cleanupPolicy Skip), and so do its uploads in Object Storage.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Team-MaRo/infrastructure.git
    targetRevision: master
    path: kubernetes/components/robines-portfolio
  destination:
    server: https://kubernetes.default.svc
    namespace: robines-portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
