---
# The S3 settings k3s uploads its etcd snapshots with, as the Secret named by
# etcd-s3-config-secret in ansible/roles/k3s/defaults/main.yml. k3s reads it from
# kube-system at snapshot time, and only because no other etcd-s3-* flag is set - any
# such flag makes it ignore the Secret.
#
# The cluster's own key comes from OpenBao (secret/etcd-snapshot-s3); the rest is not
# secret and stays reviewable here.
# 1Password "Hetzner | S3 | prod etcd snapshots"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=w2po7jqmxren7y7eruj73p5w4a&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k3s-etcd-snapshot-s3-config
  namespace: kube-system
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      data:
        etcd-s3-endpoint: nbg1.your-objectstorage.com
        etcd-s3-region: nbg1
        etcd-s3-bucket: d3strukt0r-prod-etcd
        etcd-s3-access-key: "{{ .accessKey }}"
        etcd-s3-secret-key: "{{ .secretKey }}"
  data:
    - secretKey: accessKey
      remoteRef:
        key: etcd-snapshot-s3
        property: access-key
    - secretKey: secretKey
      remoteRef:
        key: etcd-snapshot-s3
        property: secret-key
