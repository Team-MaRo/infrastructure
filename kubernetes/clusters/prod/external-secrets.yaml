---
# External Secrets for this cluster: the operator from its Helm chart, plus the
# ClusterSecretStore pointing at OpenBao from kubernetes/components/external-secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    # Pinned: bumping the version is the upgrade.
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.11.0
    - repoURL: https://github.com/Team-MaRo/infrastructure.git
      targetRevision: master
      path: kubernetes/components/external-secrets
  destination:
    server: https://kubernetes.default.svc
    # The release name and this namespace give the service account external-secrets in
    # namespace external-secrets - exactly what the OpenBao role in tofu/openbao is bound to.
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Required: the chart's CRDs are too large for client-side apply's
      # last-applied-configuration annotation.
      - ServerSideApply=true
