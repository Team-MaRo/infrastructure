---
# Coordinated reboots after kernel updates for this cluster: the kubereboot kured Helm chart with
# values from kubernetes/components/kured, plus that directory's manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kured
  namespace: argocd
  # Removing this file removes everything it deployed (kube-system itself stays).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Patch releases arrive by themselves (the `~` range, components/argocd/README.md "Chart
    # versions"); raising the range is the upgrade.
    - repoURL: https://kubereboot.github.io/charts
      chart: kured
      targetRevision: "~6.1.0"
      helm:
        valueFiles:
          - $repo/kubernetes/components/kured/values.yaml
    - repoURL: https://github.com/Team-MaRo/infrastructure.git
      targetRevision: master
      ref: repo
      path: kubernetes/components/kured
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Not required here; used for consistency, as in hcloud-csi.yaml.
      - ServerSideApply=true
