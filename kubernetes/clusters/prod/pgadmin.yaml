---
# pgAdmin for this cluster, from kubernetes/components/pgadmin: the web UI for the shared
# PostgreSQL at pgadmin.d3strukt0r.dev, with its own Zitadel login.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgadmin
  namespace: argocd
  # Removing this file removes everything it deployed, namespace included; its configuration
  # database and role in the shared PostgreSQL stay (CloudNativePG retains them).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Team-MaRo/infrastructure.git
    targetRevision: master
    path: kubernetes/components/pgadmin
  destination:
    server: https://kubernetes.default.svc
    namespace: pgadmin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Not required here (no large CRDs); used for consistency.
      - ServerSideApply=true
