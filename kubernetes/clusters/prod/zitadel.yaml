---
# Zitadel for this cluster: its Helm chart with values from kubernetes/components/zitadel, plus
# that directory's own objects. Needs secret/zitadel and secret/postgres-apps/zitadel in OpenBao.
# Its database objects go to the postgres namespace (database.yaml); everything else to zitadel.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zitadel
  namespace: argocd
  annotations:
    # Compare on the server: fields the operators' webhooks default would otherwise look like
    # drift (as for the MariaDB and PostgreSQL clusters).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    # Pinned: bumping the version is the upgrade. Its init and setup jobs run on every sync
    # (idempotent), ordered by sync waves (values.yaml).
    - repoURL: https://charts.zitadel.com
      chart: zitadel
      targetRevision: 10.1.0
      helm:
        valueFiles:
          - $repo/kubernetes/components/zitadel/values.yaml
    - repoURL: https://github.com/Team-MaRo/infrastructure.git
      targetRevision: master
      ref: repo
      path: kubernetes/components/zitadel
  destination:
    server: https://kubernetes.default.svc
    namespace: zitadel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
