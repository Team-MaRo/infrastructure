---
# Uptime Kuma for this cluster, from kubernetes/components/uptime-kuma. Inside the cluster for
# now: a complete cluster outage takes it down too, so that case goes unnoticed until it moves
# to a machine outside - then this file and its namespace go.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime-kuma
  namespace: argocd
  # Removing this file removes everything it deployed, namespace included.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Team-MaRo/infrastructure.git
    targetRevision: master
    path: kubernetes/components/uptime-kuma
  destination:
    server: https://kubernetes.default.svc
    namespace: uptime-kuma
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Not required here (no large CRDs); used for consistency.
      - ServerSideApply=true
