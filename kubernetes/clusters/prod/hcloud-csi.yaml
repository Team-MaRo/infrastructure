---
# Persistent volumes for this cluster: Hetzner's hcloud-csi Helm chart with values from
# kubernetes/components/hcloud-csi. Needs Secret kube-system/hcloud before its controller can do
# anything; ansible/secrets.yml writes it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hcloud-csi
  namespace: argocd
spec:
  project: default
  sources:
    # Patch releases arrive by themselves (the `~` range, components/argocd/README.md "Chart
    # versions"); raising the range is the upgrade.
    - repoURL: https://charts.hetzner.cloud
      chart: hcloud-csi
      targetRevision: "~2.23.0"
      helm:
        valueFiles:
          - $repo/kubernetes/components/hcloud-csi/values.yaml
    - repoURL: https://github.com/Team-MaRo/infrastructure.git
      targetRevision: master
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Not required here - unlike the argocd Application, whose CRDs exceed the annotation
      # limit of client-side apply. Used for consistency, so no object carries a copy of
      # itself in last-applied-configuration, and Argo CD owns only the fields it writes.
      - ServerSideApply=true
