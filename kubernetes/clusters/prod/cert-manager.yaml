---
# Certificates for this cluster, from kubernetes/components/cert-manager. Needs the Cloudflare
# tokens in OpenBao (secret/cloudflare-dns) before its issuers can solve a challenge.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Team-MaRo/infrastructure.git
    targetRevision: master
    path: kubernetes/components/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Required: cert-manager's CRDs are too large for client-side apply's
      # last-applied-configuration annotation.
      - ServerSideApply=true
