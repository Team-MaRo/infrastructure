---
# Who may do what cluster-wide, from kubernetes/components/cluster-rbac. Cluster-scoped objects
# only, so no destination namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-rbac
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Team-MaRo/infrastructure.git
    targetRevision: master
    path: kubernetes/components/cluster-rbac
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Not required here (no large CRDs); used for consistency.
      - ServerSideApply=true
