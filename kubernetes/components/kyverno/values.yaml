# Helm values for the kyverno chart. Everything else stays at the chart's defaults.
config:
  # The default, true, marks Kyverno's ConfigMap helm.sh/resource-policy: keep, so it
  # survives an uninstall - for reinstalling by hand with Helm. Here removal goes through
  # Argo CD, and a kept ConfigMap would only be left behind as an orphan.
  preserve: false
  # Kyverno ignores Nodes by default; kube-prometheus-stack's network-policy.yaml generates a
  # NetworkPolicy per node from them. Only the Node itself comes off the filter list: its
  # subresources (`[Node/?*,*,*]`, the status every node reports every few seconds) stay
  # ignored, so only a node being added, relabelled or removed reaches Kyverno.
  resourceFiltersExclude:
    - "[Node,*,*]"
global:
  image:
    # The chart pulls from reg.kyverno.io by default; the same images are published on
    # ghcr.io, one of the registries allowed-registries.yaml admits.
    registry: ghcr.io
# Memory from what the controllers used over 2026-10-23..11-02: the request the p95 of real memory
# (working set minus active file cache), the limit twice the working set's p95; the chart's own
# (64-128Mi, limit 128-384Mi) did not fit. The reports controller grows with the number of policy
# reports.
#
# Real p95 86 MiB; working set p95 110 MiB, peak 120 MiB.
backgroundController:
  serviceMonitor:
    enabled: true
  resources:
    requests:
      memory: 96Mi
    limits:
      memory: 224Mi
# Real p95 89 MiB; working set p95 105 MiB, peak 112 MiB.
reportsController:
  serviceMonitor:
    enabled: true
  resources:
    requests:
      memory: 96Mi
    limits:
      memory: 224Mi
# Metrics for Prometheus: admission requests and policy results per controller. The monitors'
# CRD comes with kube-prometheus-stack.
#
# Real p95 89 MiB; working set p95 97 MiB, peak 101 MiB.
admissionController:
  serviceMonitor:
    enabled: true
  container:
    resources:
      requests:
        memory: 96Mi
      limits:
        memory: 224Mi
# Real p95 45 MiB; working set p95 68 MiB, peak 72 MiB.
cleanupController:
  serviceMonitor:
    enabled: true
  resources:
    requests:
      memory: 48Mi
    limits:
      memory: 160Mi
