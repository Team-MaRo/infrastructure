---
# Gives every namespace but a few system ones a LimitRange, so a container that sets no
# resources of its own gets requests and limits anyway: it can neither fill a node's 40 GB
# disk nor eat its memory. Defaults only, no max - an app that needs more sets resources on its containers,
# which always win over these.
#
# No CPU limit on purpose: a CPU limit throttles a container even while the node sits idle,
# whereas CPU requests already share it fairly under contention.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: default-resources
  annotations:
    # The CRD is installed by the chart in the same sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  evaluation:
    # Namespaces created before this policy get one too.
    generateExisting:
      enabled: true
    # The LimitRange follows edits to this policy and goes away with its namespace.
    synchronize:
      enabled: true
  # UPDATE as well as CREATE: with synchronize, Kyverno re-checks the policy on every change to
  # the namespace (an Argo CD sync of its namespace.yaml, a label), and a change that no longer
  # matches deletes the LimitRange - until the hourly generateExisting scan brought it back,
  # pods started in between ran without any defaults (seen 2026-10-06).
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  # Infrastructure is covered too: its components set their memory where the defaults would
  # not fit, so the LimitRange only fills in the rest. Left out are k3s's own namespace, whose
  # pods (CoreDNS, metrics-server, Helm install Jobs) k3s manages, system-upgrade, whose
  # upgrade Jobs set no memory and must not be killed halfway through replacing k3s, and the
  # two pod-less Kubernetes namespaces. kyverno gets none either: Kyverno's own resource
  # filter ignores its namespace, and its chart sets every container's resources.
  matchConditions:
    - name: not-system
      expression: >-
        !(object.metadata.name in ['kube-system', 'kube-public', 'kube-node-lease', 'system-upgrade'])
  variables:
    - name: limitRange
      expression: >-
        [
          {
            "apiVersion": dyn("v1"),
            "kind": dyn("LimitRange"),
            "metadata": dyn({
              "name": "default-resources",
              "namespace": object.metadata.name
            }),
            "spec": dyn({
              "limits": [{
                "type": dyn("Container"),
                "defaultRequest": dyn({"cpu": "50m", "memory": "64Mi", "ephemeral-storage": "50Mi"}),
                "default": dyn({"memory": "128Mi", "ephemeral-storage": "1Gi"})
              }]
            })
          }
        ]
  generate:
    - expression: generator.Apply(object.metadata.name, variables.limitRange)
