---
# The secret GitHub signs webhook deliveries with (OpenBao secret/argocd-webhook, 1Password
# "GitHub | infrastructure | Argo CD webhook"). argocd-secret points at it; Argo CD only
# follows such a reference to a Secret carrying its part-of label.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: github-secret
      remoteRef:
        key: argocd-webhook
        property: github-secret
