---
# Argo CD's read access to Team-MaRo/infrastructure-private, which the Application `private`
# (kubernetes/clusters/prod/private.yaml) syncs: a fine-grained token of the bot account
# MaRose-Bot, read-only on that repository alone, from OpenBao
# secret/argocd-repo-infrastructure-private. The label makes Argo CD read the Secret as a
# repository. The token expires every 31.12 and is renewed on 01.01 (README).
# 1Password "GitHub | MaRose-Bot | ArgoCD Infrastructure Private"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=xvqlbbv22gfv3grsa35sindt2e&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repository-infrastructure-private
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/Team-MaRo/infrastructure-private.git
        username: MaRose-Bot
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: argocd-repo-infrastructure-private
        property: token
