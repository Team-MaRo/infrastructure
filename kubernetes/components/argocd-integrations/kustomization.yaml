---
# What Argo CD needs from other components - cert-manager, External Secrets, the Prometheus
# operator - kept out of kubernetes/components/argocd, which ansible/roles/argocd bootstraps on
# a fresh cluster before those components (and their CRDs) exist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - external-secrets.yaml
  - repository-infrastructure-private.yaml
  - service-monitor.yaml
  - rules.yaml

# Shared settings (shared/): the openbao store and refresh for every ExternalSecret, the
# sync option for every monitor and rule.
components:
  - ../../shared/external-secret-defaults
  - ../../shared/monitoring-sync-options
