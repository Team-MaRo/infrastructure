---
# Matomo's database in the shared MariaDB: its reports, users, sites and plugin settings - all of
# Matomo that must survive, since its pod keeps nothing. mariadb-operator requires a User, its
# password Secret, a Grant and a Database to be in the MariaDB's namespace, so these objects live
# in mariadb although this component deploys them. The password comes from OpenBao
# secret/mariadb-apps/matomo; Matomo reads the same value in its own namespace.
# 1Password "MariaDB | Prod | matomo"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=y25mk6eqqqqgbxub7ikgodomdi&h=my.1password.com
#
# cleanupPolicy Skip on all three: the operator's default (Delete) would drop the database and
# the user when this component is removed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matomo-db
  namespace: mariadb
spec:
  data:
    - secretKey: password
      remoteRef:
        key: mariadb-apps/matomo
        property: password
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: matomo
  namespace: mariadb
spec:
  mariaDbRef:
    name: mariadb
  name: matomo
  characterSet: utf8mb4
  collate: utf8mb4_uca1400_ai_ci
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: matomo
  namespace: mariadb
spec:
  mariaDbRef:
    name: mariadb
  name: matomo
  host: "%"
  passwordSecretKeyRef:
    name: matomo-db
    key: password
  # Refused without TLS, so the password never crosses the network in the clear.
  require:
    ssl: true
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: matomo
  namespace: mariadb
spec:
  mariaDbRef:
    name: mariadb
  username: matomo
  host: "%"
  database: matomo
  table: "*"
  privileges:
    - ALL PRIVILEGES
  cleanupPolicy: Skip
