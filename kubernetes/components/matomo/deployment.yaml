---
# Matomo from the stock image, without a build, like the WordPress chart: the init container
# assembles it into an emptyDir at every start (prepare.sh), php-fpm runs it, nginx serves it.
# Everything that must survive is in its database and its bucket.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matomo
  annotations:
    # A new image under the same tag rolls it out (components/keel).
    keel.sh/policy: force
    keel.sh/matchTag: "true"
    keel.sh/trigger: poll
    # The secrets are read once, at start (components/reloader).
    secret.reloader.stakater.com/reload: matomo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matomo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matomo
    spec:
      # The preStop pause (10 s) plus php-fpm finishing running requests (up to 20 s).
      terminationGracePeriodSeconds: 40
      securityContext:
        # www-data in the Debian Matomo image; nginx keeps its own user (101), with 33 as group.
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare
          # Matomo 5 only: RebelOIDC does not support 6 yet (README "Upgrades").
          image: matomo:5-fpm
          imagePullPolicy: Always
          # Not under /var/www/html: the image declares that a VOLUME, so the runtime would put an
          # empty volume of its own there and the copy would never reach the pod's.
          workingDir: /matomo
          command: ["sh", "/config/prepare.sh"]
          env:
            - name: MATOMO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matomo
                  key: db-password
            - name: MATOMO_SALT
              valueFrom:
                secretKeyRef:
                  name: matomo
                  key: salt
            - name: MATOMO_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matomo
                  key: smtp-password
            # Only while a Google Analytics import runs (README "Google Analytics history").
            - name: MATOMO_GA_IMPORTER_KEY
              valueFrom:
                secretKeyRef:
                  name: matomo
                  key: ga-importer-key
                  optional: true
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: matomo
                  key: s3-access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: matomo
                  key: s3-secret-access-key
            # Matomo's recommendation for reports and archiving; the image's default is 256M.
            - name: PHP_MEMORY_LIMIT
              value: 512M
          securityContext: &restricted
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # A pod counts its largest init container's request for its whole life.
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: html
              mountPath: /matomo
            - name: config
              mountPath: /config
              readOnly: true
            - name: mariadb-ca
              mountPath: /etc/mariadb-ca
              readOnly: true
      containers:
        - name: php-fpm
          image: matomo:5-fpm
          imagePullPolicy: Always
          # All containers get the stop signal at once, while Traefik still sends requests to the
          # pod for a moment; each keeps serving 10 s more, so the pod leaves the endpoints first.
          lifecycle: &drain
            preStop:
              sleep:
                seconds: 10
          env:
            - name: PHP_MEMORY_LIMIT
              value: 512M
          securityContext: *restricted
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: html
              mountPath: /var/www/html
              subPath: html
            - name: config
              mountPath: /usr/local/etc/php-fpm.d/zz-matomo.conf
              subPath: php-fpm.conf
              readOnly: true
            - name: mariadb-ca
              mountPath: /etc/mariadb-ca
              readOnly: true
        - name: nginx
          # Without docker.io/: Keel writes the short form back (components/keel).
          image: nginxinc/nginx-unprivileged:stable
          imagePullPolicy: Always
          lifecycle: *drain
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8081
            - name: metrics
              containerPort: 9253
          # The tracker endpoint, through nginx and php-fpm: what the sites depend on.
          readinessProbe:
            httpGet:
              path: /matomo.php
              port: http
              httpHeaders:
                - name: Host
                  value: matomo.d3strukt0r.dev
                # As Traefik sends it, or force_ssl answers the probe with a redirect.
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 30
            timeoutSeconds: 10
          # Liveness asks nginx alone: restarting nginx cannot help a slow PHP.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: html
              mountPath: /var/www/html
              subPath: html
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: html
          emptyDir:
            # The code (~100 MB) and the GeoIP database (~130 MB).
            sizeLimit: 1Gi
        - name: config
          configMap:
            name: matomo
        - name: mariadb-ca
          configMap:
            name: mariadb-ca
