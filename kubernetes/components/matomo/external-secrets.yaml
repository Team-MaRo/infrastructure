---
# What Matomo needs at start (prepare.sh writes the first two into its config.ini.php):
# - db-password: its database user's (secret/mariadb-apps/matomo, the value database.yaml gives
#   the user). Letters and digits only, since it lands in an ini file.
# - salt: Matomo's [General] salt (secret/matomo), which signs its sessions and hashes its API
#   tokens - it must never change, or every token stops working (README "Installing").
# - s3-access-key-id, s3-secret-access-key: the key to its bucket d3strukt0r-prod-matomo
#   (secret/matomo-s3), for the GeoIP database.
# - smtp-password: its mailomat login matomo@mailomat.d3strukt0r.dev (secret/matomo-mailomat), for
#   the scheduled email reports. Letters and digits only, like the database password.
# - ga-importer-key: the GoogleAnalyticsImporter's encryption_key (secret/matomo), which encrypts
#   its Google OAuth credentials in the database - it must never change either.
# 1Password "MariaDB | Prod | matomo"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=y25mk6eqqqqgbxub7ikgodomdi&h=my.1password.com
# 1Password "Matomo | Prod | salt"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=754ixrqhxttvt4ryqgucloapda&h=my.1password.com
# 1Password "Hetzner | S3 | prod matomo"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=4vhpkhsjy4meb3pqhgvhu2zsge&h=my.1password.com
# 1Password "Mailomat | Prod | matomo"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=fq2kn2amieb2g7bmvjxurwbf6q&h=my.1password.com
# 1Password "Matomo | Prod | google-analytics-importer"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=baz73i3zj27m4syuer4qyedqgy&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matomo
spec:
  data:
    - secretKey: db-password
      remoteRef:
        key: mariadb-apps/matomo
        property: password
    - secretKey: salt
      remoteRef:
        key: matomo
        property: salt
    - secretKey: s3-access-key-id
      remoteRef:
        key: matomo-s3
        property: access-key
    - secretKey: s3-secret-access-key
      remoteRef:
        key: matomo-s3
        property: secret-key
    - secretKey: smtp-password
      remoteRef:
        key: matomo-mailomat
        property: password
    - secretKey: ga-importer-key
      remoteRef:
        key: matomo
        property: ga-importer-key
