; php-fpm settings beside the image's, as in the WordPress chart.
[global]
; On a stop running requests may finish for up to 20 s; the preStop pause comes first.
process_control_timeout = 20s

[www]
; Pool figures for Prometheus through nginx's metrics server (default.conf), from a pool of its own
; so they still come while every worker is busy. Only on localhost.
pm.status_path = /status
pm.status_listen = 127.0.0.1:9001
; A worker restarts after 500 requests, so a leak cannot grow it without end.
pm.max_requests = 500
