---
# The visitors' locations: DB-IP's free city database (CC BY 4.0, README "GeoIP"), fetched once a
# month into the bucket d3strukt0r-prod-matomo, from which every Matomo start copies it. DB-IP
# publishes a new one at the start of each month. A failed run raises kube-prometheus-stack's
# KubeJobFailed; Matomo keeps last month's database meanwhile.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: geoip
  annotations:
    keel.sh/policy: force
    keel.sh/matchTag: "true"
    keel.sh/trigger: poll
spec:
  schedule: "17 6 3 * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            # curl_user in the curl image.
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: geoip
              # Without docker.io/: Keel writes the short form back (components/keel).
              image: curlimages/curl:latest
              imagePullPolicy: Always
              command:
                - sh
                - -ec
                - |
                  cd /work
                  curl -fsSL --retry 3 -o db.mmdb.gz "https://download.db-ip.com/free/dbip-city-lite-$(date -u +%Y-%m).mmdb.gz"
                  gunzip db.mmdb.gz
                  # Uploaded unsigned-payload: S3 over HTTPS accepts it, and curl need not hash
                  # 130 MB first.
                  curl -fsS --retry 3 --aws-sigv4 "aws:amz:nbg1:s3" --user "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" \
                    -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" -T db.mmdb \
                    https://d3strukt0r-prod-matomo.nbg1.your-objectstorage.com/geoip/DBIP-City-Lite.mmdb
                  echo "DB-IP city lite $(date -u +%Y-%m) uploaded ($(wc -c < db.mmdb) bytes)"
              env:
                - name: S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: matomo
                      key: s3-access-key-id
                - name: S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: matomo
                      key: s3-secret-access-key
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 512Mi
