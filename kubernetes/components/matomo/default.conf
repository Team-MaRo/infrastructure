# nginx in front of php-fpm, both in the matomo pod; TLS is Traefik's. After Matomo's own nginx
# configuration, as of its last change (2022-08-16):
# https://github.com/matomo-org/matomo-nginx/blob/6ab25dd2e7c16aece588737571b3ef616bde9925/sites-available/matomo.conf
# PHP only through its four entry points, the code's directories denied. nginx uses the first
# matching regex location, so the order matters. Left out of it: the port-80 server and TLS
# (Traefik's), its own log files (the container's output goes to Loki), the paid heatmap plugin's
# entry point and X-XSS-Protection (ignored by today's browsers).
server {
    listen 8081;
    server_name _;
    root /var/www/html;
    index index.php;

    # Directory redirects carry only the path, not nginx's http and port 8081.
    absolute_redirect off;

    # The visitor's address from Cloudflare, as in the WordPress chart's nginx (same trade-off:
    # 443 is open to everyone, so a client that skips Cloudflare can pick it). Matomo itself reads
    # CF-Connecting-IP (common.config.ini.php); this is for nginx's log.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;

    # Room for the headers of a login: the redirect to Zitadel's logout carries the whole ID token.
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;

    # Outgoing links do not reveal the Matomo URL they were followed from.
    add_header Referrer-Policy origin always;
    add_header X-Content-Type-Options "nosniff" always;

    # The liveness probe: nginx answers alone (deployment.yaml).
    location = /healthz {
        access_log off;
        return 204;
    }

    location ~ ^/(?:index|matomo|piwik|js/index)\.php$ {
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~* ^.+\.php$ {
        return 403;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(?:config|tmp|core|lang) {
        return 403;
    }

    location ~ /\. {
        return 403;
    }

    # Tag Manager's preview containers are never cached.
    location ~ js/container_.*_preview\.js$ {
        expires off;
        add_header Cache-Control "private, no-cache, no-store";
    }

    location ~* \.(?:gif|ico|jpg|png|svg|js|css|htm|html|mp3|mp4|wav|ogg|avi|ttf|eot|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ ^/(?:libs|vendor|plugins|misc|node_modules) {
        return 403;
    }

    location ~ /(?:.*\.md|LEGALNOTICE|LICENSE)$ {
        default_type text/plain;
    }
}

# php-fpm's pool figures for Prometheus (pod-monitor.yaml), as in the WordPress chart: only this
# port, which neither the Service nor the Ingress knows.
server {
    listen 9253;
    server_name _;
    access_log off;

    location = /metrics {
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /status;
        fastcgi_param SCRIPT_FILENAME /status;
        fastcgi_param QUERY_STRING openmetrics;
        fastcgi_connect_timeout 1s;
        fastcgi_read_timeout 2s;
        fastcgi_pass 127.0.0.1:9001;
    }

    location / {
        return 404;
    }
}
