# Helm values for mariadb-operator; the chart version is pinned in the cluster's Application,
# the CRDs come from their own chart and Application (mariadb-operator-crds). The operator
# runs the app database: a primary and a replica with automatic failover, backups and
# point-in-time recovery (kubernetes/components/mariadb).

# The chart sets no securityContext at all, and namespace mariadb-operator enforces the
# restricted Pod Security Standard. The image runs as numeric UID 65532.
podSecurityContext: &podSecurityContext
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext: &securityContext
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
# It watches every namespace, so its memory grows with the cluster. Over 2026-10-23..11-02: real
# memory (working set minus active file cache) p95 94 MiB, the request; working set p95 98 MiB,
# peak 107 MiB, the limit twice that p95.
resources:
  requests:
    memory: 96Mi
  limits:
    memory: 224Mi
metrics:
  enabled: true
# Two replicas on different nodes, one active through leader election: the operator performs
# the failover, and a single replica on the primary's node would die with it - the failover
# would then wait for Kubernetes to move the operator, about five minutes. The standby takes over
# once the leader's 15-second lease runs out.
ha:
  enabled: true
  replicas: 2
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: mariadb-operator
pdb:
  enabled: true

webhook:
  # A certificate from cert-manager (a self-signed Issuer of its own - an ACME issuer cannot
  # certify .svc names), instead of the chart's cert-controller Deployment, which then is not
  # rendered.
  cert:
    certManager:
      enabled: true
  podSecurityContext: *podSecurityContext
  securityContext: *securityContext
  # Two replicas on different nodes. Every change to a MariaDB passes this webhook
  # (failurePolicy Fail), the operator's own failover included: with one replica on the node
  # that died with the primary, the failover could not write and hung until the node was
  # declared gone (failover test, 2026-09-28).
  ha:
    enabled: true
    replicas: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mariadb-operator-webhook
  pdb:
    enabled: true
  # Real p95 34 MiB, the request; working set peak 43 MiB, the limit kept at 96Mi.
  resources:
    requests:
      memory: 48Mi
    limits:
      memory: 96Mi

# Defaults for the pods the operator creates. Written fully qualified, so the registry check
# in kubernetes/components/kyverno does not depend on how short names are resolved; each
# MariaDB resource names its own image anyway.
config:
  mariadbImage:
    repository: docker.io/library/mariadb
  exporterImage:
    repository: quay.io/prometheus/mysqld-exporter
  maxscaleImage:
    repository: docker.io/mariadb/maxscale
  exporterMaxscaleImage:
    repository: docker.io/mariadb/maxscale-prometheus-exporter-ubi
