---
# Traefik is k3s's own: k3s installs it from its bundled chart (HelmChart kube-system/traefik)
# and merges a HelmChartConfig of the same name into its values - this is the only place it is
# configured.
#
# It runs as a DaemonSet on every ingress node's host network and listens on the node's
# ports 80 and 443 itself, IPv4 and IPv6. The cluster is single-stack IPv4, so servicelb could
# only ever forward IPv4; on the host network Traefik accepts IPv6 directly and talks to the
# pods over the IPv4 pod network. The ingress nodes are the ones labelled below - the same set
# as the DNS records for prod.d3strukt0r.dev (tofu/cloudflare) and, later, a load balancer's
# targets. Binding 80/443 without root relies on net.ipv4.ip_unprivileged_port_start = 80 on
# the nodes (ansible/roles/k3s).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      kind: DaemonSet
      # Resolve cluster names although the pod uses the host's resolver otherwise.
      dnsPolicy: ClusterFirstWithHostNet
      # Traefik reads plugins only at start: the plugin source's hash, so a change to it changes
      # this file and rolls Traefik. go test in plugins/upload-scan fails until it matches
      # (README "Upload scan").
      podAnnotations:
        upload-scan/source: "32ebc710396d0668"
      # The upload-scan plugin's source (kustomization.yaml).
      additionalVolumes:
        - name: upload-scan
          configMap:
            name: traefik-upload-scan
    # Our own plugin, loaded from that volume - no image, no plugin registry (README "Upload
    # scan").
    experimental:
      localPlugins:
        upload-scan:
          type: localPath
          moduleName: github.com/team-maro/uploadscan
          mountPath: /plugins-local/src/github.com/team-maro/uploadscan
          volumeName: upload-scan
    nodeSelector:
      node-role.kubernetes.io/ingress: "true"
    hostNetwork: true
    # Two Traefiks cannot hold the same host port, so an update replaces one node's pod at a
    # time instead of starting the new one first. That node's share of requests fails for the
    # few seconds in between; a load balancer with health checks would close that gap.
    updateStrategy:
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    # Headers that turn into a real one's name once a backend maps "_" to "-" (X_Forwarded_For
    # for X-Forwarded-For - PHP's $_SERVER does) are dropped, so a client cannot slip one past
    # what Traefik sets. Per entry point; "reject" would answer 400 to clients that send them.
    ports:
      # An upload must arrive in full within the read timeout, counted from the request's start:
      # 60 s by default cut off large uploads over slow connections, and the upload scan's wait
      # for memory comes on top (README "Upload scan"). Cloudflare passes uploads on as they
      # arrive (measured 2026-11-08).
      web:
        port: 80
        transport:
          respondingTimeouts:
            readTimeout: 300s
        http:
          aliasHeadersStrategy: delete
      websecure:
        port: 443
        transport:
          respondingTimeouts:
            readTimeout: 300s
        http:
          aliasHeadersStrategy: delete
          # No entry-point middlewares: the per-visitor rate limit is part of cloudflare-only on
          # each proxied route (kubernetes/charts/cloudflare-only), since DNS-only routes share
          # this port and their clients carry no CF-Connecting-IP to tell them apart.
      metrics:
        http:
          aliasHeadersStrategy: delete
      traefik:
        http:
          aliasHeadersStrategy: delete
    # ClusterIP instead of LoadBalancer, so servicelb stops claiming the nodes' 80 and 443.
    service:
      spec:
        type: ClusterIP
    # An Ingress's status names its address, and Argo CD counts an Ingress healthy only once
    # that is set. k3s copies it from Traefik's Service, which as ClusterIP has none, so name the
    # cluster's DNS entry point instead.
    providers:
      kubernetesIngress:
        publishedService:
          enabled: false
        ingressEndpoint:
          hostname: prod.d3strukt0r.dev
      # Names generated from CRDs join namespace and name with "_" (phpmyadmin_oauth2-proxy), so
      # two objects can never end up with the same name. An Ingress references a Middleware as
      # <namespace>_<name>@kubernetescrd.
      kubernetesCRD:
        safeNaming: true
    # The dashboard (read-only: routers, services, middlewares, certificates) at
    # traefik.d3strukt0r.dev, only through Cloudflare (charts/cloudflare-only) and behind the
    # Zitadel login gate (middleware-oauth2-proxy.yaml).
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.d3strukt0r.dev`)
        entryPoints:
          - websecure
        # upload-scan's first route (README "Upload scan"), after the login gate: only logged-in
        # admins can make it buffer and scan.
        middlewares:
          - name: cloudflare-only
          - name: oauth2-proxy
          - name: upload-scan
        tls:
          secretName: traefik-tls
    # Traefik's own log (start, configuration, backend and TLS errors) as JSON too, so both logs
    # of the container filter alike in Loki (| json).
    log:
      format: json
    # A trace per request, sent over OTLP to the Alloy on the same node, which forwards it to
    # Tempo (components/alloy, components/tempo). Every request is traced (the default sample
    # rate, 1.0), and the access log gets each request's TraceId, which Grafana links to its
    # trace. The host network resolves the Service name (dnsPolicy ClusterFirstWithHostNet).
    tracing:
      otlp:
        enabled: true
        grpc:
          enabled: true
          endpoint: alloy.kube-system.svc:4317
          # Plain gRPC to Alloy inside the cluster.
          insecure: true
    # Access log as JSON on stdout (to Loki through Alloy), but only for requests that failed
    # (400-599) or took over 2 s - what visitors got during an incident, with little volume and
    # personal data. Headers stay dropped except the visitor's address behind Cloudflare
    # (CF-Connecting-IP; the client address Traefik sees is Cloudflare's) and the user agent;
    # query strings are dropped from the path, since URLs can carry tokens.
    accessLog:
      enabled: true
      format: json
      filters:
        statusCodes: "400-599"
        minDuration: "2s"
      fields:
        headers:
          names:
            CF-Connecting-IP: keep
            User-Agent: keep
        queryParameters:
          defaultMode: drop
    # Over 2026-10-23..11-02: real memory (working set minus active file cache) p95 104 MiB, the
    # request; working set p95 123 MiB, peak 141 MiB. The limit leaves
    # room for bursts: 256Mi was OOM-killed on prod-02 by a scanner's burst of requests
    # (2026-10-07 00:09), and a limit does not hold back scheduling. The chart sets none, and
    # kube-system has no LimitRange. Since the upload scan the limit is sized by its design, not
    # by measured use as the repo's rule does: 404 MiB of bodies in flight plus one being joined
    # (four 90 MB multipart uploads at once: 535-630 MiB peak in Docker on a base of ~40 MiB, so
    # up to ~730 here; 480-550 MiB chunked, 2026-11-09). The chart sets Go's GOMEMLIMIT to 90 %
    # of the limit (921MiB), so the garbage collector frees what is left before the limit is hit.
    resources:
      requests:
        memory: 112Mi
      limits:
        memory: 1Gi
