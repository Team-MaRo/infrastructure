---
# The upload scan (plugins/upload-scan, README "Upload scan"): hands every uploaded file to the
# shared clamd and logs the verdict - report mode, nothing is refused yet. Only what differs from
# the plugin's defaults (CreateConfig in config.go); Traefik applies a change without a restart.
# The limits that size its memory are in the code (body.go).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: upload-scan
  namespace: kube-system
spec:
  plugin:
    upload-scan:
      clamd: clamav.clamav.svc:3310
