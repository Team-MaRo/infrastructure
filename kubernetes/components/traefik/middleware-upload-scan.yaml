---
# The upload scan (plugins/upload-scan, README "Upload scan"): hands every uploaded file to the
# shared clamd, logs the verdict and refuses what it does not call clean (mode: block; report lets
# everything pass, README "Switching back to report mode"). Only what differs from the plugin's
# defaults (CreateConfig in config.go); Traefik applies a change without a restart. The limits
# that size its memory are in the code (body.go).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: upload-scan
  namespace: kube-system
spec:
  plugin:
    upload-scan:
      mode: block
      clamd: clamav.clamav.svc:3310
