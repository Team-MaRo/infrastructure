---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmchartconfig.yaml
  - certificate.yaml
  - middleware-oauth2-proxy.yaml
  - middleware-upload-scan.yaml
  - pod-monitor.yaml
  # Only Cloudflare reaches its proxied routes (charts/cloudflare-only).
  - ../../charts/cloudflare-only/files

# The upload-scan plugin's source, mounted into Traefik (helmchartconfig.yaml). A fixed name, as
# the HelmChartConfig names it; a change takes effect when Traefik restarts, which the source's
# hash there (upload-scan/source, checked by go test) does (README "Upload scan").
configMapGenerator:
  - name: traefik-upload-scan
    namespace: kube-system
    files:
      - plugins/upload-scan/go.mod
      - .traefik.yml=plugins/upload-scan/.traefik.yml
      - plugins/upload-scan/ambiguous.go
      - plugins/upload-scan/body.go
      - plugins/upload-scan/check.go
      - plugins/upload-scan/client.go
      - plugins/upload-scan/clamd.go
      - plugins/upload-scan/config.go
      - plugins/upload-scan/filter.go
      - plugins/upload-scan/log.go
      - plugins/upload-scan/messages.go
      - plugins/upload-scan/multipart.go
      - plugins/upload-scan/negotiate.go
      - plugins/upload-scan/pool.go
      - plugins/upload-scan/queue.go
      - plugins/upload-scan/refuse.go
      - plugins/upload-scan/respond.go
    options:
      disableNameSuffixHash: true

# The sync option for every monitor and rule here (shared/).
components:
  - ../../shared/monitoring-sync-options
