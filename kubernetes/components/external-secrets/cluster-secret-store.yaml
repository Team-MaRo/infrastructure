---
# The one store every ExternalSecret in the cluster reads from: OpenBao's KV v2 engine at
# secret/, configured in tofu/openbao. External Secrets logs in with its own service account
# token through OpenBao's Kubernetes auth, as role external-secrets - which may read all of
# secret/, so any namespace referencing this store reaches every value.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    # The CRD is installed by the chart in the same sync; without this the dry run fails on
    # a kind the API server does not know yet.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      # Plain HTTP until cert-manager gives OpenBao a certificate.
      server: http://openbao.openbao.svc:8200
      path: secret
      auth:
        kubernetes:
          role: external-secrets
