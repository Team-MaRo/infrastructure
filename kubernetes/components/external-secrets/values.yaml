# Helm values for the external-secrets chart; the chart version is pinned in the cluster's
# Application. Memory where the namespace's LimitRange defaults (32Mi, limit 128Mi) do not
# fit, from what the containers used: the request the p95 of real memory (working set minus
# active file cache), the limit the expected peak ÷ 0.8.
#
# Over 2026-11-13..18 (5 days, a longer window to come): real p95 88 MiB, the request; the
# kernel's peak 200 MiB ÷ 0.8, the limit.
resources:
  requests:
    memory: 96Mi
  limits:
    memory: 256Mi
# Over 2026-11-13..18 (5 days, a longer window to come): real p95 94 MiB, the request; the
# kernel's peak 184 MiB ÷ 0.8, the limit.
certController:
  resources:
    requests:
      memory: 96Mi
    limits:
      memory: 256Mi
# Over 2026-11-13..18 (5 days, a longer window to come): real p95 52 MiB, the request; working set
# peak 91 MiB, the limit kept at 128Mi.
webhook:
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 128Mi

# Prometheus scrapes the controller, the webhook and the cert controller (one switch for all
# three), so the alert in rules.yaml sees an ExternalSecret that stops syncing. The chart renders
# the ServiceMonitors only where their CRD exists (renderMode skipIfMissing); it comes with
# kube-prometheus-stack.
serviceMonitor:
  enabled: true
