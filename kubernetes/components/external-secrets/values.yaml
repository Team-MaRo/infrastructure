# Helm values for the external-secrets chart; the chart version is pinned in the cluster's
# Application. Memory where the namespace's LimitRange defaults (32Mi, limit 128Mi) do not
# fit, from what the containers used over 2026-10-23..11-02: the request the p95 of real memory
# (working set minus active file cache), the limit twice the working set's p95.
#
# Real p95 75 MiB; working set p95 104 MiB, peak 109 MiB.
resources:
  requests:
    memory: 80Mi
  limits:
    memory: 224Mi
# Real p95 90 MiB; working set p95 110 MiB, peak 113 MiB.
certController:
  resources:
    requests:
      memory: 96Mi
    limits:
      memory: 224Mi
# Real p95 44 MiB; working set peak 46 MiB, the limit kept at 128Mi.
webhook:
  resources:
    requests:
      memory: 48Mi
    limits:
      memory: 128Mi

# Prometheus scrapes the controller, the webhook and the cert controller (one switch for all
# three), so the alert in rules.yaml sees an ExternalSecret that stops syncing. The chart renders
# the ServiceMonitors only where their CRD exists (renderMode skipIfMissing); it comes with
# kube-prometheus-stack.
serviceMonitor:
  enabled: true
