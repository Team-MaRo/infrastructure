---
# Moves the primary off a node that kured wants to reboot. kured never drains the primary's node
# (its --blocking-pod-selector, kubernetes/components/kured/), because an evicted primary fails
# over without being demoted and comes back unable to rejoin - error 1236, a full rebuild from a
# backup (mariadb-operator#1948; night of 2026-11-03). kured marks a node waiting for a reboot
# with an annotation; this switches the primary to the other pod, the planned switchover the
# operator does cleanly, and kured reboots the node on its next round. Checks every 5 minutes.
# kured removes the mark only after a reboot it did itself, so the switch also needs kured's own
# metric kured_reboot_required at 1 in Prometheus - a node rebooted otherwise (a resize) keeps a
# stale mark.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mariadb-primary-off-rebooting-node
---
# Reading the MariaDB and its two pods, and switching the primary - nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mariadb-primary-off-rebooting-node
rules:
  - apiGroups: [k8s.mariadb.com]
    resources: [mariadbs]
    resourceNames: [mariadb]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    resourceNames: [mariadb-0, mariadb-1]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mariadb-primary-off-rebooting-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mariadb-primary-off-rebooting-node
subjects:
  - kind: ServiceAccount
    name: mariadb-primary-off-rebooting-node
---
# Nodes are cluster-scoped: reading their annotations needs a ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mariadb-primary-off-rebooting-node
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mariadb-primary-off-rebooting-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mariadb-primary-off-rebooting-node
subjects:
  - kind: ServiceAccount
    name: mariadb-primary-off-rebooting-node
    namespace: mariadb
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-primary-off-rebooting-node
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            # Prometheus admits exactly these pods (kube-prometheus-stack's network-policy.yaml).
            app.kubernetes.io/name: mariadb-primary-off-rebooting-node
        spec:
          serviceAccountName: mariadb-primary-off-rebooting-node
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: switch
              image: docker.io/alpine/kubectl:1.37.1
              env:
                # kubectl keeps its discovery cache under $HOME.
                - name: HOME
                  value: /tmp
              # Two pods, so the other one is 1 - the primary's index. A node is due for a reboot
              # when kured_reboot_required is 1 (Prometheus). The primary's node also needs kured's
              # mark - kured is in its window and blocked there; without an answer from Prometheus
              # the mark alone counts. The switch needs the MariaDB Ready, no switch under way, and
              # the other pod Ready, not terminating, on a node neither cordoned (kured cordons
              # before it drains) nor due itself - then kured reboots that node first, the replica
              # moves on, and the switch follows once it sits on a node that is not due.
              # Otherwise kured keeps waiting (NodeRebootPending after a day).
              command:
                - sh
                - -euc
                - |
                  get() { kubectl -n mariadb get "$1" -o jsonpath="$2"; }
                  # kube-router admits a new pod's IP to Prometheus's NetworkPolicy only seconds
                  # after it starts (connection refused until then), so the query is retried.
                  due() {
                    for attempt in 1 2 3 4; do
                      metric=$(wget -T 5 -qO- "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/query?query=max(kured_reboot_required%7Bnode%3D%22$1%22%7D)" 2>&1) && break
                      sleep 3
                    done
                    case "$metric" in
                      *'"value":['*',"1"]'*) echo yes ;;
                      *'"value":['*',"0"]'*) echo no ;;
                      *) echo unknown ;;
                    esac
                  }
                  current=$(get mariadb/mariadb '{.status.currentPrimaryPodIndex}')
                  wanted=$(get mariadb/mariadb '{.spec.replication.primary.podIndex}')
                  ready=$(get mariadb/mariadb '{.status.conditions[?(@.type=="Ready")].status}')
                  node=$(get pod/mariadb-"$current" '{.spec.nodeName}')
                  mark=$(kubectl get node "$node" -o jsonpath='{.metadata.annotations.weave\.works/kured-reboot-in-progress}')
                  if [ -z "$mark" ]; then
                    echo "Primary mariadb-$current on $node, kured wants no reboot there now."
                    exit 0
                  fi
                  node_due=$(due "$node")
                  if [ "$node_due" = no ]; then
                    echo "$node carries kured's mark but needs no reboot - rebooted outside kured, stale mark; no switch."
                    exit 0
                  fi
                  [ "$node_due" = yes ] || echo "No answer from Prometheus for $node - going by kured's mark alone."
                  other=$((1 - current))
                  other_node=$(get pod/mariadb-"$other" '{.spec.nodeName}')
                  if [ -z "$other_node" ]; then
                    echo "$node waits for a reboot, but no switch now: mariadb-$other is not scheduled on any node."
                    exit 0
                  fi
                  other_ready=$(get pod/mariadb-"$other" '{.status.conditions[?(@.type=="Ready")].status}')
                  other_deleting=$(get pod/mariadb-"$other" '{.metadata.deletionTimestamp}')
                  other_cordoned=$(kubectl get node "$other_node" -o jsonpath='{.spec.unschedulable}')
                  other_due=$(due "$other_node")
                  if [ "$ready" != True ] || [ "${wanted:-$current}" != "$current" ] || [ "$other_ready" != True ] \
                    || [ -n "$other_deleting" ] || [ "$other_cordoned" = true ] || [ "$other_due" = yes ]; then
                    echo "$node waits for a reboot, but no switch now: MariaDB Ready=$ready, podIndex $wanted, current $current; mariadb-$other on $other_node Ready=$other_ready, terminating=${other_deleting:-no}, cordoned=${other_cordoned:-false}, due for a reboot=$other_due."
                    exit 0
                  fi
                  echo "$node waits for a reboot: switching the primary from mariadb-$current to mariadb-$other on $other_node (due for a reboot there: $other_due)."
                  kubectl -n mariadb patch mariadb mariadb --type=merge \
                    -p "{\"spec\":{\"replication\":{\"primary\":{\"podIndex\":$other}}}}"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
