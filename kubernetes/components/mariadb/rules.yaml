---
# Alerts for the app database. The first one is the reason for the others' names: a failover
# can hang on a hard node loss (mariadb-operator#1628), and it must not hang unnoticed.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mariadb
spec:
  groups:
    - name: mariadb
      rules:
        # Apps write through the Service mariadb-primary; without a ready endpoint behind it
        # they cannot. Five minutes covers a normal failover, a restart or an upgrade.
        - alert: MariaDBNoReadyPrimary
          expr: absent(kube_endpointslice_endpoints{namespace="mariadb", endpointslice=~"mariadb-primary-.+", ready="true"})
          for: 5m
          labels:
            severity: critical
            namespace: mariadb
          annotations:
            summary: "MariaDB has had no ready primary for 5 minutes - apps cannot write."
            description: >-
              A failover may be hanging. Check kubectl -n mariadb get mariadb mariadb and its
              status.replication; if the primary's node is dead, follow the runbook in
              kubernetes/components/mariadb/README.md ("Failover hangs").
        - alert: MariaDBReplicationBroken
          expr: mysql_slave_status_slave_io_running{namespace="mariadb"} == 0 or mysql_slave_status_slave_sql_running{namespace="mariadb"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "MariaDB replication on {{ $labels.instance }} has been stopped for 10 minutes."
            description: >-
              The operator rebuilds a replica whose replication stays broken from a fresh
              backup (replica recovery); if this persists, check the MariaDB's status and the
              operator's log (kubectl -n mariadb-operator logs deploy/mariadb-operator).
        - alert: MariaDBReplicaLagging
          expr: mysql_slave_status_seconds_behind_master{namespace="mariadb"} > 300
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "MariaDB replica {{ $labels.instance }} is {{ $value | humanizeDuration }} behind."
            description: >-
              A lagging replica cannot take over without losing the transactions it lacks,
              and blocks switchovers.
        # From the operator's status conditions (kube-state-metrics' custom resource metrics,
        # configured in the kube-prometheus-stack values). Archiving stops at a file it cannot
        # read, and point-in-time recovery then stays at the last good one; writes go on.
        - alert: MariaDBBinlogArchivingFailing
          expr: kube_customresource_condition{customresource_kind="MariaDB", namespace="mariadb", type="BinlogsArchived", status!="True"}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "MariaDB {{ $labels.name }} has not archived its binary logs for 30 minutes ({{ $labels.reason }})."
            description: >-
              Point-in-time recovery cannot go past the last archived file. The MariaDB's
              status message names the file; follow the runbook in
              kubernetes/components/mariadb/README.md ("Binary log archiving stuck").
        # Either the last backup did not complete (a failed Job leaves Complete=False, and the
        # True series then disappears), or none has completed for 26 hours - the nightly one
        # plus slack. Also catches a failed backup of the after-switchover CronJob, which does
        # not retry. Two hours is far longer than a backup runs.
        - alert: MariaDBBackupFailed
          expr: |-
            max by (name) (kube_customresource_condition{customresource_kind="PhysicalBackup", namespace="mariadb", name="mariadb-daily", type="Complete", status!="True"})
            or
            time() - max by (name) (kube_customresource_condition{customresource_kind="PhysicalBackup", namespace="mariadb", name="mariadb-daily", type="Complete", status="True"}) > 26 * 3600
          for: 2h
          labels:
            severity: warning
            namespace: mariadb
          annotations:
            summary: "MariaDB's physical backup mariadb-daily has not succeeded."
            description: >-
              Without a fresh backup, a restore starts from an older one and replays more binary
              logs - and those expire after 35 days. Check kubectl -n mariadb get physicalbackup
              and the log of the latest mariadb-daily Job, then start one by hand with the
              command in kubernetes/components/mariadb/README.md ("Failover hangs").
        # Usually 2-5 queries run at once. On 2026-10-06 the primary stopped answering and
        # running queries climbed to 47 within four minutes until the operator switched over;
        # what jammed it was not recorded. This fires while it happens, and the slow log (myCnf)
        # now records the queries.
        - alert: MariaDBQueriesPilingUp
          expr: max by (namespace) (mysql_global_status_threads_running{namespace="mariadb"}) > 20
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} queries are running at once on the MariaDB primary."
            description: >-
              Queries are piling up - a long query or a lock blocks the rest. While it lasts, run
              SHOW FULL PROCESSLIST on the primary; afterwards the slow queries are in Loki
              ({namespace="mariadb", container="mariadb"} |= "Query_time"). Runbook in
              kubernetes/components/mariadb/README.md ("Queries pile up").
