---
# The root and replication passwords (OpenBao secret/mariadb). Changing them in OpenBao does
# not change them in MariaDB, which keeps what it was initialised with.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: root-password
      remoteRef:
        key: mariadb
        property: root-password
    - secretKey: repl-password
      remoteRef:
        key: mariadb
        property: repl-password
---
# The S3 key backups and binary logs are written with (OpenBao secret/mariadb-backups-s3);
# the bucket's policy admits only this key and the admin's.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-backups-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: access-key-id
      remoteRef:
        key: mariadb-backups-s3
        property: access-key
    - secretKey: secret-access-key
      remoteRef:
        key: mariadb-backups-s3
        property: secret-key
