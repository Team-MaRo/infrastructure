---
# The root and replication passwords (OpenBao secret/mariadb). Changing them in OpenBao does
# not change them in MariaDB, which keeps what it was initialised with.
# 1Password "MariaDB | Prod | Root & replication"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=uxnuz66uu5e2jojwk5xqq3tpgi&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: root-password
      remoteRef:
        key: mariadb
        property: root-password
    - secretKey: repl-password
      remoteRef:
        key: mariadb
        property: repl-password
---
# The S3 key backups and binary logs are written with (OpenBao secret/mariadb-backups-s3);
# the bucket's policy admits only this key and the admin's.
# 1Password "Hetzner | S3 | prod mariadb backups"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=qttplkz3cky6llsjgw7zhww5bu&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-backups-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: access-key-id
      remoteRef:
        key: mariadb-backups-s3
        property: access-key
    - secretKey: secret-access-key
      remoteRef:
        key: mariadb-backups-s3
        property: secret-key
