---
# Loki's own S3 key (OpenBao secret/loki-s3), as the environment variables its config expands.
# The bucket policy admits only this key and the admin's.
# 1Password "Hetzner | S3 | prod loki"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=obsu3brgoh5l3yxawnbbvq4wi4&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: LOKI_S3_ACCESS_KEY
      remoteRef:
        key: loki-s3
        property: access-key
    - secretKey: LOKI_S3_SECRET_KEY
      remoteRef:
        key: loki-s3
        property: secret-key
