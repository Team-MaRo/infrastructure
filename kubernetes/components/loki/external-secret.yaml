---
# Loki's own S3 key (OpenBao secret/loki-s3), as the environment variables its config expands.
# The bucket policy admits only this key and the admin's.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: loki-s3
  data:
    - secretKey: LOKI_S3_ACCESS_KEY
      remoteRef:
        key: loki-s3
        property: access-key
    - secretKey: LOKI_S3_SECRET_KEY
      remoteRef:
        key: loki-s3
        property: secret-key
