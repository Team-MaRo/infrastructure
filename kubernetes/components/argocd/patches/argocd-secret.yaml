---
# GitHub signs every webhook delivery with a shared secret, and Argo CD ignores deliveries that
# do not match. The value here is only a reference to the Secret argocd-webhook, which External
# Secrets fills from OpenBao (kubernetes/components/argocd-integrations/) - so it is written as
# plain text; the API server stores stringData base64-encoded under data itself. Argo CD writes
# its own keys into this Secret (admin password, server key); server-side apply leaves them alone.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
stringData:
  webhook.github.secret: $argocd-webhook:github-secret
