---
# GitHub signs every webhook delivery with a shared secret, and Argo CD ignores deliveries that
# do not match. The value here is only a reference - "$argocd-webhook:github-secret", base64 -
# to the Secret argocd-webhook, which External Secrets fills from OpenBao
# (kubernetes/components/argocd-integrations/). Argo CD writes its own keys into this Secret
# (admin password, server key); server-side apply leaves them alone.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
data:
  webhook.github.secret: JGFyZ29jZC13ZWJob29rOmdpdGh1Yi1zZWNyZXQ=
