---
# Memory for the Argo CD containers the namespace's LimitRange defaults (32Mi, limit 128Mi) do
# not fit, from what they used over 2026-10-23..11-02: the request the p95 of real memory (working
# set minus active file cache), the limit twice the working set's p95 or its peak x 1.1, whichever
# is higher.
#
# The application controller caches every resource it manages and is the largest user in the
# cluster: real p95 1314 MiB; working set p95 1338 MiB, peak 1714 MiB.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-application-controller
          resources:
            requests:
              memory: 1328Mi
            limits:
              memory: 2688Mi
---
# Rendering Helm charts (kube-prometheus-stack, Kyverno) is where it peaks: real p95 143 MiB;
# working set p95 290 MiB, peak 551 MiB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
        - name: argocd-repo-server
          resources:
            requests:
              memory: 144Mi
            limits:
              memory: 608Mi
---
# Real p95 69 MiB; working set p95 109 MiB, peak 153 MiB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    spec:
      containers:
        - name: argocd-server
          resources:
            requests:
              memory: 80Mi
            limits:
              memory: 224Mi
---
# Real p95 50 MiB; working set p95 66 MiB, peak 70 MiB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-applicationset-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-applicationset-controller
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 160Mi
---
# Real p95 53 MiB; working set p95 55 MiB, peak 61 MiB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-notifications-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-notifications-controller
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
---
# Real p95 at most 38 MiB; working set p95 38 MiB, peak 41 MiB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests:
              memory: 48Mi
            limits:
              memory: 96Mi
