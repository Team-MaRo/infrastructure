---
# Memory for the Argo CD containers the namespace's LimitRange defaults (64Mi, limit 128Mi) do
# not fit, from what they used when set (2026-09-28): the request about the usual use, the
# limit about twice the highest seen; checked again after the first week (2026-10-05). Redis
# stays within the defaults.
#
# The application controller caches every resource it manages and is the largest user in the
# cluster: about 1.55 GB usually, 1.6 GB at most.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-application-controller
          resources:
            requests:
              memory: 1536Mi
            limits:
              memory: 2560Mi
---
# Rendering Helm charts (kube-prometheus-stack, Kyverno) is where it peaks.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
        - name: argocd-repo-server
          resources:
            requests:
              memory: 320Mi
            limits:
              memory: 1Gi
---
# About 230 MiB usually, 254 MiB at most of the 256Mi it had (2026-10-05).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    spec:
      containers:
        - name: argocd-server
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
---
# Both used about 95 MiB of the defaults' 128Mi limit (2026-10-05).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-applicationset-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-applicationset-controller
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-notifications-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-notifications-controller
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 192Mi
