---
# Memory for the Argo CD containers the namespace's LimitRange defaults (32Mi, limit 128Mi) do
# not fit, from what they used over 2026-10-23..11-02 unless a container names another window: the
# request the p95 of real memory (working set minus active file cache), the limit the expected peak
# ÷ 0.8.
#
# The application controller caches every resource it manages and is the largest user in the
# cluster: real p95 1314 MiB; working set p95 1338 MiB, peak 1714 MiB.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-application-controller
          resources:
            requests:
              memory: 1328Mi
            limits:
              memory: 2688Mi
---
# Rendering Helm charts (kube-prometheus-stack, Kyverno) is where it peaks. Over 2026-11-13..18 (5
# days, a longer window to come): real p95 262 MiB, the request; working set p95 315 MiB, peak
# 569 MiB. The limit stays 1Gi: at 608Mi rendering kube-prometheus-stack got it OOM-killed
# (2026-11-02), a peak no window has seen.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
        - name: argocd-repo-server
          resources:
            requests:
              memory: 272Mi
            limits:
              memory: 1Gi
---
# Real p95 69 MiB; working set p95 109 MiB, peak 153 MiB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    spec:
      containers:
        - name: argocd-server
          resources:
            requests:
              memory: 80Mi
            limits:
              memory: 224Mi
---
# Over 2026-11-13..18 (5 days, a longer window to come): real p95 53 MiB, the request; the kernel's
# peak 145 MiB ÷ 0.8, the limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-applicationset-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-applicationset-controller
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 192Mi
---
# Real p95 53 MiB; working set p95 55 MiB, peak 61 MiB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-notifications-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-notifications-controller
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
---
# Real p95 at most 38 MiB; working set p95 38 MiB, peak 41 MiB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests:
              memory: 48Mi
            limits:
              memory: 96Mi
