---
# The UI and the API at argocd.d3strukt0r.dev (its own record in tofu/cloudflare). TLS ends at
# Traefik, and argocd-server speaks plain HTTP behind it (server.insecure). The CLI uses
# --grpc-web, which passes as ordinary HTTPS; no h2c route for native gRPC is needed. No
# className: Traefik is the cluster's default IngressClass.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
spec:
  tls:
    - hosts:
        - argocd.d3strukt0r.dev
      secretName: argocd-tls
  rules:
    - host: argocd.d3strukt0r.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
