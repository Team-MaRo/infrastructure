# Helm values for Goldilocks; the chart version is pinned in the cluster's Application. Only what
# differs from the chart's and Goldilocks' defaults is set.

image:
  # The tag is pinned by the chart, so a cached image is the right one; Always would ask the
  # registry on every start.
  pullPolicy: IfNotPresent

controller:
  flags:
    # A VPA object (updateMode Off) for every workload in every namespace, without labelling
    # each namespace.
    on-by-default: "true"
    # Their pods are too short-lived for the recommender to keep their history
    # (kubernetes/autoscaler#10211); the Grafana dashboard "Memory sizing" covers them.
    ignore-controller-kind: Job,CronJob
  # Errors and plain info only: at 2 it logs every namespace's VPA count and every pod added or
  # deleted (no messages at 1 in v4.16.3).
  logVerbosity: "0"
  rbac:
    # Argo Rollouts is not installed.
    enableArgoproj: false
  # Over 2026-11-13..18 (5 days, a longer window to come): real memory (working set minus active
  # file cache) p95 54 MiB, the request; working set peak 65 MiB - the limit stays at the
  # LimitRange's 128Mi. The chart's CPU request is dropped for the LimitRange's.
  resources:
    requests:
      cpu: null
      memory: 64Mi
    limits:
      memory: 128Mi

dashboard:
  replicaCount: 1
  flags:
    # Like the controller; otherwise "List All Namespaces" shows only labelled namespaces, i.e.
    # none.
    on-by-default: "true"
    # Otherwise the page's JavaScript calls insights.fairwinds.com for cost estimates.
    enable-cost: "false"
  rbac:
    enableArgoproj: false
  # Over 2026-11-13..18 (5 days, a longer window to come): real p95 69 MiB, the request; working
  # set peak 82 MiB - the limit stays at the LimitRange's 128Mi. CPU like the controller.
  resources:
    requests:
      cpu: null
      memory: 80Mi
    limits:
      memory: 128Mi
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      # Only Cloudflare reaches it (charts/cloudflare-only), then the Zitadel login gate: the
      # dashboard has no login of its own.
      traefik.ingress.kubernetes.io/router.middlewares: goldilocks_cloudflare-only@kubernetescrd,goldilocks_oauth2-proxy@kubernetescrd
    hosts:
      - host: goldilocks.d3strukt0r.dev
        paths:
          - path: /
            type: Prefix
    tls:
      - secretName: goldilocks-tls
        hosts:
          - goldilocks.d3strukt0r.dev
