---
# Spegel, layer sharing between the nodes (README). Spegel itself comes from its Helm chart (the
# cluster's Application, values.yaml); this directory adds its namespace and PodMonitor.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pod-monitor.yaml

# The sync option for the PodMonitor (shared/).
components:
  - ../../shared/monitoring-sync-options
