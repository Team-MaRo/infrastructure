---
# The control user's password (OpenBao secret/mariadb-apps/phpmyadmin), the same value the
# User in database.yaml is created with. Mounted as a file and read through
# PMA_CONTROLPASS_FILE, so it never shows in the pod's environment.
# 1Password "MariaDB | Prod | phpmyadmin"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=jpwo2g36stjynqahgcwnjqfcsy&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: phpmyadmin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: mariadb-apps/phpmyadmin
        property: password
