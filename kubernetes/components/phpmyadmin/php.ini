; PHP settings beside the image's. The image loads no php.ini, so PHP's built-in defaults apply,
; which show errors in the page - with file paths and internal state. Errors go into the log
; instead (the container's output, through php-fpm's catch_workers_output), as the WordPress and
; Matomo images already do.
display_errors = Off
display_startup_errors = Off
log_errors = On
