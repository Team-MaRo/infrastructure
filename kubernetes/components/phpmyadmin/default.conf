# nginx in front of php-fpm, both in the phpmyadmin pod; TLS is Traefik's. PHP only through
# phpMyAdmin's four entry points - everything else under /var/www/html is code it includes itself,
# and its internal directories are denied. nginx uses the first matching regex location, so the
# order matters.
server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.php;

    # Directory redirects carry only the path, not nginx's http and port 8080.
    absolute_redirect off;

    # Imports of up to 100 MB (UPLOAD_LIMIT in deployment.yaml), the most Cloudflare's proxy lets
    # through in one request on its free plan; nginx's default is 1 MB.
    client_max_body_size 100m;

    # Room for the headers of a login, as in Matomo's nginx.
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;
    # A large import or export may run for as long as PHP allows (MAX_EXECUTION_TIME, 600 s).
    fastcgi_read_timeout 600s;

    add_header X-Content-Type-Options "nosniff" always;

    # The liveness probe: nginx answers alone (deployment.yaml).
    location = /healthz {
        access_log off;
        return 204;
    }

    location ~ ^/(?:index|url|show_config_errors|js/messages)\.php$ {
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~* \.php$ {
        return 403;
    }

    location ~ ^/(?:libraries|templates|vendor|tmp|sql|locale)(?:/|$) {
        return 403;
    }

    location ~ /\. {
        return 403;
    }

    location ~ ^/(?:composer\.(?:json|lock)|package\.json|yarn\.lock)$ {
        return 403;
    }

    location ~* \.(?:css|js|png|gif|jpg|svg|ico|woff2?|ttf|eot|map)$ {
        expires 1h;
        # A location's own add_header drops the server's, so nosniff is repeated here.
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
