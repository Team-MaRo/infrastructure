---
# phpMyAdmin, shared by every cluster: the web UI for the shared MariaDB at
# phpmyadmin.d3strukt0r.dev, behind the Zitadel gate. It keeps its own settings (bookmarks,
# history, designer) in a database of its own in that MariaDB.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - database.yaml
  - external-secrets.yaml
  - deployment.yaml
  - service.yaml
  - certificate.yaml
  - middleware-oauth2-proxy.yaml
  - ingress.yaml
