---
# The poller (README). A Deployment rather than a CronJob, so Prometheus can scrape its counters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailomat-watch
  annotations:
    keel.sh/policy: force
    keel.sh/matchTag: "true"
    keel.sh/trigger: poll
spec:
  replicas: 1
  # Two pods at once would both log every event.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mailomat-watch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailomat-watch
    spec:
      serviceAccountName: mailomat-watch
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watch
          image: python:3.15-slim
          imagePullPolicy: Always
          command: ["python", "/app/watch.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: metrics
              containerPort: 9100
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: mailomat-watch
