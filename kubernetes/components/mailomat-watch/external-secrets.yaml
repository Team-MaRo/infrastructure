---
# The tokens of the domains no single app owns (README "The tokens"): mailomat.d3strukt0r.dev
# (Zitadel, Matomo, the cluster's own mail) and mailomat.wundexpertinplus.com (a site not on the
# cluster yet). Every other app brings its own token Secret with the same label.
# 1Password "Mailomat | API | mailomat.d3strukt0r.dev"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=3h3sz5lq3fi2n647in6k73iham&h=my.1password.com
# 1Password "Mailomat | API | mailomat.wundexpertinplus.com"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=fzliu7s36gqipu23smiso3zfia&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mailomat-token-shared
spec:
  target:
    template:
      metadata:
        labels:
          d3strukt0r.dev/mailomat-token: "true"
  data:
    - secretKey: mailomat.d3strukt0r.dev
      remoteRef:
        key: mailomat-watch
        property: mailomat.d3strukt0r.dev
    - secretKey: mailomat.wundexpertinplus.com
      remoteRef:
        key: mailomat-watch
        property: mailomat.wundexpertinplus.com
