---
# A look at the Hetzner Cloud API every 15 minutes; ntfy hears about it only when something changed
# (watch.py, README). A failed run raises kube-prometheus-stack's KubeJobFailed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hetzner-watch
  annotations:
    keel.sh/policy: force
    keel.sh/matchTag: "true"
    keel.sh/trigger: poll
spec:
  schedule: "11-59/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: hetzner-watch
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watch
              # Without docker.io/: Keel writes the short form back (components/keel).
              image: python:3.14-alpine
              imagePullPolicy: Always
              command: ["python", "/app/watch.py"]
              env:
                # The read-only root has no room for bytecode caches.
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: WATCH_SERVER_TYPES
                  value: cx43
                - name: WATCH_LOCATION
                  value: nbg1
              envFrom:
                - secretRef:
                    name: hetzner-watch
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: hetzner-watch
