---
# The read-only Hetzner Cloud API token (OpenBao secret/hetzner-watch) and the ntfy topic and
# token Alertmanager and Gatus use too (secret/ntfy).
# 1Password "Hetzner | Cloud API | prod hetzner-watch"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=6w2j3saopdpmtpa447cp5gnhke&h=my.1password.com
# 1Password "ntfy | prod alerts"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=htj7nc5vbwet6osr3mfdm3b5yy&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hetzner-watch
spec:
  data:
    - secretKey: HCLOUD_TOKEN
      remoteRef:
        key: hetzner-watch
        property: hcloud-token
    - secretKey: NTFY_TOPIC
      remoteRef:
        key: ntfy
        property: topic
    - secretKey: NTFY_TOKEN
      remoteRef:
        key: ntfy
        property: token
