---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns
  namespace: kube-system
spec:
  maxUnavailable: 1
  # Pods that are not ready may always be evicted: two broken CoreDNS pods must not block every
  # drain (kured waits for a drain without end).
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      k8s-app: kube-dns
