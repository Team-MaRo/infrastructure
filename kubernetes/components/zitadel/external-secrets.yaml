---
# The masterkey (OpenBao secret/zitadel) encrypts secrets in Zitadel's database. Losing it makes
# them unreadable; changing it after the first start is not supported.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: masterkey
      remoteRef:
        key: zitadel
        property: masterkey
---
# The first admin's password (OpenBao secret/zitadel, 1Password Zitadel | Prod | Admin). Only
# read once, when the setup job creates the first instance; changing it here later changes
# nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-admin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: zitadel
        property: admin-password
---
# The database password, the same value as the DatabaseRole's in the postgres namespace
# (database.yaml): both read OpenBao secret/postgres-apps/zitadel.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: postgres-apps/zitadel
        property: password
