---
# The masterkey (OpenBao secret/zitadel) encrypts secrets in Zitadel's database. Losing it makes
# them unreadable; changing it after the first start is not supported.
# 1Password "Zitadel | Prod | Masterkey"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=cpgucnzccroyrl5zwzdrmcbfau&h=my.1password.com
# 1Password "Zitadel | Prod | Admin"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=hwednr7k3ycfvmdgtbcylq5nwi&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: masterkey
      remoteRef:
        key: zitadel
        property: masterkey
---
# The first admin's password (OpenBao secret/zitadel, 1Password Zitadel | Prod | Admin). Only
# read once, when the setup job creates the first instance; changing it here later changes
# nothing.
# 1Password "Zitadel | Prod | Masterkey"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=cpgucnzccroyrl5zwzdrmcbfau&h=my.1password.com
# 1Password "Zitadel | Prod | Admin"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=hwednr7k3ycfvmdgtbcylq5nwi&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-admin
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: zitadel
        property: admin-password
---
# The database password, the same value as the DatabaseRole's in the postgres namespace
# (database.yaml): both read OpenBao secret/postgres-apps/zitadel.
# 1Password "PostgreSQL | Prod | zitadel"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=bwydlf63bo6bvbhvae44kolrba&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: postgres-apps/zitadel
        property: password
