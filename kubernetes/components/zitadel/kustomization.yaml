---
# Zitadel, the identity provider: the single login (OIDC/SAML) for the cluster's UIs and apps.
# The Helm chart is pinned in the cluster's Application with values.yaml from here; these are the
# objects it needs besides the chart.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Before the chart's objects: its jobs need these Secrets and certificates (values.yaml explains
# the order).
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-1"

resources:
  - namespace.yaml
  - database.yaml
  - external-secrets.yaml
  - certificates.yaml
  - groups-webhook.yaml
  - registration-webhook.yaml
  - registration-rate-limit.yaml
  - rules.yaml
  # Only Cloudflare reaches its proxied routes (charts/cloudflare-only).
  - ../../charts/cloudflare-only/files

# refreshInterval and the openbao store for every ExternalSecret here, the sync option for the
# PrometheusRule (shared/).
components:
  - ../../shared/external-secret-defaults
  - ../../shared/monitoring-sync-options
