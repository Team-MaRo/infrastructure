---
# Gives people who register themselves their first role. Zitadel has no default role, and a site
# whose project checks roles (tofu/zitadel, "WordPress sites") refuses a user without one. An
# organisation that wants it carries the metadata `registration-roles` (written by tofu/zitadel
# next to its login policy), and everyone created there gets those roles, staff included; an
# organisation without it gets nothing. The machine user `registration`, whose token this uses,
# belongs to such an organisation and sees only that one.
#
# Two ways, since Zitadel calls a target once and drops the event if the call fails:
# - at once: an Actions v2 event execution (tofu/zitadel) calls this whenever a user is created,
#   and the user gets the roles before the first login;
# - every 10 minutes and at start: every human user of every organisation it sees that has no
#   role in the project yet gets them - what was missed while the webhook was down or failing.
# The API's answers decide, not the call's content, so Zitadel's request signature is not
# checked: a forged call can at most give a real member of such an organisation its roles early.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-registration
data:
  registration.py: |
    import base64
    import json
    import threading
    import time
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    # Zitadel's API inside the cluster; it picks the instance by the host name.
    API = "http://zitadel.zitadel.svc:8080"
    HOST = "auth.d3strukt0r.dev"
    # {"project": "<project ID>", "roles": ["<role key>", ...]}; the organisation owns the
    # project or holds a grant for it with these roles.
    METADATA_KEY = "registration-roles"
    INTERVAL = 600
    PAGE = 500


    def call(method, body):
        # Read at every call: the Secret is mounted, so a new token applies without a restart.
        with open("/token/token") as f:
            token = f.read().strip()
        request = urllib.request.Request(
            f"{API}/{method}",
            data=json.dumps(body).encode(),
            headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json", "Host": HOST},
        )
        with urllib.request.urlopen(request, timeout=10) as response:
            return json.load(response)


    def pages(method, body, field, paging, results):
        offset = 0
        while True:
            page = call(method, {**body, field: {**paging, "offset": str(offset), "limit": PAGE}}).get(results, [])
            yield from page
            if len(page) < PAGE:
                return
            offset += PAGE


    def roles_of(org):
        metadata = call("zitadel.org.v2.OrganizationService/ListOrganizationMetadata", {"organizationId": org})
        entry = next((m for m in metadata.get("metadata", []) if m["key"] == METADATA_KEY), None)
        return json.loads(base64.b64decode(entry["value"])) if entry else None


    def assign(user_id, org, grant):
        try:
            call(
                "zitadel.authorization.v2.AuthorizationService/CreateAuthorization",
                {"userId": user_id, "projectId": grant["project"], "organizationId": org, "roleKeys": grant["roles"]},
            )
        except urllib.error.HTTPError as e:
            # Connect answers 409 when the user already has an authorization for the project.
            if e.code != 409:
                raise
            return f"{user_id}: already has a role in {grant['project']}"
        return f"{user_id}: {', '.join(grant['roles'])}"


    def on_created(user_id):
        try:
            user = call("zitadel.user.v2.UserService/GetUserByID", {"userId": user_id})["user"]
        except urllib.error.HTTPError as e:
            # Not found or not allowed: a user of an organisation the token does not see.
            if e.code in (403, 404):
                return f"{user_id}: not in an organisation of ours"
            raise
        if "human" not in user:
            return f"{user_id}: a machine user"
        org = user["details"]["resourceOwner"]
        grant = roles_of(org)
        if grant is None:
            return f"{user_id}: organisation {org} gives no roles"
        return assign(user_id, org, grant)


    def catch_up():
        orgs = call("zitadel.org.v2.OrganizationService/ListOrganizations", {}).get("result", [])
        for org in (o["id"] for o in orgs):
            grant = roles_of(org)
            if grant is None:
                continue
            users = pages(
                "zitadel.user.v2.UserService/ListUsers",
                {"queries": [{"organizationIdQuery": {"organizationId": org}}, {"typeQuery": {"type": "TYPE_HUMAN"}}]},
                "query", {}, "result",
            )
            have = {
                a["user"]["id"]
                for a in pages(
                    "zitadel.authorization.v2.AuthorizationService/ListAuthorizations",
                    {"filters": [{"projectId": {"id": grant["project"]}}, {"organizationId": {"id": org}}]},
                    "pagination", {}, "authorizations",
                )
            }
            for user_id in [u["userId"] for u in users if u["userId"] not in have]:
                print(f"caught up: {assign(user_id, org, grant)}", flush=True)


    def catch_up_forever():
        while True:
            try:
                catch_up()
            except Exception as e:
                print(f"catching up failed: {e!r}", flush=True)
            time.sleep(INTERVAL)


    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            event = json.loads(self.rfile.read(length) or b"{}")
            try:
                print(on_created(event["aggregateID"]), flush=True)
                self.send_response(200)
            except Exception as e:
                # Zitadel only logs the failure; the next catch-up gives the roles.
                print(f"{event.get('aggregateID')}: failed: {e!r}", flush=True)
                self.send_response(502)
            self.send_header("Content-Length", "0")
            self.end_headers()

        def do_GET(self):
            self.send_response(200)
            self.send_header("Content-Length", "0")
            self.end_headers()

        # Not the readiness probe's GET every 10 s, which would bury the lines that matter.
        def log_request(self, code="-", size="-"):
            if self.command != "GET":
                super().log_request(code, size)


    threading.Thread(target=catch_up_forever, daemon=True).start()
    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel-registration
  annotations:
    # Python loads the script once; Reloader restarts the pod when the ConfigMap changes.
    configmap.reloader.stakater.com/reload: zitadel-registration
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zitadel-registration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zitadel-registration
    spec:
      securityContext:
        # The image runs as root by default; nobody is enough for a script without files.
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zitadel-registration
          # Pinned; only the standard library is used, so any Python 3 works.
          image: docker.io/library/python:3.14.7-alpine3.24
          command: ["python", "/app/registration.py"]
          env:
            # The root filesystem is read-only.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: script
              mountPath: /app
            - name: token
              mountPath: /token
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: zitadel-registration
        # The machine user's personal access token (external-secrets.yaml, once the machine user
        # exists). Optional, so the pod runs without it; calls fail until it is there, and the
        # catch-up gives the roles once it is.
        - name: token
          secret:
            secretName: zitadel-registration
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-registration
spec:
  # A fixed address next to the groups webhook's, left out of Zitadel's deny list
  # (ZITADEL_HTTPCLIENT_DENYLIST in values.yaml) the same way; immutable once created.
  clusterIP: 10.43.255.251
  selector:
    app.kubernetes.io/name: zitadel-registration
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Only Zitadel itself may call it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zitadel-registration
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel-registration
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel
              app.kubernetes.io/component: start
      ports:
        - port: http
