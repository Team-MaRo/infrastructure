---
# Hetzner's CSI driver, shared by every cluster: turns PersistentVolumeClaims into Hetzner
# Cloud Volumes. It reads its API token from Secret kube-system/hcloud (key token), which is
# not in git - ansible/secrets.yml writes it from 1Password:
# 1Password "Hetzner | Prod CSI"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=un5urgife7qtuyxfmqcsmf2otm&h=my.1password.com
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Pinned to a release; bumping this line is the upgrade. The manifest places everything in
  # kube-system itself, so there is no namespace override here.
  #
  # A single-file URL for the same reason as in components/argocd: the repository form
  # makes Kustomize shell out to git.
  - https://raw.githubusercontent.com/hetznercloud/csi-driver/v2.23.0/deploy/kubernetes/hcloud-csi.yml

patches:
  - path: patches/reclaim-retain.yaml
  - path: patches/resources.yaml
