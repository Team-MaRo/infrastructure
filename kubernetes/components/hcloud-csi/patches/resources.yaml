---
# Memory for the driver's containers, from what they used when set (2026-09-28): the request
# about the usual use, the limit about twice the highest seen, 128Mi at the least. The
# upstream manifest sets only CPU requests, and kube-system has no LimitRange.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hcloud-csi-controller
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: csi-attacher
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 192Mi
        - name: csi-provisioner
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 192Mi
        - name: csi-resizer
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 192Mi
        - name: hcloud-csi-driver
          resources:
            requests:
              memory: 48Mi
            limits:
              memory: 128Mi
        - name: liveness-probe
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hcloud-csi-node
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: csi-node-driver-registrar
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: hcloud-csi-driver
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: liveness-probe
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
