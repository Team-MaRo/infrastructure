# What Gatus checks and whom it tells. Changing this file is how Gatus is administered: Argo CD
# updates the ConfigMap and Gatus reloads it by itself within about a minute. An invalid file
# makes Gatus exit - the pod then crash-loops, which Argo CD and Alertmanager both report.
#
# ${...} is filled in from the pod's environment (Secret gatus, external-secrets.yaml). Gatus
# expands every $ in the file, so a literal one has to be written $$.

ui:
  title: Status | D3strukt0r
  header: D3strukt0r

storage:
  type: postgres
  path: postgres://gatus:${POSTGRES_PASSWORD}@postgres-rw.postgres.svc:5432/gatus?sslmode=verify-full&sslrootcert=/etc/postgres-ca/ca.crt

# Phone notifications to the same ntfy.sh topic as Alertmanager's. Every alert below that sets
# only `type: ntfy` takes these defaults: after 3 failed checks in a row, and again once 2
# succeed.
alerting:
  ntfy:
    topic: ${NTFY_TOPIC}
    token: ${NTFY_TOKEN}
    priority: 4
    default-alert:
      send-on-resolved: true

# One entry per checked service; they appear on the page in their group.
endpoints:
  - name: Zitadel
    group: Cluster
    url: https://auth.d3strukt0r.dev/debug/healthz
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  # The container registry: /v2/ answers 401 with a Bearer challenge when zot is up - every
  # request needs a login (components/zot).
  - name: Registry
    group: Cluster
    url: https://registry.d3strukt0r.dev/v2/
    interval: 5m
    conditions:
      - "[STATUS] == 401"
    alerts:
      - type: ntfy

  - name: Wedding Manuele & Robine
    group: Apps
    url: https://manuele-robine.wedding/
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: Wedding Manuele & Robine API
    group: Apps
    url: https://api-wedding-manuele-robine.d3strukt0r.dev/ping
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: Robines Portfolio (old)
    group: Apps
    # The login page, which the page cache never keeps: the home page would come from Varnish's
    # grace for hours while PHP is down (charts/wordpress README "Page cache").
    url: https://old.robines.space/wp-login.php
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: Arepazo
    group: Apps
    # The login page, which the page cache never keeps: the home page would come from Varnish's
    # grace for hours while PHP is down (charts/wordpress README "Page cache").
    url: https://www.arepazo.ch/wp-login.php
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: Matomo
    group: Apps
    # The tracking endpoint the sites' visitors call, through nginx and PHP: the public half of
    # Matomo (its UI needs a login).
    url: https://matomo.d3strukt0r.dev/matomo.php
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  # Cloudflare's IP ranges, which the Middleware cloudflare-only admits (charts/cloudflare-only):
  # the API's etag changes with the list. Red means new ranges whose visitors get 403 - update the
  # list and this etag together (charts/cloudflare-only README).
  - name: Cloudflare IP ranges
    group: Cluster
    url: https://api.cloudflare.com/client/v4/ips
    interval: 1h
    conditions:
      - "[STATUS] == 200"
      - "[BODY].result.etag == 38f79d050aa027e3be3865e495dcc9bc"
    ui:
      hide-url: true
    alerts:
      - type: ntfy

# The alerting pipeline itself: Alertmanager's always-firing Watchdog alert arrives here every
# minute (kube-prometheus-stack values, receiver watchdog), at
# /api/v1/endpoints/alerting_watchdog/external?success=true with the token as a Bearer header.
# When none has come for 5 minutes - Prometheus, its rules or Alertmanager are down - Gatus
# alerts through ntfy itself.
external-endpoints:
  - name: Watchdog
    group: Alerting
    token: ${WATCHDOG_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: ntfy
        failure-threshold: 1
        success-threshold: 1
        description: Alertmanager's Watchdog stopped arriving
