---
# Everything config.yaml takes from the environment: the ntfy topic and token Alertmanager uses
# too (OpenBao secret/ntfy), the token Alertmanager's heartbeat must bring (secret/gatus) and the
# database password (secret/postgres-apps/gatus).
# 1Password "ntfy | prod alerts"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=htj7nc5vbwet6osr3mfdm3b5yy&h=my.1password.com
# 1Password "Gatus | Prod | Watchdog token"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=zghx22b3o4mpxeglv3wzacdfwq&h=my.1password.com
# 1Password "PostgreSQL | Prod | gatus"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=lcqd6fwtsqhnlzsg72jync46ri&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: NTFY_TOPIC
      remoteRef:
        key: ntfy
        property: topic
    - secretKey: NTFY_TOKEN
      remoteRef:
        key: ntfy
        property: token
    - secretKey: WATCHDOG_TOKEN
      remoteRef:
        key: gatus
        property: watchdog-token
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres-apps/gatus
        property: password
