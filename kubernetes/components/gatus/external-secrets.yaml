---
# Everything config.yaml takes from the environment: the ntfy topic and token Alertmanager uses
# too (OpenBao secret/ntfy), the token Alertmanager's heartbeat must bring (secret/gatus) and the
# database password (secret/postgres-apps/gatus).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: NTFY_TOPIC
      remoteRef:
        key: ntfy
        property: topic
    - secretKey: NTFY_TOKEN
      remoteRef:
        key: ntfy
        property: token
    - secretKey: WATCHDOG_TOKEN
      remoteRef:
        key: gatus
        property: watchdog-token
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres-apps/gatus
        property: password
