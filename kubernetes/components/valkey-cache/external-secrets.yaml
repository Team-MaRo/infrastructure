---
# Valkey's own users, as config lines (valkey.conf includes them):
# - default: switched off, so every connection must log in. A users file that does not name it
#   would leave it on, without a password, allowed everything.
# - exporter: the metrics exporter's minimal rights (redis_exporter's README for Valkey 8.1+),
#   its password as a SHA-256 hash; the plain one goes to the exporter (deployment.yaml).
# The apps' users are not here: each app brings its own Secret db-<n> (README).
# 1Password "Valkey | Prod | valkey-cache"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=2jjgal65ruf7p7vagp2aijynbq&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: users
spec:
  target:
    template:
      metadata:
        annotations:
          # A change restarts Valkey (Reloader's search mode, deployment.yaml).
          reloader.stakater.com/match: "true"
      data:
        users.conf: |
          user default off resetpass nocommands resetkeys resetchannels
          user exporter on #{{ .exporter | sha256sum }} -@all +@connection +memory -readonly +strlen +config|get +xinfo +pfcount -quit +zcard +type +xlen -readwrite -command +command|info +client -wait +scard +llen +hlen +get +eval +slowlog +commandlog|len +cluster|info +cluster|slots +cluster|nodes -hello -echo +info +latency +scan -reset -auth -asking
        exporter-password: "{{ .exporter }}"
  data:
    - secretKey: exporter
      remoteRef:
        key: valkey-cache
        property: exporter-password
