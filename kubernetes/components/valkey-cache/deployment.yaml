---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-cache
  annotations:
    # The exporter reads its password from users only at start (components/reloader). The apps'
    # users need no restart: acl-sync applies them while Valkey runs (shared/valkey-acl-sync).
    secret.reloader.stakater.com/reload: users
spec:
  replicas: 1
  # Two instances would be two separate caches; the old one stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey-cache
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # acl-sync's initContainer and sidecar, and their volumes, come from shared/valkey-acl-sync.
      containers:
        - name: valkey
          # The tag is pinned in kustomization.yaml (images:), for acl-sync's containers as well.
          image: valkey/valkey
          # Started directly as the image's user valkey (999), past the entrypoint, which would
          # only change the owner of /data as root.
          command:
            - valkey-server
            - /etc/valkey/valkey.conf
          workingDir: /data
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: valkey
              containerPort: 6379
          # TCP only: the default user is off, and a PING without logging in only says NOAUTH.
          readinessProbe:
            tcpSocket:
              port: valkey
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 30
          # Sized by maxmemory (64mb, valkey.conf) plus Valkey's own overhead and client buffers,
          # not by use: the container's real memory (working set minus active file cache) p95
          # 14 MiB, working set peak 25 MiB over 2026-10-23..11-02.
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: config
              mountPath: /etc/valkey/valkey.conf
              subPath: valkey.conf
              readOnly: true
            # Nothing is saved (valkey.conf), but Valkey keeps its working directory here.
            - name: data
              mountPath: /data
        # The figures for Prometheus (pod-monitor.yaml), logged in as the user exporter.
        - name: exporter
          # Pinned; bumping the tag is the upgrade.
          image: oliver006/redis_exporter:v1.94.0
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
            - name: REDIS_USER
              value: exporter
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users
                  key: exporter-password
          securityContext:
            # The image's own user.
            runAsUser: 59000
            runAsGroup: 59000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 9121
      volumes:
        - name: config
          configMap:
            name: valkey-cache
        # Valkey's own users, and the user of each app, which the app brings itself as the
        # Secret db-<n> for its database n (README); acl-sync reads them and builds Valkey's
        # aclfile (shared/valkey-acl-sync). A Pod can only mount Secrets by name, so all fifteen
        # possible databases are listed; those no app has taken are simply absent.
        - name: users
          projected:
            sources:
              - secret:
                  name: users
                  items:
                    - key: users.conf
                      path: users.conf
              - secret:
                  name: db-1
                  optional: true
                  items:
                    - key: users.conf
                      path: db-1.conf
              - secret:
                  name: db-2
                  optional: true
                  items:
                    - key: users.conf
                      path: db-2.conf
              - secret:
                  name: db-3
                  optional: true
                  items:
                    - key: users.conf
                      path: db-3.conf
              - secret:
                  name: db-4
                  optional: true
                  items:
                    - key: users.conf
                      path: db-4.conf
              - secret:
                  name: db-5
                  optional: true
                  items:
                    - key: users.conf
                      path: db-5.conf
              - secret:
                  name: db-6
                  optional: true
                  items:
                    - key: users.conf
                      path: db-6.conf
              - secret:
                  name: db-7
                  optional: true
                  items:
                    - key: users.conf
                      path: db-7.conf
              - secret:
                  name: db-8
                  optional: true
                  items:
                    - key: users.conf
                      path: db-8.conf
              - secret:
                  name: db-9
                  optional: true
                  items:
                    - key: users.conf
                      path: db-9.conf
              - secret:
                  name: db-10
                  optional: true
                  items:
                    - key: users.conf
                      path: db-10.conf
              - secret:
                  name: db-11
                  optional: true
                  items:
                    - key: users.conf
                      path: db-11.conf
              - secret:
                  name: db-12
                  optional: true
                  items:
                    - key: users.conf
                      path: db-12.conf
              - secret:
                  name: db-13
                  optional: true
                  items:
                    - key: users.conf
                      path: db-13.conf
              - secret:
                  name: db-14
                  optional: true
                  items:
                    - key: users.conf
                      path: db-14.conf
              - secret:
                  name: db-15
                  optional: true
                  items:
                    - key: users.conf
                      path: db-15.conf
        - name: data
          emptyDir:
            sizeLimit: 64Mi
