# A cache and nothing else: when memory is full, the least recently used keys of any app go, and
# nothing is ever written to disk - a restart starts empty.
maxmemory 192mb
maxmemory-policy allkeys-lru
save ""
appendonly no

# Protected mode only lets localhost in while the default user has no password. Here the default
# user is switched off and every other user needs one, so the ACLs guard the port instead.
protected-mode no

# The users, one file per Secret (deployment.yaml): user lines in included files rather than an
# aclfile, which can only be one file. Valkey refuses to start with both.
include /etc/valkey/users/*.conf
