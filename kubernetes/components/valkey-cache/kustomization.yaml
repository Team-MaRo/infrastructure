---
# valkey-cache, the cluster's shared cache: one Valkey without a volume, a database per app,
# each app's user restricted to its own (README).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - external-secrets.yaml
  - deployment.yaml
  - service.yaml
  - network-policy.yaml
  - pod-monitor.yaml
  - rules.yaml

# A hash in the name, so a change to the configuration rolls the pod.
configMapGenerator:
  - name: valkey-cache
    files:
      - valkey.conf

# Shared settings (shared/): the openbao store and refresh for every ExternalSecret, the
# sync option for every monitor and rule.
components:
  - ../../shared/external-secret-defaults
  - ../../shared/monitoring-sync-options
