# Helm values for Grafana Alloy; the chart version is pinned in the cluster's Application. One
# Alloy per node, sending that node's pod logs and journal, and the cluster's events, to Loki.
alloy:
  # No usage statistics to Grafana Labs.
  enableReporting: false
  # The Alloy instances find each other, so the events below are collected once, not per node.
  clustering:
    enabled: true
  # Read positions on the node itself, so a restarted pod neither re-sends nor skips lines.
  storagePath: /var/lib/alloy
  mounts:
    # /var/log/pods for the containers' logs, /var/log/journal for the node's journal.
    varlog: true
    extra:
      - name: storage
        mountPath: /var/lib/alloy
      # The journal reader picks this machine's journal by its ID.
      - name: machine-id
        mountPath: /etc/machine-id
        readOnly: true
  # OTLP for traces (the pipeline below), on the pods and the Service.
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  # The log files belong to root with mode 0640, so root reads them; as their owner it needs no
  # capability to do so.
  securityContext:
    runAsUser: 0
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  # kube-system has no LimitRange. Measured 130-180 MiB per node after the first start.
  resources:
    requests:
      cpu: 20m
      memory: 192Mi
    limits:
      memory: 512Mi
  configMap:
    content: |
      // Containers on this node, found through the API and read from the kubelet's log files.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<restart>.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // Unwraps containerd's log format: timestamp, stream, partial-line flag, message.
      loki.process "pods" {
        stage.cri {}
        forward_to = [loki.write.default.receiver]
      }

      // The node's whole journal: k3s, the kernel, apt, sshd.
      loki.relabel "journal" {
        forward_to = []

        rule {
          source_labels = ["__journal__systemd_unit"]
          target_label  = "unit"
        }
      }

      loki.source.journal "node" {
        relabel_rules = loki.relabel.journal.rules
        labels        = {job = "node-journal", node = sys.env("HOSTNAME")}
        forward_to    = [loki.write.default.receiver]
      }

      // Kubernetes events, which the API keeps for an hour only. With clustering, one Alloy
      // collects them.
      loki.source.kubernetes_events "cluster" {
        clustering {
          enabled = true
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.loki.svc:3100/loki/api/v1/push"
        }
      }

      // Traces: Traefik and Zitadel send OTLP to the Alloy on their node (the Service's
      // trafficDistribution below); Alloy drops the visitor's browser, batches the spans and
      // forwards them to Tempo, keeping them in a queue and retrying while Tempo restarts.
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.attributes.redact.input]
        }
      }

      // Every request is traced and kept 30 days, so a span keeps only what finding a fault
      // needs - path, status, timings - and loses the visitor's user agent and address (the
      // current and the older attribute names). Hosts not proxied by Cloudflare would otherwise
      // keep the visitor's real IP; the access log still has both for failed and slow requests.
      // Query values never get here, Traefik replaces them with REDACTED in spans.
      otelcol.processor.attributes "redact" {
        action {
          key    = "user_agent.original"
          action = "delete"
        }
        action {
          key    = "http.user_agent"
          action = "delete"
        }
        action {
          key    = "client.address"
          action = "delete"
        }
        action {
          key    = "network.peer.address"
          action = "delete"
        }
        action {
          key    = "http.client_ip"
          action = "delete"
        }
        action {
          key    = "net.peer.ip"
          action = "delete"
        }
        output {
          traces = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.tempo.svc:4317"
          // Plain gRPC inside the cluster; between nodes WireGuard encrypts it.
          tls {
            insecure = true
          }
        }
      }

# A sender reaches the Alloy on its own node - Traefik on the host network too - and another
# node's only while its own is down.
service:
  trafficDistribution: PreferSameNode

controller:
  volumes:
    extra:
      - name: storage
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate
      - name: machine-id
        hostPath:
          path: /etc/machine-id
          type: File

# The chart's ClusterRole also reads every Secret and ConfigMap in the cluster; clusterrole.yaml
# grants only what the pipeline above uses.
rbac:
  create: false
