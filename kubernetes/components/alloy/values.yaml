# Helm values for Grafana Alloy; the chart version is pinned in the cluster's Application. One
# Alloy per node, sending that node's pod logs and journal, and the cluster's events, to Loki.
alloy:
  # No usage statistics to Grafana Labs.
  enableReporting: false
  # The Alloy instances find each other, so the events below are collected once, not per node.
  clustering:
    enabled: true
  # Read positions on the node itself, so a restarted pod neither re-sends nor skips lines.
  storagePath: /var/lib/alloy
  mounts:
    # /var/log/pods for the containers' logs, /var/log/journal for the node's journal.
    varlog: true
    extra:
      - name: storage
        mountPath: /var/lib/alloy
      # The journal reader picks this machine's journal by its ID.
      - name: machine-id
        mountPath: /etc/machine-id
        readOnly: true
  # OTLP for traces (the pipeline below), on the pods and the Service.
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  # The log files belong to root with mode 0640, so root reads them; as their owner it needs no
  # capability to do so.
  securityContext:
    runAsUser: 0
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  # kube-system has no LimitRange. Over 2026-10-23..11-02: real memory (working set minus active
  # file cache) p95 230 MiB, the request; working set p95 255 MiB, peak 259 MiB, the limit twice
  # that p95.
  resources:
    requests:
      cpu: 20m
      memory: 240Mi
    limits:
      memory: 512Mi
  configMap:
    content: |
      // Containers on this node, found through the API and read from the kubelet's log files.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<restart>.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // Unwraps containerd's log format: timestamp, stream, partial-line flag, message.
      loki.process "pods" {
        stage.cri {}

        // Traefik's upload scan lines become a counter by verdict and refusal status, for its
        // alerts (components/traefik/rules.yaml). A metric takes the entry's labels, so the two
        // are labels only for stage.metrics and are dropped before the line goes to Loki. A series
        // outlives the alerts' 10-minute window: by default it goes after 5 minutes without a
        // line, and the next line would start it anew, unseen by increase().
        stage.match {
          selector = "{namespace=\"kube-system\", container=\"traefik\"} |= \"upload_scan\""

          stage.json {
            expressions = { verdict = "verdict", refused = "refused" }
          }
          stage.labels {
            values = { verdict = "", refused = "" }
          }
          stage.metrics {
            metric.counter {
              name              = "upload_scan_total"
              description       = "Upload scan log lines by verdict and refusal status."
              match_all         = true
              action            = "inc"
              max_idle_duration = "24h"
            }
          }
          stage.label_drop {
            values = ["verdict", "refused"]
          }
        }

        forward_to = [loki.write.default.receiver]
      }

      // The node's whole journal: k3s, the kernel, apt, sshd.
      loki.relabel "journal" {
        forward_to = []

        rule {
          source_labels = ["__journal__systemd_unit"]
          target_label  = "unit"
        }
      }

      loki.source.journal "node" {
        relabel_rules = loki.relabel.journal.rules
        labels        = {job = "node-journal", node = sys.env("HOSTNAME")}
        forward_to    = [loki.write.default.receiver]
      }

      // Kubernetes events, which the API keeps for an hour only. With clustering, one Alloy
      // collects them.
      loki.source.kubernetes_events "cluster" {
        clustering {
          enabled = true
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.loki.svc:3100/loki/api/v1/push"
        }
      }

      // Traces: Traefik and Zitadel send OTLP to the Alloy on their node (the Service's
      // trafficDistribution below); Alloy drops the visitor's browser and address, redacts
      // values that can be personal data, batches the spans and forwards them to Tempo, keeping
      // them in a queue and retrying while Tempo restarts.
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.attributes.redact.input]
        }
      }

      // Every request is traced and kept 30 days, so a span keeps only what finding a fault
      // needs - path, status, timings - and loses the visitor's user agent and address (the
      // current and the older attribute names). Hosts not proxied by Cloudflare would otherwise
      // keep the visitor's real IP; the access log still has both for failed and slow requests.
      otelcol.processor.attributes "redact" {
        action {
          key    = "user_agent.original"
          action = "delete"
        }
        action {
          key    = "http.user_agent"
          action = "delete"
        }
        action {
          key    = "client.address"
          action = "delete"
        }
        action {
          key    = "network.peer.address"
          action = "delete"
        }
        action {
          key    = "http.client_ip"
          action = "delete"
        }
        action {
          key    = "net.peer.ip"
          action = "delete"
        }
        action {
          key    = "net.sock.peer.addr"
          action = "delete"
        }
        output {
          traces = [otelcol.processor.transform.redact_values.input]
        }
      }

      {{- $email := `[A-Za-z0-9._+!#*^{|}~&'-]+(?:@|%40)[A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}` }}
      {{- $urlValue := `([?&#;][^=&#;]*)=[^?&#;]*` }}
      {{- $urlValueInName := `([?&#;][^=&#;\\s]*)=[^?&#;\\s]*` }}
      {{- $userinfo := `://[^/?#@\\s]+@` }}
      {{- $nameValue := `(^|&)([^=&#]*)=[^&#]*` }}
      // Values that can be anyone's data, from any sender (README). A statement that fails drops
      // the sender's batch rather than letting it through.
      otelcol.processor.transform "redact_values" {
        error_mode = "propagate"

        trace_statements {
          context = "span"
          statements = [
            // Free text: a database query's and an error's. The operation, the table, the status
            // code and the error's type stay.
            `delete_key(span.attributes, "db.statement")`,
            `delete_key(span.attributes, "db.query.text")`,
            `delete_matching_keys(span.attributes, "^db\\.(query|operation)\\.parameter\\.")`,
            `delete_key(span.attributes, "graphql.document")`,
            `delete_key(span.attributes, "error.message")`,
            `delete_key(span.attributes, "error_msg")`,
            `set(span.status.message, "")`,
            // Who the user is (enduser.id, user.email, user.full_name, ...).
            `delete_matching_keys(span.attributes, "^(enduser|user)\\.")`,
            // URLs: after each ?, &, # or ;, name=value becomes name=REDACTED, and a user and
            // password before the host go. In a span's name the value also ends at a space, since
            // an HTTP client may name its span "GET <url>".
            `replace_pattern(span.attributes["url.full"], "{{ $urlValue }}", "${1}=REDACTED")`,
            `replace_pattern(span.attributes["url.full"], "{{ $userinfo }}", "://REDACTED@")`,
            `replace_pattern(span.attributes["url.original"], "{{ $urlValue }}", "${1}=REDACTED")`,
            `replace_pattern(span.attributes["url.original"], "{{ $userinfo }}", "://REDACTED@")`,
            `replace_pattern(span.attributes["http.url"], "{{ $urlValue }}", "${1}=REDACTED")`,
            `replace_pattern(span.attributes["http.url"], "{{ $userinfo }}", "://REDACTED@")`,
            `replace_pattern(span.attributes["http.target"], "{{ $urlValue }}", "${1}=REDACTED")`,
            `replace_pattern(span.name, "{{ $urlValueInName }}", "${1}=REDACTED")`,
            `replace_pattern(span.name, "{{ $userinfo }}", "://REDACTED@")`,
            // A query or a fragment alone has no leading ? or #.
            `replace_pattern(span.attributes["url.query"], "{{ $nameValue }}", "${1}${2}=REDACTED")`,
            `replace_pattern(span.attributes["url.fragment"], "{{ $nameValue }}", "${1}${2}=REDACTED")`,
            // E-mail addresses, the @ also as %40.
            `replace_all_patterns(span.attributes, "value", "{{ $email }}", "REDACTED")`,
            `replace_pattern(span.name, "{{ $email }}", "REDACTED")`,
          ]
        }

        trace_statements {
          context = "spanevent"
          statements = [
            `delete_key(spanevent.attributes, "exception.message")`,
            `delete_key(spanevent.attributes, "exception.stacktrace")`,
            `replace_pattern(spanevent.name, "{{ $email }}", "REDACTED")`,
            `replace_all_patterns(spanevent.attributes, "value", "{{ $email }}", "REDACTED")`,
          ]
        }

        output {
          traces = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.tempo.svc:4317"
          // Plain gRPC inside the cluster; between nodes WireGuard encrypts it.
          tls {
            insecure = true
          }
        }
      }

# A sender reaches the Alloy on its own node - Traefik on the host network too - and another
# node's only while its own is down.
service:
  trafficDistribution: PreferSameNode

# The chart's 50Mi request and no limit; kube-system has no LimitRange. Over 2026-10-23..11-02:
# real p95 14 MiB, the request; working set p95 15 MiB, peak 18 MiB, the limit twice that p95.
configReloader:
  resources:
    requests:
      memory: 16Mi
    limits:
      memory: 32Mi

controller:
  volumes:
    extra:
      - name: storage
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate
      - name: machine-id
        hostPath:
          path: /etc/machine-id
          type: File

# The chart's ClusterRole also reads every Secret and ConfigMap in the cluster; clusterrole.yaml
# grants only what the pipeline above uses.
rbac:
  create: false
