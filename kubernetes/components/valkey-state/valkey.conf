# State, not a cache: nothing is ever evicted, and every write is on the volume before Valkey
# confirms it, so a crash loses no session or lock (README "Design").
maxmemory 128mb
maxmemory-policy noeviction
appendonly yes
appendfsync always
save ""

# Protected mode only lets localhost in while the default user has no password. Here the default
# user is switched off and every other user needs one, so the ACLs guard the port instead.
protected-mode no

# The users, one file per Secret (statefulset.yaml): user lines in included files rather than an
# aclfile, which can only be one file. Valkey refuses to start with both.
include /etc/valkey/users/*.conf
