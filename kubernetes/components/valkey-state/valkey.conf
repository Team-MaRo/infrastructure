# State, not a cache: nothing is ever evicted, and every write is on the volume before Valkey
# confirms it, so a crash loses no session or lock (README "Design").
maxmemory 48mb
maxmemory-policy noeviction
appendonly yes
appendfsync always
save ""

# Protected mode only lets localhost in while the default user has no password. Here the default
# user is switched off and every other user needs one, so the ACLs guard the port instead.
protected-mode no

# The users: acl-sync builds this file from the users Secrets, keeping out every line Valkey
# refuses, and loads it again when they change (shared/valkey-acl-sync). Not the Secrets'
# files directly: one app's broken line there would stop Valkey from starting at all.
aclfile /run/valkey-local/users.acl
