---
# What pgAdmin reads from files at start (its entrypoint's *_FILE variables), so neither value
# shows in the pod's environment:
# - config-database-uri: its configuration database (secret/postgres-apps/pgadmin), as the
#   Python string literal the entrypoint writes into its config. The password sits inside the
#   URL, hence letters and digits only.
# - default-password: the internal user pgAdmin insists on creating at its first start
#   (secret/pgadmin). Only the Zitadel login is enabled, so nobody can log in with it; it owns
#   the shared server from servers.json.
# 1Password "PostgreSQL | Prod | pgadmin"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=57fj3tlsl6rvegv46lio457qnq&h=my.1password.com
# 1Password "pgAdmin | Prod | Default user"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=d3272yhi4gncweqqpt4jcqm5qi&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      data:
        config-database-uri: "'postgresql://pgadmin:{{ .dbPassword }}@postgres-rw.postgres.svc:5432/pgadmin?sslmode=verify-full'"
        default-password: "{{ .defaultPassword }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: postgres-apps/pgadmin
        property: password
    - secretKey: defaultPassword
      remoteRef:
        key: pgadmin
        property: default-password
