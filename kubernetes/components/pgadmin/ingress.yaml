---
# pgAdmin at pgadmin.d3strukt0r.dev (its own record in tofu/cloudflare). No Zitadel gate in
# front: pgAdmin logs in through Zitadel itself. No className: Traefik is the cluster's default
# IngressClass.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin
  annotations:
    # cert-manager creates the Certificate from spec.tls (components/cert-manager).
    cert-manager.io/cluster-issuer: letsencrypt
    # Only Cloudflare reaches it (charts/cloudflare-only).
    traefik.ingress.kubernetes.io/router.middlewares: pgadmin_cloudflare-only@kubernetescrd
spec:
  tls:
    - hosts:
        - pgadmin.d3strukt0r.dev
      secretName: pgadmin-tls
  rules:
    - host: pgadmin.d3strukt0r.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgadmin
                port:
                  name: http
