---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  annotations:
    # A new image under the same tag rolls it out (components/keel): 9 follows every 9.x
    # release, nearly each with security fixes; 10 is a deliberate change (README "Upgrading").
    keel.sh/policy: force
    keel.sh/matchTag: "true"
    keel.sh/trigger: poll
    # Restarted by Reloader when the Secret changes in OpenBao: pgAdmin's entrypoint reads its
    # *_FILE secrets at start.
    secret.reloader.stakater.com/reload: pgadmin
spec:
  # One instance, and the old pod stopped before the new one starts: pgAdmin migrates its
  # configuration database at start, which an old pod must not keep using.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pgadmin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgadmin
    spec:
      securityContext:
        # The image's own user, set explicitly.
        runAsUser: 5050
        runAsGroup: 5050
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgadmin
          # Without docker.io/: Keel writes the short form back (components/keel).
          image: dpage/pgadmin4:9
          imagePullPolicy: Always
          env:
            # Without this the entrypoint starts postfix (for password-reset mails) through sudo,
            # which cannot work without privilege escalation; Zitadel handles passwords anyway.
            - name: PGADMIN_DISABLE_POSTFIX
              value: "true"
            # Its default, port 80, needs a capability the restricted standard does not grant.
            - name: PGADMIN_LISTEN_PORT
              value: "8080"
            - name: PGADMIN_CONFIG_CONFIG_DATABASE_URI_FILE
              value: /etc/pgadmin-secret/config-database-uri
            # The internal user its first start requires (see external-secrets.yaml).
            - name: PGADMIN_DEFAULT_EMAIL
              value: pgadmin@d3strukt0r.dev
            - name: PGADMIN_DEFAULT_PASSWORD_FILE
              value: /etc/pgadmin-secret/default-password
            # The shared server, loaded again on every start so the file stays the truth.
            - name: PGADMIN_SERVER_JSON_FILE
              value: /etc/pgadmin/servers.json
            - name: PGADMIN_REPLACE_SERVERS_ON_STARTUP
              value: "True"
            # A handful of users, not 25 threads' worth.
            - name: GUNICORN_THREADS
              value: "8"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Over 2026-10-23..11-02: real memory (working set minus active file cache) p95 248 MiB,
          # the request; working set p95 301 MiB, peak 302 MiB, the limit twice that p95.
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 608Mi
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: http
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: http
            periodSeconds: 30
          # pgAdmin waits for its configuration database and migrates it before it answers.
          startupProbe:
            httpGet:
              path: /misc/ping
              port: http
            failureThreshold: 30
          volumeMounts:
            # Sessions and the file manager's storage only; everything else is in the
            # configuration database, so nothing here needs to survive a restart.
            - name: data
              mountPath: /var/lib/pgadmin
            - name: config
              mountPath: /etc/pgadmin
              readOnly: true
            - name: secret
              mountPath: /etc/pgadmin-secret
              readOnly: true
            # CloudNativePG's CA where libpq looks by default (~/.postgresql/root.crt), for
            # the configuration database and every server a user opens: pgAdmin drops
            # sslrootcert from the copy of a shared server it makes for each user, so a path in
            # servers.json would reach only the internal user.
            - name: postgres-ca
              mountPath: /home/pgadmin/.postgresql
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: pgadmin
        - name: secret
          secret:
            secretName: pgadmin
        # CloudNativePG's CA, put here by trust-manager (components/trust-manager).
        - name: postgres-ca
          configMap:
            name: postgres-ca
            items:
              - key: ca.crt
                path: root.crt
