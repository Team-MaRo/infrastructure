---
# arepazo's database in the shared MariaDB. mariadb-operator requires a User, its
# password Secret, a Grant and a Database to be in the MariaDB's namespace, so these objects live
# in mariadb although this component deploys them. The password comes from OpenBao
# secret/mariadb-apps/arepazo; WordPress reads the same value in its own namespace.
# 1Password "MariaDB | Prod | arepazo"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=373ezgwhdppj4dsxghr3aqcxpa&h=my.1password.com
#
# cleanupPolicy Skip on all three: the operator's default (Delete) would drop the database and the
# user when this component is removed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arepazo-db
  namespace: mariadb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: password
      remoteRef:
        key: mariadb-apps/arepazo
        property: password
---
# The collation the site had on prod-old, so its dump imports unchanged.
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: arepazo
  namespace: mariadb
spec:
  mariaDbRef:
    name: mariadb
  name: arepazo
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: arepazo
  namespace: mariadb
spec:
  mariaDbRef:
    name: mariadb
  name: arepazo
  host: "%"
  passwordSecretKeyRef:
    name: arepazo-db
    key: password
  # Refused without TLS, so the password never crosses the network in the clear.
  require:
    ssl: true
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: arepazo
  namespace: mariadb
spec:
  mariaDbRef:
    name: mariadb
  username: arepazo
  host: "%"
  database: arepazo
  table: "*"
  privileges:
    - ALL PRIVILEGES
  cleanupPolicy: Skip
