# nginx in front of php-fpm, both in the arepazo pod. TLS is Traefik's; requests reach here only
# through it. nginx uses the first matching regex location, so the denies come before the PHP rule.
server {
    listen 8081;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 100M;

    # nginx's own redirects (a directory without its slash, e.g. /wp-admin) carry only the path:
    # an absolute one would name what nginx sees - http and port 8081 - instead of the site's
    # address behind Traefik.
    absolute_redirect off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No Content-Security-Policy: checkout embeds the payment providers' frames (Braintree, PayPal),
    # and a frame-src list would have to follow theirs.

    # Uploads live in the private bucket: the uploads proxy beside this container signs the request
    # and streams the file. ^~ keeps the static-file rules below from taking these. Cookies have no
    # business at the bucket.
    location ^~ /wp-content/uploads/ {
        # Private files WooCommerce and its plugins keep under uploads: invoice PDFs with customer
        # data, protected downloads, logs, Facebook's product catalog exports, Contact Form 7's
        # temporary uploads, WPForms' cache and a removed file manager's leftovers. Each comes
        # with an .htaccess that hides it from Apache; nginx never reads those, so only this does.
        location ~ ^/wp-content/uploads/(?:wpo_wcpdf_[^/]*|woocommerce_uploads|wc-logs|wp-file-manager-pro|facebook_for_woocommerce|wpcf7_uploads|wpforms/cache)/ {
            deny all;
        }
        # Uploads are files, never code or server configuration.
        location ~ /\. {
            deny all;
        }
        location ~* \.(?:s?html?|php|js|swf)$ {
            deny all;
        }

        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        expires 7d;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* ^/(?:xmlrpc\.php|wp-links-opml\.php|wp-config\.php|wp-config-sample\.php|wp-comments-post\.php|readme\.html|license\.txt)$ {
        deny all;
    }

    # PHP under wp-content and wp-includes is never called directly - except TinyMCE's loader,
    # which as an exact match wins before any regex location.
    location = /wp-includes/js/tinymce/wp-tinymce.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }
    location ~* ^/(?:wp-content|wp-includes)/.*\.php$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(?:css(?:\.map)?|js(?:\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv)$ {
        expires 7d;
        access_log off;
    }

    location ~* \.(?:svgz?|ttf|ttc|otf|eot|woff2?)$ {
        add_header Access-Control-Allow-Origin "*";
        expires 7d;
        access_log off;
    }
}
