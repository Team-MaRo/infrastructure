; php-fpm settings beside the image's (docker.conf, zz-docker.conf).
[global]
; On a stop (SIGQUIT, the image's stop signal) running requests may finish for up to 20 s instead
; of being dropped - the default 0 cut a 3 s request at every rollout. The preStop pause
; (deployment.yaml) comes first, so the pod keeps answering while Traefik lets go of it.
process_control_timeout = 20s

[www]
; A request running longer than 2 s writes its PHP backtrace into the container log, so a slow
; spell shows what WordPress waits on (2026-10-11: arepazo took 6-9 s per request while the pod,
; the node and the database were idle). Normally about 1 % of requests take that long.
request_slowlog_timeout = 2s
slowlog = /proc/self/fd/2
; Pool figures (busy and idle workers, queued requests) for Prometheus, through nginx's metrics
; server (default.conf). status_listen is a pool of its own, so the figures still come while all
; workers are busy - exactly when they matter. Only on localhost.
pm.status_path = /status
pm.status_listen = 127.0.0.1:9001
