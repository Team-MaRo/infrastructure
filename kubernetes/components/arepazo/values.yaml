---
# arepazo, the WooCommerce shop at www.arepazo.ch, from the chart kubernetes/charts/wordpress
# (README). Only what differs from the chart's defaults.

# arepazo.ch redirects to www.arepazo.ch (WordPress does that). The certificate comes from the
# arepazo Cloudflare account: the ClusterIssuer's arepazo solver answers for the zone.
hosts:
  - www.arepazo.ch
  - arepazo.ch

# What the shop uses; what prod-old had beyond that was removed 2026-10-22 (README "Plugins").
plugins:
  - fancybox-for-wordpress
  - google-analytics-for-wordpress
  - jetpack
  - jetpack-boost
  - jetpack-protect
  - polylang
  - woocommerce
  - woocommerce-gateway-paypal-powered-by-braintree
  - woocommerce-google-analytics-integration
  - woocommerce-pdf-invoices-packing-slips
  - wordpress-seo
  - wp-mail-smtp
  - wpforms-lite
  - yith-woocommerce-order-tracking
themes:
  - inspiro-blocks
  - twentytwentyfive

# wp-admin in de_CH, the shop in German, English and Spanish (Polylang; en_US needs no pack).
languages:
  - de_CH
  - de_DE
  - es_ES

# Database 2 in valkey-cache (components/valkey-cache). Without it, loading WordPress alone took
# 834 database queries and every page 1.5-2 s (2026-10-20).
objectCache:
  database: 2

# Varnish in front (chart README "Page cache"): a shop has more pages - products, categories,
# three languages - so twice the chart's memory for them.
pageCache:
  enabled: true
  size: 128M
  resources:
    requests:
      memory: 384Mi
    limits:
      memory: 384Mi

# Login through Zitadel (README): the app `arepazo` in tofu/zitadel (project_arepazo.tf), and
# customers register into the organisation Arepazo, which gives them arepazo:customer.
oidc:
  clientId: "395991384143692164"
  registerOrganisation: "395991383791370628"

# Content through Claude (chart README): pages, posts and products by chatting with Claude, as
# one's own WordPress user - customers have no rights to write anything; the client ID of the app
# arepazo-claude in tofu/zitadel.
mcp:
  clientId: "396201383935607172"

# Twice the chart's interned strings buffer: WooCommerce, Polylang and the rest fill 32 MB - 94 %
# a day after the opcache got its 256 MB, still rising (2026-10-23). The buffer is part of those
# 256 MB, of which the site used 183, so this takes no more memory.
phpIni:
  opcache.interned_strings_buffer: 64

phpFpm:
  # Pool size from the container's memory limit (2026-10-18, opcache 2026-10-22): (1280 MiB limit
  # - 256 opcache, shared by all workers - 40 master - ~200 headroom) / 90 MB per worker (php-fpm's
  # memory peak; RssAnon 73-80 MB) = 8, one fewer for a heavy request (an export may use
  # memory_limit's 256M), kept at 6: 296 fixed + 5 x 90 + 256 = ~1000 MiB. The image's 5 were
  # taken by one /wp-admin/ load (~17 parallel requests of 1.5-9 s, mostly waiting on
  # wordpress.com and the database - 5 busy workers used 1.65 cores). Spare workers stay dynamic,
  # so the idle panel and PhpFpmNoIdleWorker keep their meaning.
  pool:
    max_children: 6
    start_servers: 2
    min_spare_servers: 2
    max_spare_servers: 4
  # Six workers run at once under load, about 90 MB each plus the shared opcache; 512Mi was
  # OOM-killed twice right after the switch. It idled at 250-300Mi with a 128M opcache; the 256M
  # one (the chart's php.ini) adds up to 128Mi, so request and limit grew by that and a margin.
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1280Mi

# wp-cli loads WooCommerce and its admin code, which needs far more than 256M (measured on
# prod-old: 128M crashed). The request is set, or it would default to the limit and stay booked
# on the node for the pod's whole life.
wpCli:
  memoryLimit: 1024M
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 1280Mi

nginx:
  # No Content-Security-Policy: checkout embeds the payment providers' frames (Braintree, PayPal),
  # and a frame-src list would have to follow theirs.
  #
  # Private files WooCommerce and its plugins keep under uploads: invoice PDFs with customer data,
  # protected downloads, logs, a removed file manager's leftovers, Facebook's product catalog
  # exports, Contact Form 7's temporary uploads and WPForms' cache.
  deniedUploadPaths:
    - wpo_wcpdf_[^/]*
    - woocommerce_uploads
    - wc-logs
    - wp-file-manager-pro
    - facebook_for_woocommerce
    - wpcf7_uploads
    - wpforms/cache

# Every secret the site reads: per entry in the secret store (key), which of its fields become
# which environment variable (env), with the 1Password item the entry comes from. They reach the
# WordPress containers through the Secret web (charts/wordpress, README "Secrets").
secrets:
  # 1Password "MariaDB | Prod | arepazo"
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=373ezgwhdppj4dsxghr3aqcxpa&h=my.1password.com
  - key: mariadb-apps/arepazo
    env:
      WORDPRESS_DB_PASSWORD: password
  # 1Password "Arepazo CMS | Prod | App" (keys and salts, prod-old's)
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=m5jimwowtt7z3zzkbldyzwpxsi&h=my.1password.com
  - key: arepazo
    env:
      WORDPRESS_AUTH_KEY: auth-key
      WORDPRESS_SECURE_AUTH_KEY: secure-auth-key
      WORDPRESS_LOGGED_IN_KEY: logged-in-key
      WORDPRESS_NONCE_KEY: nonce-key
      WORDPRESS_AUTH_SALT: auth-salt
      WORDPRESS_SECURE_AUTH_SALT: secure-auth-salt
      WORDPRESS_LOGGED_IN_SALT: logged-in-salt
      WORDPRESS_NONCE_SALT: nonce-salt
  # 1Password "Hetzner | S3 | prod arepazo" (writes the uploads)
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=t6onf7inzynbh6oqvdggcrdzoy&h=my.1password.com
  - key: arepazo-s3
    env:
      S3_KEY: access-key
      S3_SECRET: secret-key
  # 1Password "Mailomat | Prod | arepazo" (the website's SMTP login at mailomat)
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=6ietzpx5jygsojtd5fiflvdlee&h=my.1password.com
  - key: arepazo-mailomat
    env:
      SMTP_USERNAME: username
      SMTP_PASSWORD: password
  # 1Password "Valkey | Prod | arepazo" (its user in valkey-cache)
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=liu2kovgpq7s6kuyhkpfrytnhm&h=my.1password.com
  - key: valkey-apps/arepazo
    env:
      VALKEY_PASSWORD: password
  # 1Password "Zitadel | Prod | arepazo" (the app's client secret)
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=f2tzxffbdlwbr2ya5v7t45oid4&h=my.1password.com
  - key: arepazo-oidc
    env:
      OIDC_CLIENT_SECRET: client-secret

uploadsProxy:
  # The uploads proxy's read-only key (Secret uploads-proxy).
  secrets:
    # 1Password "Hetzner | S3 | prod arepazo uploads-proxy"
    #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=gs5mn5w3sfbqsljokq3ukhjtjy&h=my.1password.com
    - key: arepazo-uploads-proxy-s3
      env:
        AWS_ACCESS_KEY_ID: access-key
        AWS_SECRET_ACCESS_KEY: secret-key
