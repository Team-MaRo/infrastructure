---
# WordPress's secrets as environment variables: the database password, the keys and salts that sign
# its cookies (prod-old's, so logins survive the move) and the key it writes uploads with.
# 1Password "Arepazo CMS | Prod | App"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=m5jimwowtt7z3zzkbldyzwpxsi&h=my.1password.com
# 1Password "MariaDB | Prod | arepazo"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=373ezgwhdppj4dsxghr3aqcxpa&h=my.1password.com
# 1Password "Hetzner | S3 | prod arepazo"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=t6onf7inzynbh6oqvdggcrdzoy&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: WORDPRESS_DB_PASSWORD
      remoteRef:
        key: mariadb-apps/arepazo
        property: password
    - secretKey: WORDPRESS_AUTH_KEY
      remoteRef:
        key: arepazo
        property: auth-key
    - secretKey: WORDPRESS_SECURE_AUTH_KEY
      remoteRef:
        key: arepazo
        property: secure-auth-key
    - secretKey: WORDPRESS_LOGGED_IN_KEY
      remoteRef:
        key: arepazo
        property: logged-in-key
    - secretKey: WORDPRESS_NONCE_KEY
      remoteRef:
        key: arepazo
        property: nonce-key
    - secretKey: WORDPRESS_AUTH_SALT
      remoteRef:
        key: arepazo
        property: auth-salt
    - secretKey: WORDPRESS_SECURE_AUTH_SALT
      remoteRef:
        key: arepazo
        property: secure-auth-salt
    - secretKey: WORDPRESS_LOGGED_IN_SALT
      remoteRef:
        key: arepazo
        property: logged-in-salt
    - secretKey: WORDPRESS_NONCE_SALT
      remoteRef:
        key: arepazo
        property: nonce-salt
    - secretKey: S3_KEY
      remoteRef:
        key: arepazo-s3
        property: access-key
    - secretKey: S3_SECRET
      remoteRef:
        key: arepazo-s3
        property: secret-key
---
# The uploads proxy's read-only key: the bucket policy lets it read, never write or delete.
# 1Password "Hetzner | S3 | prod arepazo uploads-proxy"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=gs5mn5w3sfbqsljokq3ukhjtjy&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uploads-proxy
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: arepazo-uploads-proxy-s3
        property: access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: arepazo-uploads-proxy-s3
        property: secret-key
