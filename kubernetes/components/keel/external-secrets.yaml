---
# Where Keel reports each update: the ntfy topic the alerts use too (OpenBao secret/ntfy), as a
# Shoutrrr URL. ntfy takes the access token as the password of basic auth with an empty user.
# 1Password "ntfy | prod alerts"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=htj7nc5vbwet6osr3mfdm3b5yy&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keel
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      data:
        SHOUTRRR_URLS: "ntfy://:{{ .token }}@ntfy.sh/{{ .topic }}?title=Keel&tags=rocket"
  data:
    - secretKey: topic
      remoteRef:
        key: ntfy
        property: topic
    - secretKey: token
      remoteRef:
        key: ntfy
        property: token
