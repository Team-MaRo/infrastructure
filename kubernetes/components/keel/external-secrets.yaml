---
# Where Keel reports each update: the ntfy topic the alerts use too (OpenBao secret/ntfy). Through
# Keel's plain webhook notifier, not its Shoutrrr one: Keel 0.22.4 sets a `level` parameter on
# every Shoutrrr message, which Shoutrrr's ntfy service rejects, so nothing arrives
# (https://github.com/keel-hq/keel/issues/941). The webhook
# notifier POSTs Keel's JSON to this URL; ntfy turns it into a message with its templating
# (tpl=yes, the message from the JSON's `message` field - the braces are URL-encoded so that this
# template does not read them as its own). The token goes in ntfy's `auth` query parameter: the
# Authorization header value, base64 without padding, URL-safe.
# 1Password "ntfy | prod alerts"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=htj7nc5vbwet6osr3mfdm3b5yy&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keel
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      data:
        WEBHOOK_ENDPOINT: >-
          https://ntfy.sh/{{ .topic }}?auth={{ printf "Bearer %s" .token | b64enc | replace "+" "-" | replace "/" "_" | trimAll "=" }}&tpl=yes&t=Keel&tags=rocket&m=%7B%7B.message%7D%7D
  data:
    - secretKey: topic
      remoteRef:
        key: ntfy
        property: topic
    - secretKey: token
      remoteRef:
        key: ntfy
        property: token
