---
# Keel, shared by every cluster: rolls a workload out when a new image appears under the floating
# tag it runs. The Helm chart is pinned in the cluster's Application with values.yaml from here;
# these are the objects it needs besides the chart.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - external-secrets.yaml
  - service-monitor.yaml

# Shared settings (shared/): the openbao store and refresh for every ExternalSecret, the
# sync option for every monitor and rule.
components:
  - ../../shared/external-secret-defaults
  - ../../shared/monitoring-sync-options
