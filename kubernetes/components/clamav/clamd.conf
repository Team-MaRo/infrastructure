# clamd's settings that differ from its defaults (README "Design").
TCPSocket 3310
# One copy of the signatures in memory instead of two during a reload; a scan waits for the
# reload (about 9 s, measured 2026-11-06) instead of being refused.
ConcurrentDatabaseReload no
# A file beyond ClamAV's limits (MaxFileSize, MaxScanSize, archive depth and count) is reported as
# Heuristics.Limits.Exceeded instead of passing as clean.
AlertExceedsMax yes
