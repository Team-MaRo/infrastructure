# clamd's settings that differ from its defaults (README "Design").
TCPSocket 3310
# One copy of the signatures in memory instead of two during a reload; a scan waits for the
# reload (about 9 s, measured 2026-11-06) instead of being refused.
ConcurrentDatabaseReload no
# A file beyond ClamAV's limits (MaxFileSize, MaxScanSize, archive depth and count) is reported as
# Heuristics.Limits.Exceeded instead of passing as clean.
AlertExceedsMax yes
# Scans at once (default 10) and streams in clamd's queue, scanning or waiting (default 100).
# Each scan unpacks archives into /tmp and every stream lands there as it arrives - also those
# still arriving, which the queue does not count - so these bound most of /tmp, not all of it
# (deployment.yaml): the nodes have only a few GiB of disk free. Three Traefiks with four
# sessions each bring twelve, plus room for scans whose client has given up but which clamd
# still finishes; more connections wait to be accepted.
MaxThreads 4
MaxQueue 16
# A scan ends after 30 s (default 120), counted from the scan's start, not from when its stream
# was queued: well inside Traefik's 45 s for a request, so Traefik still gets the answer
# (Heuristics.Limits.Exceeded.MaxScanTime), and a stream Traefik has given up on holds a thread
# for 30 s at most.
MaxScanTime 30000
