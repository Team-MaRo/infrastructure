---
# The key to the bucket d3strukt0r-prod-clamav (secret/clamav-s3, tofu/objectstorage), where the
# pod keeps its last good signatures (README "Design").
# 1Password "Hetzner | S3 | prod clamav"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=b4q73ophzc3gdk36l4djg4d2eu&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clamav-s3
spec:
  data:
    - secretKey: S3_KEY
      remoteRef:
        key: clamav-s3
        property: access-key
    - secretKey: S3_SECRET
      remoteRef:
        key: clamav-s3
        property: secret-key
