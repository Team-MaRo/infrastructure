---
# One clamd for the whole cluster (README). One replica: a second one would cost another 1 GiB of
# memory; while the pod restarts, scans fail (user decision 2026-11-06).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  annotations:
    # Floating tags (components/keel): a new ClamAV or exporter release rolls the pod.
    keel.sh/policy: force
    keel.sh/matchTag: "true"
    keel.sh/trigger: poll
    # The bucket's key is read at start (restore, backup); a new one restarts the pod.
    secret.reloader.stakater.com/reload: clamav-s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clamav
    spec:
      securityContext:
        runAsNonRoot: true
        # The image's user clamav (Alpine image).
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The last good signatures from the bucket, which backup below keeps current (README):
        # freshclam then only fetches what changed since, and when ClamAV's mirror refuses this
        # address, clamd still starts with them. Without a copy (the first start) freshclam
        # downloads everything.
        - name: restore
          image: curlimages/curl:latest
          imagePullPolicy: Always
          command:
            - sh
            - -ec
            - |
              if curl -fsS --retry 3 --aws-sigv4 "aws:amz:nbg1:s3" --user "$S3_KEY:$S3_SECRET" \
                -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" -o /tmp/signatures.tar \
                https://d3strukt0r-prod-clamav.nbg1.your-objectstorage.com/signatures.tar; then
                tar -xf /tmp/signatures.tar -C /var/lib/clamav
                rm /tmp/signatures.tar
                echo "restored from the bucket: $(ls /var/lib/clamav | tr '\n' ' ')"
              else
                rm -f /tmp/signatures.tar
                echo "WARNING: no copy in the bucket - freshclam downloads everything"
              fi
          envFrom:
            - secretRef:
                name: clamav-s3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: signatures
              mountPath: /var/lib/clamav
            - name: tmp
              mountPath: /tmp
        # clamd does not start without signatures: whatever changed since the bucket's copy, or
        # everything (about 110 MB, seconds), into the folder clamd and freshclam share.
        - name: signatures
          # stable_base: ClamAV's current stable release, without signatures (README). The tags with
          # signatures are rebuilt every day, which would restart clamd every day through Keel.
          image: clamav/clamav:stable_base
          imagePullPolicy: Always
          # freshclam exits 0 even when the mirror refused a file (rate limit, 2026-11-06), so the
          # three files are checked: without them clamd would start missing signatures. A retry
          # does not ask the mirror again before its cool-down ends (freshclam.dat in the folder).
          command:
            - sh
            - -c
            - >-
              freshclam --foreground &&
              ls /var/lib/clamav/main.c?d /var/lib/clamav/daily.c?d /var/lib/clamav/bytecode.c?d
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # A whole set of signatures in memory while it is checked: 376 MiB peak for main.cvd
          # (Docker, 2026-11-06); the LimitRange's 128Mi got it OOM-killed four times.
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /etc/clamav/freshclam.conf
              subPath: freshclam.conf
              readOnly: true
            - name: signatures
              mountPath: /var/lib/clamav
            - name: tmp
              mountPath: /tmp
      containers:
        # Started directly, past the image's entrypoint, which runs clamd and freshclam in the
        # background and stays up when clamd dies.
        - name: clamd
          image: clamav/clamav:stable_base
          imagePullPolicy: Always
          command: [clamd, --foreground]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: clamd
              containerPort: 3310
          # The image's own check: PING over 3310 answers PONG.
          startupProbe:
            exec:
              command: [clamdcheck.sh]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [clamdcheck.sh]
            periodSeconds: 10
            # A busy clamd answers PING late; one slow answer must not drop it from the Service.
            timeoutSeconds: 5
            # Nor a full queue: with it, clamd accepts nothing - PING included - until a slot frees
            # up, 16 streams, 4 at a time, of up to 30 s each (clamd.conf) about 120 s. The only
            # clamd out of the Service would fail every scan at once instead of letting it wait.
            failureThreshold: 18
          # A frozen clamd is restarted, a busy one is not: a full queue holds PING back for
          # minutes (the Traefiks keep at most 12 sessions open), and a restart reloads the
          # signatures. 15 minutes without an answer is no longer busy.
          livenessProbe:
            exec:
              command: [clamdcheck.sh]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 15
          # The signatures in memory: about 1.04 GiB after start and after a reload (Docker,
          # 2026-11-06). To be measured on the cluster (README). Disk: its /tmp may fill to
          # 3584Mi under load (below); the limit lets the pod's local storage add up to that and
          # the other folders, which the LimitRange's 1Gi per container would not.
          resources:
            requests:
              memory: 1088Mi
              ephemeral-storage: 512Mi
            limits:
              memory: 2176Mi
              ephemeral-storage: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/clamav/clamd.conf
              subPath: clamd.conf
              readOnly: true
            - name: signatures
              mountPath: /var/lib/clamav
            # Where clamd spools each stream while scanning it.
            - name: tmp
              mountPath: /tmp
        # Fetches new signatures (12 checks a day, freshclam's default) into the shared folder and
        # tells clamd to reload, over clamd.conf's TCPSocket on localhost. Only here: the first
        # download runs before clamd, and would log an error for each failed notice.
        - name: freshclam
          image: clamav/clamav:stable_base
          imagePullPolicy: Always
          command: [freshclam, --daemon, --foreground, --daemon-notify=/etc/clamav/clamd.conf]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Like the first download when main.cvd changes (376 MiB peak); idle a few MiB.
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /etc/clamav/clamd.conf
              subPath: clamd.conf
              readOnly: true
            - name: config
              mountPath: /etc/clamav/freshclam.conf
              subPath: freshclam.conf
              readOnly: true
            - name: signatures
              mountPath: /var/lib/clamav
            - name: tmp
              mountPath: /tmp
        # Uploads the signatures to the bucket as one archive (about 115 MB) when they changed,
        # checking every 6 hours; restore above reads it. A day-old copy is plenty: it only
        # matters for a start while ClamAV's mirror refuses this address.
        - name: backup
          image: curlimages/curl:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              # Stops at once when the pod stops, instead of after the grace period: during a
              # foreground sleep the shell would hold TERM until the sleep ends, while wait returns
              # as soon as a trapped signal arrives - so the sleep runs in the background.
              trap 'exit 0' TERM
              cd /var/lib/clamav
              while true; do
                if [ ! -f /backup/uploaded ] || [ -n "$(find . -maxdepth 1 -name '*.c[lv]d' -newer /backup/uploaded)" ]; then
                  touch /backup/started
                  if tar -cf /backup/signatures.tar $(ls | grep -E '\.(cvd|cld|sign)$') &&
                    curl -fsS --retry 3 --aws-sigv4 "aws:amz:nbg1:s3" --user "$S3_KEY:$S3_SECRET" \
                      -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" -T /backup/signatures.tar \
                      https://d3strukt0r-prod-clamav.nbg1.your-objectstorage.com/signatures.tar; then
                    mv /backup/started /backup/uploaded
                    echo "uploaded to the bucket: $(ls | grep -E '\.(cvd|cld)$' | tr '\n' ' ')"
                  else
                    echo "WARNING: upload to the bucket failed - next try in 6 hours"
                  fi
                  rm -f /backup/signatures.tar
                fi
                sleep 21600 &
                wait $!
              done
          envFrom:
            - secretRef:
                name: clamav-s3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: signatures
              mountPath: /var/lib/clamav
              readOnly: true
            - name: backup
              mountPath: /backup
        # clamd's figures for Prometheus (pod-monitor.yaml): up, threads, queue, memory and the
        # signatures' age, from clamd on localhost:3310.
        - name: exporter
          image: rekzi/clamav-prometheus-exporter:latest
          imagePullPolicy: Always
          securityContext:
            # The image's own user.
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 9810
      volumes:
        - name: config
          configMap:
            name: clamav
        - name: signatures
          emptyDir:
            sizeLimit: 512Mi
        # backup's archive while it uploads.
        - name: backup
          emptyDir:
            sizeLimit: 256Mi
        # clamd's spool (clamd.conf) and freshclam's downloads: 4 scans x (100 MB stream + up to
        # 400 MB unpacked, MaxScanSize), 8 queued and up to 12 arriving streams x 100 MB and
        # freshclam's files come to about 4 GiB at worst; the limit stays below (README "Size
        # limits"). Beyond it the pod is evicted - but a node with less free disk than that
        # reaches disk pressure first, so the nodes need the room.
        - name: tmp
          emptyDir:
            sizeLimit: 3584Mi
