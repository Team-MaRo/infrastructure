# Helm values for the cert-manager chart; the chart version is the range in the cluster's
# Application. Only what differs from the chart's defaults is set.

crds:
  enabled: true
  # The CRDs stay if the chart is ever removed: deleting them would delete every Certificate and
  # Issuer in the cluster.
  keep: true

# A post-install check Job that only waits for the webhook; Argo CD shows the health itself.
startupapicheck:
  enabled: false

# The controller. Over 2026-10-23..11-02: real memory (working set minus active file cache) p95
# 52 MiB, the request; working set p95 78 MiB, peak 83 MiB, the limit twice that p95. The webhook
# (real p95 19 MiB, peak 38 MiB) stays on the LimitRange defaults.
resources:
  requests:
    memory: 64Mi
  limits:
    memory: 160Mi

# The cainjector holds every certificate, CRD and webhook configuration it patches in memory: the
# namespace's LimitRange limit of 128Mi got it OOM-killed when many CRDs arrived at once
# (2026-10-02). Over 2026-10-23..11-02: real memory p95 127 MiB, the request; working set p95
# 142 MiB, peak 143 MiB, the limit twice that p95.
cainjector:
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 288Mi
