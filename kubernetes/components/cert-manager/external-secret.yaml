---
# The Cloudflare API tokens the DNS-01 solvers create _acme-challenge records with - one
# per Cloudflare account, since a token cannot span accounts. Each may edit DNS records in
# every zone of its account (Zone:DNS:Edit, Zone:Zone:Read). Kept in 1Password and copied
# into OpenBao (secret/cloudflare-dns) by hand - see kubernetes/README.md.
#
# In cert-manager's own namespace, because ClusterIssuers read their Secrets from there.
# 1Password "Cloudflare | cert-manager DNS (prod cluster)"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=gb6fdq5kggtselhlpywmmlvake&h=my.1password.com
# 1Password "Cloudflare | Arepazo | cert-manager DNS (prod cluster)"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=vnc4tluvl3iy35fxkkavvszkwy&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-tokens
  namespace: cert-manager
  annotations:
    # The CRD is installed by another Application; ordering is not guaranteed on a fresh
    # cluster.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: personal
      remoteRef:
        key: cloudflare-dns
        property: personal
    - secretKey: arepazo
      remoteRef:
        key: cloudflare-dns
        property: arepazo
