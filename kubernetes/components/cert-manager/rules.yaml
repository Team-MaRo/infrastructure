---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager
  annotations:
    # The CRD comes with kube-prometheus-stack, another Application.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: cert-manager
      rules:
        # Issuing takes a minute or two (DNS-01 through Cloudflare); an hour means it is stuck.
        - alert: CertificateNotReady
          expr: max by (namespace, name) (certmanager_certificate_ready_status{condition="False"}) == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} has not been Ready for an hour."
            description: >-
              kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}, then the
              CertificateRequest, Order and Challenge it names - usually the Cloudflare token or a
              DNS record.

        # cert-manager renews at two thirds of a certificate's lifetime (30 days before expiry at
        # Let's Encrypt's 90 days, ~21 at 64 days from 2027-02-10, 15 at 45 days from 2028-02-16).
        # Measured from the renewal time it sets itself, so the alert holds for any lifetime:
        # two days past it means renewal is failing, with weeks left before expiry.
        - alert: CertificateRenewalOverdue
          expr: time() - max by (namespace, name) (certmanager_certificate_renewal_timestamp_seconds) > 2 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} should have been renewed {{ $value | humanizeDuration }} ago."
            description: >-
              Renewal is failing. kubectl -n {{ $labels.namespace }} describe certificate
              {{ $labels.name }}, then the CertificateRequest, Order and Challenge it names;
              kubectl -n cert-manager logs deploy/cert-manager.
        # The last line before browsers refuse the site.
        - alert: CertificateExpiringSoon
          expr: max by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds) - time() < 7 * 86400
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}."
            description: >-
              Renewal has been failing for days. kubectl -n {{ $labels.namespace }} describe
              certificate {{ $labels.name }}; kubectl -n cert-manager logs deploy/cert-manager.
