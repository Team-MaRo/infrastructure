---
# cert-manager, shared by every cluster: issues and renews certificates from Let's Encrypt,
# proving domain ownership over DNS-01 through the Cloudflare API.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Pinned to a release; bumping this line is the upgrade. The manifest brings its own
  # namespace, cert-manager.
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
  - external-secret.yaml
  - cluster-issuers.yaml
  - service-monitor.yaml
  - rules.yaml

patches:
  # The cainjector holds every certificate, CRD and webhook configuration it patches in memory:
  # about 127 MiB usually, and the namespace's LimitRange limit of 128Mi got it OOM-killed
  # when many CRDs arrived at once (2026-10-02). The manifest sets no resources.
  - target:
      kind: Deployment
      name: cert-manager-cainjector
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
  # The controller and the webhook: p99 81 / 38 MiB, peak 83 / 38 MiB over 2026-10-23..11-02,
  # above the default request of 32Mi. The request p99 x 1.1, the limit twice the request.
  - target:
      kind: Deployment
      name: cert-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 96Mi
          limits:
            memory: 192Mi
  - target:
      kind: Deployment
      name: cert-manager-webhook
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 48Mi
          limits:
            memory: 96Mi

# Shared settings (shared/): the openbao store and refresh for every ExternalSecret, the
# sync option for every monitor and rule.
components:
  - ../../shared/external-secret-defaults
  - ../../shared/monitoring-sync-options
