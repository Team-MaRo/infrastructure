---
# cert-manager, shared by every cluster: issues and renews certificates from Let's Encrypt,
# proving domain ownership over DNS-01 through the Cloudflare API. cert-manager itself comes from
# its Helm chart (the cluster's Application, values.yaml); this directory adds its namespace,
# issuers, tokens and monitoring.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - external-secret.yaml
  - cluster-issuers.yaml
  - service-monitor.yaml
  - rules.yaml

# Shared settings (shared/): the openbao store and refresh for every ExternalSecret, the
# sync option for every monitor and rule.
components:
  - ../../shared/external-secret-defaults
  - ../../shared/monitoring-sync-options
