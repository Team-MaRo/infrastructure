---
# Let's Encrypt's staging CA: same flow, generous rate limits, certificates no browser
# trusts. For trying a new name or setup before asking the real CA.
#
# Both issuers have two DNS-01 solvers, one per Cloudflare account. cert-manager picks the
# most specific match: names in the arepazo account's zones use its token, everything else
# falls through to the solver without a selector - the personal account.
#
# No email: the ACME account does not need one, this repo is public, and Let's Encrypt no
# longer sends expiry mails. The account key is generated by cert-manager into the Secret
# named under privateKeySecretRef.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    # The CRD is installed in the same sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - selector:
          dnsZones: [arepazo.ch]
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-tokens
              key: arepazo
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-tokens
              key: personal
---
# The real CA, for everything that serves traffic.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - selector:
          dnsZones: [arepazo.ch]
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-tokens
              key: arepazo
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-tokens
              key: personal
