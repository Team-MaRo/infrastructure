---
# zot's metrics (requests, storage, garbage collection) from its Service, logged in as the user
# metrics (Secret zot-metrics, external-secrets.yaml) - /metrics needs a login, since the whole
# host is routed for the UI (ingress.yaml).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: zot
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zot
  endpoints:
    - port: zot
      path: /metrics
      basicAuth:
        username:
          name: zot-metrics
          key: username
        password:
          name: zot-metrics
          key: password
