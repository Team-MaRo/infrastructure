# Values for the zot chart (README). Only what differs from the chart's defaults; the chart is
# pinned in kubernetes/clusters/prod/zot.yaml.

# Inside the cluster only: the Ingress (ingress.yaml) is ours, since it must carry the label
# d3strukt0r.dev/dns-only, which the chart cannot set.
service:
  type: ClusterIP

# The configuration and the htpasswd file come from the Secret zot-config (external-secrets.yaml),
# mounted where the image reads config.json.
externalSecrets:
  - secretName: zot-config
    mountPath: /etc/zot

# The key to the bucket, read by zot's S3 driver from its usual variables.
env:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: zot-s3
        key: AWS_ACCESS_KEY_ID
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: zot-s3
        key: AWS_SECRET_ACCESS_KEY

# The image runs as root by default; the restricted Pod Security standard needs a user. Tested as
# 10001 with a read-only root (2026-10-28): it only writes /tmp and its root directory, both
# emptyDirs - the images are in S3, users and API keys in Valkey.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
extraVolumes:
  - name: tmp
    emptyDir: {}
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp

# Memory over 2026-10-23..11-02: real memory (working set minus active file cache) p95 149 MiB, the
# request; working set p95 150 MiB, peak 184 MiB, the limit twice that p95; layer uploads stream
# through to S3. The mirror downloads an image into /var/lib/registry/sync (an emptyDir) before it
# moves to S3 - zot refuses to start without that directory once its storage is remote - so the
# local storage limit is raised from the LimitRange's 1Gi: an image with several large layers would
# otherwise get the pod evicted.
resources:
  requests:
    memory: 160Mi
    ephemeral-storage: 1Gi
  limits:
    memory: 320Mi
    ephemeral-storage: 5Gi

# An upstream name is looked up as it is, not through the cluster's search list first, and an
# unanswered lookup gives up after a second: with cluster DNS down, zot answers a pull within
# seconds and containerd falls back to the origin (README "Mirror").
dnsConfig:
  options:
    - name: ndots
      value: "1"
    - name: timeout
      value: "1"
    - name: attempts
      value: "2"

# zot reads its configuration only at start (components/reloader).
deploymentAnnotations:
  secret.reloader.stakater.com/reload: zot-config,zot-s3
