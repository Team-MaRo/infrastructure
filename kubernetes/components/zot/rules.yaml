---
# Alerts for zot. While it is down the nodes fall back to the origin registries for mirrored
# images (ansible/roles/k3s, "Pulling through zot"); only an image kept solely in zot - decided
# per image, none while ours go to Docker Hub - cannot be pulled by a node that lacks it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zot
spec:
  groups:
    - name: zot
      rules:
        # Not scraped: the pod is gone or does not answer /metrics.
        - alert: ZotDown
          expr: absent(up{job="zot", namespace="zot"} == 1)
          for: 5m
          labels:
            severity: critical
            namespace: zot
          annotations:
            summary: "zot, the container registry, does not answer."
            description: >-
              Nodes pull mirrored images from their origin registries meanwhile, more slowly;
              an image kept only in zot cannot be pulled. Check the pod and its log
              (kubectl --context d3strukt0r-prod-admin -n zot get pods; kubectl --context
              d3strukt0r-prod-admin -n zot logs deploy/zot) - a failed start usually names the
              configuration, S3 or Valkey (README, "Checking it").
