---
# zot's configuration, mounted at /etc/zot (values.yaml), where the image reads config.json. A
# template here, so every setting is in git and only the secrets come from OpenBao:
# - htpasswd: the bcrypt hashes of the users admin, cluster and metrics (secret/zot) - admin and
#   cluster only log in to create API keys, since zot refuses passwords at its token endpoint once
#   GitHub's tokens are on; metrics is Prometheus' (README "Logins").
# - valkey-password: its user in valkey-state (secret/valkey-apps/zot), URL-encoded into the
#   addresses, where users, API keys and the UI's sessions are kept (README "Design").
# - oidc-client-secret: the UI's login through Zitadel (secret/zot-oidc, app zot in tofu/zitadel).
# 1Password "Zot | Prod | admin"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=oflhq5kcafpo5np4aj2csrvfqq&h=my.1password.com
# 1Password "Zot | Prod | cluster"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=od76biljijf6a7umrlojyd45ya&h=my.1password.com
# 1Password "Zot | Prod | metrics"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=76i4r6k6moxwyrhttdfebbkf3u&h=my.1password.com
# 1Password "Valkey | Prod | zot"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=233swwvse6eihstd2sxh222xsu&h=my.1password.com
# 1Password "Zitadel | Prod | zot"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=44rf2knxnk3y4wvjbn5yg7w44i&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-config
spec:
  target:
    template:
      data:
        htpasswd: "{{ .htpasswd }}"
        config.json: |
          {
            "distSpecVersion": "1.1.1",
            "storage": {
              "rootDirectory": "/var/lib/registry",
              "dedupe": false,
              "gc": true,
              "remoteCache": true,
              "cacheDriver": {
                "name": "redis",
                "url": "redis://zot:{{ .valkeyPassword | urlquery }}@valkey-state.valkey-state.svc:6379/4",
                "keyprefix": "zot"
              },
              "storageDriver": {
                "name": "s3",
                "region": "nbg1",
                "regionendpoint": "https://nbg1.your-objectstorage.com",
                "bucket": "d3strukt0r-prod-zot",
                "forcepathstyle": true,
                "secure": true,
                "skipverify": false
              }
            },
            "http": {
              "address": "0.0.0.0",
              "port": "5000",
              "externalUrl": "https://registry.d3strukt0r.dev",
              "compat": ["docker2s2"],
              "auth": {
                "htpasswd": { "path": "/etc/zot/htpasswd" },
                "apikey": true,
                "openid": {
                  "providers": {
                    "oidc": {
                      "name": "OpenID Connect",
                      "issuer": "https://auth.d3strukt0r.dev",
                      "clientid": "397247604699693478",
                      "clientsecret": {{ .oidcClientSecret | toJson }},
                      "scopes": ["openid", "profile", "email"],
                      "claimMapping": { "username": "preferred_username", "groups": "groups" }
                    }
                  }
                },
                "sessionDriver": {
                  "name": "redis",
                  "url": "redis://zot:{{ .valkeyPassword | urlquery }}@valkey-state.valkey-state.svc:6379/4",
                  "keyprefix": "zotsession"
                },
                "bearer": {
                  "realm": "https://registry.d3strukt0r.dev/zot/auth/token",
                  "service": "registry.d3strukt0r.dev",
                  "oidc": [
                    {
                      "issuer": "https://token.actions.githubusercontent.com",
                      "audiences": ["registry.d3strukt0r.dev"],
                      "claimMapping": {
                        "variables": [{ "name": "owner", "expression": "claims.repository_owner" }],
                        "validations": [
                          {
                            "expression": "vars.owner in ['Team-MaRo', 'D3strukt0r']",
                            "message": "only workflows of Team-MaRo and D3strukt0r may push"
                          }
                        ],
                        "username": "claims.repository",
                        "groups": "['github-actions']"
                      }
                    }
                  ]
                }
              },
              "accessControl": {
                "repositories": {
                  "team-maro/**": {
                    "policies": [
                      { "groups": ["github-actions"], "actions": ["read", "create", "update"] },
                      { "users": ["cluster"], "actions": ["read"] }
                    ]
                  },
                  "d3strukt0r/**": {
                    "policies": [
                      { "groups": ["github-actions"], "actions": ["read", "create", "update"] },
                      { "users": ["cluster"], "actions": ["read"] }
                    ]
                  },
                  "**": {
                    "policies": [{ "users": ["cluster"], "actions": ["read"] }]
                  }
                },
                "adminPolicy": {
                  "users": ["admin"],
                  "groups": ["infra-admin"],
                  "actions": ["read", "create", "update", "delete"]
                },
                "metrics": { "users": ["metrics"] }
              }
            },
            "log": { "level": "info" },
            "extensions": {
              "metrics": { "enable": true, "prometheus": { "path": "/metrics" } },
              "search": { "enable": true },
              "ui": { "enable": true },
              "sync": {
                "enable": true,
                "downloadDir": "/var/lib/registry/sync",
                "registries": [
                  { "urls": ["https://registry-1.docker.io"], "onDemand": true, "tlsVerify": true, "content": [{ "prefix": "**", "destination": "/docker.io" }] },
                  { "urls": ["https://ghcr.io"], "onDemand": true, "tlsVerify": true, "content": [{ "prefix": "**", "destination": "/ghcr.io" }] },
                  { "urls": ["https://quay.io"], "onDemand": true, "tlsVerify": true, "content": [{ "prefix": "**", "destination": "/quay.io" }] },
                  { "urls": ["https://registry.k8s.io"], "onDemand": true, "tlsVerify": true, "content": [{ "prefix": "**", "destination": "/registry.k8s.io" }] },
                  { "urls": ["https://public.ecr.aws"], "onDemand": true, "tlsVerify": true, "content": [{ "prefix": "**", "destination": "/public.ecr.aws" }] }
                ]
              }
            }
          }
  data:
    - secretKey: htpasswd
      remoteRef:
        key: zot
        property: htpasswd
    - secretKey: valkeyPassword
      remoteRef:
        key: valkey-apps/zot
        property: password
    - secretKey: oidcClientSecret
      remoteRef:
        key: zot-oidc
        property: client-secret
---
# Prometheus' login to /metrics (service-monitor.yaml), the user metrics of the htpasswd file.
# 1Password "Zot | Prod | metrics"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=76i4r6k6moxwyrhttdfebbkf3u&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-metrics
spec:
  target:
    template:
      data:
        username: metrics
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: zot
        property: metrics-password
---
# The key to the bucket d3strukt0r-prod-zot (secret/zot-s3), as the environment variables zot's
# S3 driver reads (values.yaml), so it stays out of the configuration.
# 1Password "Hetzner | S3 | prod zot"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=iiiac6kigz57va4kxpfk2c2tc4&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-s3
spec:
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: zot-s3
        property: access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: zot-s3
        property: secret-key
---
# zot's user in valkey-state, brought there like a site's into valkey-cache: one Valkey config
# line, restricted to database 4, its password as a SHA-256 hash (components/valkey-state,
# "Adding an app"). Rights: everything but @dangerous, plus FLUSHDB and INFO - tested with zot
# v2.1.22 (2026-10-28): nothing refused.
# 1Password "Valkey | Prod | zot"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=233swwvse6eihstd2sxh222xsu&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-4
  namespace: valkey-state
spec:
  target:
    template:
      metadata:
        annotations:
          # A new or changed user restarts Valkey, which reads its users only at start.
          reloader.stakater.com/match: "true"
      data:
        users.conf: |
          user zot on #{{ .password | sha256sum }} resetdbs db=4 resetchannels ~* +@all -@dangerous +flushdb +info
  data:
    - secretKey: password
      remoteRef:
        key: valkey-apps/zot
        property: password
