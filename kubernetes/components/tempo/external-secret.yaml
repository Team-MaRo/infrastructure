---
# Tempo's own S3 key (OpenBao secret/tempo-s3), as the environment variables its config expands.
# The bucket policy admits only this key and the admin's.
# 1Password "Hetzner | S3 | prod tempo"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=ndah5ezo3ycg2iah7zxbw2isfe&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-s3
spec:
  data:
    - secretKey: TEMPO_S3_ACCESS_KEY
      remoteRef:
        key: tempo-s3
        property: access-key
    - secretKey: TEMPO_S3_SECRET_KEY
      remoteRef:
        key: tempo-s3
        property: secret-key
