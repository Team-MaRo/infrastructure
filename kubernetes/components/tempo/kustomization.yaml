---
# Tempo, shared by every cluster: stores the traces Alloy receives, in Object Storage.
# values.yaml is its Helm values, not a resource.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - external-secret.yaml
  - rules.yaml

# refreshInterval and the openbao store for every ExternalSecret here (shared/).
components:
  - ../../shared/external-secret-defaults
