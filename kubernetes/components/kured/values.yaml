# Helm values for the kured chart; the chart version is the range in the cluster's Application.
# Only what differs from the chart's defaults is set.

configuration:
  # After k3s upgrades (02:30-03:30) and OS updates (03:30, installed within minutes), and early
  # enough for the descheduler to run at 05:50 and everything to be done by 06:00 - the pods it
  # moves are down briefly, which belongs in the night. The sentinel is checked every 10 minutes
  # rather than the default hour, so all nodes fit into the 90 minutes if one kernel reached them
  # all.
  startTime: "04:00"
  endTime: "05:30"
  timeZone: Europe/Zurich
  period: 10m
  # Never drain the MariaDB primary's node: an evicted primary fails over without being demoted
  # and comes back unable to rejoin (error 1236, mariadb-operator#1948), so the operator rebuilds
  # it from a backup (night of 2026-11-03). kured checks this before it takes the lock or cordons,
  # and only for pods on its own node; the annotation marks a node that waits for a reboot, and
  # mariadb's CronJob primary-off-rebooting-node then switches the primary away.
  blockingPodSelector:
    - k8s.mariadb.com/role=primary
  annotateNodes: true

# Memory over 2026-11-13..18 (5 days, a longer window to come): real memory (working set minus
# active file cache) p95 28 MiB, the request; working set peak 63 MiB ÷ 0.8, the limit. The chart
# sets none, and kube-system has no LimitRange.
resources:
  requests:
    memory: 32Mi
  limits:
    memory: 96Mi
