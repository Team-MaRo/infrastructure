---
# kured reboots a node when a kernel update has left /var/run/reboot-required behind - one node at
# a time (cordon, drain, reboot, uncordon), coordinated through a lock on its own DaemonSet, so
# etcd never loses more than one member. kured itself comes from its Helm chart (the cluster's
# Application, values.yaml); this directory adds its PodMonitor.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pod-monitor.yaml

# The sync option for the PodMonitor (shared/).
components:
  - ../../shared/monitoring-sync-options
