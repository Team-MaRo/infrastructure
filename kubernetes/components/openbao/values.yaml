# Helm values for the openbao/openbao chart, shared by every cluster. The chart and its
# version are pinned in the cluster's Application (kubernetes/clusters/<name>/openbao.yaml);
# only values that differ from the chart's defaults are set here.

# External Secrets delivers secrets into Kubernetes; the sidecar injector is not used.
injector:
  enabled: false

server:
  # The UI and API at openbao.d3strukt0r.dev (its own record in tofu/cloudflare), certificate
  # from certificates.yaml. TLS ends at Traefik. No ingressClassName: Traefik is the cluster's
  # default IngressClass.
  ingress:
    enabled: true
    hosts:
      - host: openbao.d3strukt0r.dev
    tls:
      - hosts:
          - openbao.d3strukt0r.dev
        secretName: openbao-tls
  standalone:
    # One replica, on purpose: OpenBao is only asked when a secret is created or rotated, and
    # External Secrets has already copied every value into a Kubernetes Secret, so a pod that
    # is moving after a node failure delays changes but breaks nothing.
    #
    # Raft rather than the chart's default "file" storage, even with one node: it provides
    # snapshots (`bao operator raft snapshot save`, the chart's snapshotAgent) for backups.
    #
    # tls_disable: from outside, TLS ends at Traefik; between pods and nodes the pod
    # network's WireGuard tunnels encrypt the traffic.
    #
    # The static seal unseals OpenBao on every start with a 32-byte key from Secret
    # openbao-seal, which is not in git - ansible/secrets.yml writes it from 1Password.
    # Changing the key means rotating it through previous_key/previous_key_id, never simply
    # replacing it: data encrypted with the old key would become unreadable.
    config: |
      ui = true

      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable     = 1
      }

      storage "raft" {
        path = "/openbao/data"
      }

      seal "static" {
        current_key_id = "1"
        current_key    = "file:///openbao/seal/key"
      }

  # From what it used when set (2026-09-28): about 70 MiB at most, and it can spike on
  # startup and snapshots - above the namespace's LimitRange limit of 128Mi.
  resources:
    requests:
      memory: 96Mi
    limits:
      memory: 256Mi

  volumes:
    - name: seal
      secret:
        secretName: openbao-seal

  volumeMounts:
    - name: seal
      mountPath: /openbao/seal
      readOnly: true
