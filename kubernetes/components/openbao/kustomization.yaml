---
# OpenBao, shared by every cluster. The Helm chart is pinned in the cluster's Application with
# values.yaml from here; these are the objects it needs besides the chart.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - certificates.yaml
  - external-secrets.yaml
  - rules.yaml

# Shared settings (shared/): the openbao store and refresh for every ExternalSecret, the
# sync option for every monitor and rule.
components:
  - ../../shared/external-secret-defaults
  - ../../shared/monitoring-sync-options
