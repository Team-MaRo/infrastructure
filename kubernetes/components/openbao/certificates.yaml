---
# OpenBao's certificate for Traefik, issued separately rather than through Ingress annotations.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
spec:
  secretName: openbao-tls
  dnsNames:
    - openbao.d3strukt0r.dev
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
