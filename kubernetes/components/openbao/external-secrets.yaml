---
# The S3 key the snapshot agent uploads with (OpenBao secret/openbao-snapshot-s3), under the
# names s3cmd reads. OpenBao hands out the key to its own backups: taking a snapshot needs a
# running OpenBao anyway, and a restore uses the admin key.
# 1Password "Hetzner | S3 | prod openbao snapshots"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=7wzbdy35bhtgqn6ahbqyoaiuum&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-snapshot-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: openbao-snapshot-s3
        property: access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: openbao-snapshot-s3
        property: secret-key
