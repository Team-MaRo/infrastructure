---
# php-fpm's pool figures of the API - busy and idle workers, queued requests, slow requests -
# served by its nginx on the port metrics (config/nginx-metrics.conf). The job is
# wedding-manuele-robine/php-fpm; alerts and the dashboard are kube-prometheus-stack's
# (php-fpm.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: php-fpm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  podMetricsEndpoints:
    - port: metrics
