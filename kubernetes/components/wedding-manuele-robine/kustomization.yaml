---
# wedding-manuele-robine, the wedding website at manuele-robine.wedding: the PWA, its Symfony API,
# its database in the shared MariaDB and its media in Hetzner Object Storage.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - database.yaml
  - external-secrets.yaml
  - api.yaml
  - pwa.yaml
  - ingresses.yaml
  - pod-monitor.yaml

# A hash in the name, so a change to any of these files rolls the API.
configMapGenerator:
  - name: api-config
    files:
      - config/php-fpm-metrics.conf
      - config/nginx-metrics.conf

# refreshInterval and the openbao store for every ExternalSecret here (shared/).
components:
  - ../../shared/external-secret-defaults
