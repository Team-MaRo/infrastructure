---
# wedding-manuele-robine, the wedding website at manuele-robine.wedding: the PWA, its Symfony API,
# its database in the shared MariaDB and its media in Hetzner Object Storage.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - database.yaml
  - external-secrets.yaml
  - api.yaml
  - pwa.yaml
  - ingresses.yaml
  - pod-monitor.yaml
  # Only Cloudflare reaches its proxied routes (charts/cloudflare-only).
  - ../../charts/cloudflare-only/files

# A hash in the name, so a change to any of these files rolls the API.
configMapGenerator:
  - name: api-config
    files:
      - config/php-fpm-metrics.conf
      - config/nginx-metrics.conf

# Shared settings (shared/): the openbao store and refresh for every ExternalSecret, the
# sync option for every monitor and rule.
components:
  - ../../shared/external-secret-defaults
  - ../../shared/monitoring-sync-options
