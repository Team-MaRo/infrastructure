---
# The API's secrets, read as environment variables at start (Reloader restarts it on a change):
# Symfony's APP_SECRET and the JWT key's passphrase (OpenBao secret/wedding-manuele-robine), the
# database URL with the password from secret/mariadb-apps/wedding-manuele-robine (letters and
# digits only, it sits in the URL), and the media bucket's key (secret/wedding-manuele-robine-s3).
# 1Password "Wedding Manuele Robine | Prod | App"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=5t6sla7i6rowrlwldzpb5p2xsu&h=my.1password.com
# 1Password "MariaDB | Prod | wedding-manuele-robine"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=w7e6ngluqweynmirg2om57ukom&h=my.1password.com
# 1Password "Hetzner | S3 | prod wedding-manuele-robine"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=ytvt5yczmlghqtf7ki6orppn6e&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      data:
        APP_SECRET: "{{ .appSecret }}"
        JWT_PASSPHRASE: "{{ .jwtPassphrase }}"
        DATABASE_URL: "mysql://wedding_manuele_robine:{{ .dbPassword }}@mariadb-primary.mariadb.svc:3306/wedding_manuele_robine?serverVersion=12.3.3-MariaDB&charset=utf8mb4"
        S3_STORAGE_KEY: "{{ .s3AccessKey }}"
        S3_STORAGE_SECRET: "{{ .s3SecretKey }}"
  data:
    - secretKey: appSecret
      remoteRef:
        key: wedding-manuele-robine
        property: app-secret
    - secretKey: jwtPassphrase
      remoteRef:
        key: wedding-manuele-robine
        property: jwt-passphrase
    - secretKey: dbPassword
      remoteRef:
        key: mariadb-apps/wedding-manuele-robine
        property: password
    - secretKey: s3AccessKey
      remoteRef:
        key: wedding-manuele-robine-s3
        property: access-key
    - secretKey: s3SecretKey
      remoteRef:
        key: wedding-manuele-robine-s3
        property: secret-key
---
# The JWT key pair the API signs and checks logins with, mounted as files.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: private.pem
      remoteRef:
        key: wedding-manuele-robine
        property: jwt-private-key
    - secretKey: public.pem
      remoteRef:
        key: wedding-manuele-robine
        property: jwt-public-key
---
# The PWA's Google Maps key - public in the browser anyway, but not for git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pwa
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: VITE_GOOGLE_MAPS_API_KEY
      remoteRef:
        key: wedding-manuele-robine
        property: google-maps-api-key
