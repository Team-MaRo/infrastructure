---
# The website: nginx under supervisord, as root (the namespace's Pod Security exemption). Its
# entrypoint substitutes the VITE_* variables at start, so they are runtime settings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pwa
  annotations:
    keel.sh/policy: force
    keel.sh/matchTag: "true"
    keel.sh/trigger: poll
    secret.reloader.stakater.com/reload: pwa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pwa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pwa
    spec:
      containers:
        - name: pwa
          image: d3strukt0r/wedding-manuele-robine:pwa-latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: pwa
          env:
            - name: API_URL
              value: http://api
            - name: VITE_PUBLIC_API_URL
              value: https://api-wedding-manuele-robine.d3strukt0r.dev
          ports:
            - name: http
              containerPort: 80
          # Over 2026-10-23..11-02: real memory (working set minus active file cache) p95 142 MiB,
          # the request; working set p95 158 MiB, peak 158 MiB, the limit twice that p95.
          resources:
            requests:
              memory: 144Mi
            limits:
              memory: 320Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: pwa
spec:
  selector:
    app.kubernetes.io/name: pwa
  ports:
    - name: http
      port: 80
      targetPort: http
