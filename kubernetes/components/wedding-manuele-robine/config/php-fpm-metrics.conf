; Added to the image's pool www (mounted as /etc/php/8.3/fpm/pool.d/zz-metrics.conf - the path
; carries the image's PHP version: on a new PHP version the file is no longer read, and
; PhpFpmStatusDown fires). The image's www.conf already sets pm.status_path = /status.
[www]
; The pool figures for Prometheus, through nginx's metrics server (nginx-metrics.conf).
; status_listen is a pool of its own, so the figures still come while all workers are busy.
; Only on localhost.
pm.status_listen = 127.0.0.1:9001
; A request running longer than 2 s writes its PHP backtrace into the container log, as in the
; WordPress sites, so a slow spell shows what the API waits on.
request_slowlog_timeout = 2s
slowlog = /proc/self/fd/2
; A memory limit per request: the image's php.ini sets none (-1), so one runaway request could fill
; the container's 512Mi and take every other request down with it. A worker holds about 10 MB and
; the opcache 15 MB, so 256M fits beside the other four workers; a request beyond it fails alone,
; with PHP's "Allowed memory size exhausted". php_admin_value, so the app cannot raise it.
php_admin_value[memory_limit] = 256M
