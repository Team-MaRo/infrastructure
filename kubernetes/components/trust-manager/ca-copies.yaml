---
# The databases' CA certificates, copied into trust-manager's trust namespace - the only place it
# reads sources from. Once here, for every app; bundles.yaml distributes them. External Secrets
# reads each through its Kubernetes provider with this ServiceAccount, which may read exactly
# those two Secrets and nothing else. Only `ca.crt` is copied: CloudNativePG's Secret also holds
# the CA's private key, which never leaves the postgres namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: database-ca-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trust-manager-ca-reader
  namespace: postgres
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [postgres-ca]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trust-manager-ca-reader
  namespace: postgres
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trust-manager-ca-reader
subjects:
  - kind: ServiceAccount
    name: database-ca-reader
    namespace: trust-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trust-manager-ca-reader
  namespace: mariadb
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [mariadb-ca-bundle]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trust-manager-ca-reader
  namespace: mariadb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trust-manager-ca-reader
subjects:
  - kind: ServiceAccount
    name: database-ca-reader
    namespace: trust-manager
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: postgres
spec:
  provider:
    kubernetes:
      remoteNamespace: postgres
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: database-ca-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: mariadb
spec:
  provider:
    kubernetes:
      remoteNamespace: mariadb
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: database-ca-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-ca
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: postgres
  data:
    - secretKey: ca.crt
      remoteRef:
        key: postgres-ca
        property: ca.crt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-ca
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: mariadb
  data:
    - secretKey: ca.crt
      remoteRef:
        key: mariadb-ca-bundle
        property: ca.crt
