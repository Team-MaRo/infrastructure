---
# trust-manager's metrics, among them whether each Bundle is synced. Here rather than through the
# chart, whose ServiceMonitor cannot carry the sync option below.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trust-manager
  annotations:
    # The CRD comes with kube-prometheus-stack, another Application.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: trust-manager
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
