---
# trust-manager, shared by every cluster: distributes the databases' CA certificates into the
# namespaces of the apps that verify them. The Helm chart is pinned in the cluster's Application
# with values.yaml from here; these are the objects it needs besides the chart.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ca-copies.yaml
  - bundles.yaml
  - service-monitor.yaml
