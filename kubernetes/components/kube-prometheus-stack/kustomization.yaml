---
# kube-prometheus-stack, shared by every cluster: Prometheus, Alertmanager, Grafana and the
# exporters. values.yaml is its Helm values, not a resource; the manifests below are what the
# chart does not cover.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - external-secrets.yaml
  - scrape-etcd.yaml
  - rules.yaml
  - php-fpm.yaml
  - wordpress.yaml
  - middleware-oauth2-proxy.yaml
  - network-policy.yaml
  # Only Cloudflare reaches its proxied routes (charts/cloudflare-only).
  - ../../charts/cloudflare-only/files

# Dashboards of our own, as ConfigMaps Grafana's sidecar loads (label grafana_dashboard).
configMapGenerator:
  - name: dashboard-php-fpm
    files:
      - dashboards/php-fpm.json
    options:
      labels:
        grafana_dashboard: "1"

# Shared settings (shared/): the openbao store and refresh for every ExternalSecret, the
# sync option for every monitor and rule.
components:
  - ../../shared/external-secret-defaults
  - ../../shared/monitoring-sync-options
