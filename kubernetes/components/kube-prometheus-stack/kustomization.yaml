---
# kube-prometheus-stack, shared by every cluster: Prometheus, Alertmanager, Grafana and the
# exporters. values.yaml is its Helm values, not a resource; the manifests below are what the
# chart does not cover.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - external-secrets.yaml
  - scrape-etcd.yaml
  - rules.yaml
  - php-fpm.yaml
  - wordpress.yaml
  - memory-sizing.yaml
  - middleware-oauth2-proxy.yaml
  - network-policy.yaml
  # Only Cloudflare reaches its proxied routes (charts/cloudflare-only).
  - ../../charts/cloudflare-only/files

# This namespace's per-visitor rate limit above the default (charts/cloudflare-only README,
# "Raising the limit for one app"): Grafana sends every panel's query at once. A heavy session
# (2026-11-17 19:13, Traefik's spans in Tempo): 1,628 requests, up to 118 in a second and 102
# within 100 ms; replayed against the default 20/100 it lost 587, against 50/300 none, a third of
# the burst used. Covers every route here - Grafana, Prometheus and Alertmanager, all behind a login.
patches:
  - target:
      kind: Middleware
      name: cloudflare-rate-limit
    patch: |-
      - op: replace
        path: /spec/rateLimit/average
        value: 50
      - op: replace
        path: /spec/rateLimit/burst
        value: 300

# Dashboards of our own, as ConfigMaps Grafana's sidecar loads (label grafana_dashboard).
configMapGenerator:
  - name: dashboard-php-fpm
    files:
      - dashboards/php-fpm.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: dashboard-memory-sizing
    files:
      - dashboards/memory-sizing.json
    options:
      labels:
        grafana_dashboard: "1"

# Shared settings (shared/): the openbao store and refresh for every ExternalSecret, the
# sync option for every monitor and rule.
components:
  - ../../shared/external-secret-defaults
  - ../../shared/monitoring-sync-options
