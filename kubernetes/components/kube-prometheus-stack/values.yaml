# Helm values for kube-prometheus-stack; the chart version is pinned in the cluster's
# Application. Namespace monitoring gets Kyverno's LimitRange like any app namespace, so only
# containers that need more than its defaults set resources here.

# The chart's volume alert warns at 15 % free if a trend says it fills within 4 days, and is
# critical at 3 % free; rules.yaml has fixed thresholds instead.
defaultRules:
  disabled:
    KubePersistentVolumeFillingUp: true

# k3s runs the controller manager, scheduler and proxy inside its one process, with no
# endpoints of their own to scrape. Their alerts and dashboards go with them.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# etcd stays enabled for its alerts and dashboard, but the chart's Service and ServiceMonitor
# would need an Endpoints object, which Argo CD does not manage; scrape-etcd.yaml scrapes the
# nodes directly instead, under the job name those rules expect.
kubeEtcd:
  service:
    enabled: false
  serviceMonitor:
    enabled: false

# k3s serves one shared metrics registry on every component's port: the API server's
# /metrics and each kubelet's /metrics return the same ~64,000 series. The API server keeps
# them, minus histogram buckets no rule or dashboard of this chart reads and minus the
# kubelet's families; the kubelet keeps only its own. Through the API server, the kubelet's
# volume metrics would also carry namespace "default" instead of the PVC's.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      # The chart's default, kept: fewer buckets for the histograms its SLO rules use.
      - action: drop
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
        sourceLabels: [__name__, le]
      - action: drop
        regex: (apiserver_request_duration_seconds|etcd_request_duration_seconds|apiserver_watch_events_dispatch_duration_seconds|apiserver_storage_list_duration_seconds|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_watch_cache_initialization_duration_seconds|apiserver_response_sizes|apiserver_watch_events_sizes|apiserver_request_body_size_bytes)_bucket
        sourceLabels: [__name__]
      - action: drop
        regex: kubelet_.*|volume_manager_.*
        sourceLabels: [__name__]

kubelet:
  serviceMonitor:
    metricRelabelings:
      - action: keep
        regex: kubelet_.*|volume_manager_.*|storage_operation_.*|csi_operations_.*|rest_client_.*|process_.*|go_goroutines
        sourceLabels: [__name__]
      # The chart's default, kept.
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?

prometheusOperator:
  # The admission webhook's certificate comes from cert-manager, instead of the chart's Helm
  # hook Jobs, which Argo CD would run on every sync.
  admissionWebhooks:
    certManager:
      enabled: true

prometheus:
  # At prometheus.d3strukt0r.dev behind the Zitadel gate (middleware-oauth2-proxy.yaml), its
  # record in tofu/cloudflare, certificate from certificates.yaml. From host and TLS the chart
  # derives Prometheus' externalUrl (https), which the alerts' Source link is built from.
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-oauth2-proxy@kubernetescrd
    hosts:
      - prometheus.d3strukt0r.dev
    tls:
      - hosts:
          - prometheus.d3strukt0r.dev
        secretName: prometheus-tls
  prometheusSpec:
    retention: 30d
    # Deletes the oldest data before the volume fills, whatever the age. At about 350 MB a
    # day, 10 GB holds roughly three weeks, so this is the limit that applies, not the 30 days.
    # Growing the volume later (it can never shrink) means raising this with it, by hand.
    retentionSize: 8GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    # Pick up monitors, rules and scrape configs from every Application, not only from
    # objects carrying this Helm release's label.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

alertmanager:
  # At alertmanager.d3strukt0r.dev behind the Zitadel gate, like Prometheus.
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-oauth2-proxy@kubernetescrd
    hosts:
      - alertmanager.d3strukt0r.dev
    tls:
      - hosts:
          - alertmanager.d3strukt0r.dev
        secretName: alertmanager-tls
  alertmanagerSpec:
    # The chart would derive http:// from the ingress, unlike for Prometheus.
    externalUrl: https://alertmanager.d3strukt0r.dev
    # Mounted under /etc/alertmanager/secrets/alertmanager-ntfy/, from external-secrets.yaml.
    secrets:
      - alertmanager-ntfy
    # The operator's default request is 200Mi; it used about 25 MiB when set (2026-09-28).
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 128Mi
  # Phone notifications through ntfy.sh, one receiver per priority, since Alertmanager's
  # webhook cannot set ntfy's priority header - it goes into the topic URL instead. The
  # always-firing Watchdog goes to Gatus every minute as a heartbeat (its external endpoint
  # alerting_watchdog, kubernetes/components/gatus/config.yaml).
  config:
    route:
      receiver: ntfy-warning
      group_by: [namespace, alertname]
      routes:
        - receiver: watchdog
          matchers: [alertname = "Watchdog"]
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
        - receiver: "null"
          matchers: [alertname = "InfoInhibitor"]
        # Informational alerts (throttling and the like) stay in Grafana, off the phone.
        - receiver: "null"
          matchers: [severity = "info"]
        - receiver: ntfy-critical
          matchers: [severity = "critical"]
    inhibit_rules:
      - source_matchers: [severity = "critical"]
        target_matchers: [severity =~ "warning|info"]
        equal: [namespace, alertname]
      - source_matchers: [severity = "warning"]
        target_matchers: [severity = "info"]
        equal: [namespace, alertname]
      - source_matchers: [alertname = "InfoInhibitor"]
        target_matchers: [severity = "info"]
        equal: [namespace]
      # A volume's higher usage level silences its lower ones (rules.yaml).
      - source_matchers: [alertname = "PersistentVolumeAlmostFull"]
        target_matchers: [alertname =~ "PersistentVolumeUsageCritical|PersistentVolumeUsageHigh"]
        equal: [namespace, persistentvolumeclaim]
      - source_matchers: [alertname = "PersistentVolumeUsageCritical"]
        target_matchers: [alertname = "PersistentVolumeUsageHigh"]
        equal: [namespace, persistentvolumeclaim]
    receivers:
      - name: "null"
      - name: watchdog
        webhook_configs:
          - url: http://gatus.gatus.svc/api/v1/endpoints/alerting_watchdog/external?success=true
            send_resolved: false
            http_config:
              authorization:
                credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy/watchdog-token
      - name: ntfy-critical
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-ntfy/url-critical
            # Keeps a message within ntfy's size limit when many alerts fire together.
            max_alerts: 10
            http_config:
              authorization:
                credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy/token
      - name: ntfy-warning
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-ntfy/url-warning
            max_alerts: 10
            http_config:
              authorization:
                credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy/token

grafana:
  admin:
    existingSecret: grafana-admin
  # Restarted by Reloader when the admin password changes in OpenBao (read as an environment
  # variable at start). The chart puts these annotations on all its Grafana objects; Reloader
  # only acts on the Deployment.
  annotations:
    secret.reloader.stakater.com/reload: grafana-admin
  # At grafana.d3strukt0r.dev (its own record in tofu/cloudflare), certificate from
  # certificates.yaml. No className: Traefik is the cluster's default IngressClass.
  ingress:
    enabled: true
    hosts:
      - grafana.d3strukt0r.dev
    tls:
      - hosts:
          - grafana.d3strukt0r.dev
        secretName: grafana-tls
  grafana.ini:
    server:
      root_url: https://grafana.d3strukt0r.dev
    # Login through Zitadel, a public client (PKCE, no secret) from
    # tofu/zitadel/apps_grafana.tf. Only what differs from Grafana's defaults. The local admin
    # login stays as the break-glass way in.
    auth.generic_oauth:
      enabled: true
      name: Zitadel
      client_id: "393061051085685089"
      use_pkce: true
      # A public client sends its ID in the request body and no secret; the automatic mode
      # would try a Basic header first.
      auth_style: InParams
      scopes: openid profile email
      auth_url: https://auth.d3strukt0r.dev/oauth/v2/authorize
      token_url: https://auth.d3strukt0r.dev/oauth/v2/token
      api_url: https://auth.d3strukt0r.dev/oidc/v1/userinfo
      # The `groups` claim from the groups webhook: infra-admin is Grafana's server admin
      # (which includes Admin of its organisation); everyone else is refused.
      role_attribute_path: contains(groups[*], 'infra-admin') && 'GrafanaAdmin'
      role_attribute_strict: true
      allow_assign_grafana_admin: true
    auth:
      # Ends the Zitadel session too, then back to Grafana's login page.
      signout_redirect_url: https://auth.d3strukt0r.dev/oidc/v1/end_session?client_id=393061051085685089&post_logout_redirect_uri=https://grafana.d3strukt0r.dev/login
  # A test pod Helm would run on install; Argo CD would only ever show it as extra.
  testFramework:
    enabled: false
  # About 300 MiB idle; browsing dashboards took it past 512Mi into OOM kills.
  resources:
    requests:
      memory: 384Mi
    limits:
      memory: 1Gi
  # Logs, next to the chart's own Prometheus and Alertmanager datasources.
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.loki.svc:3100
  # Dashboards for what the chart does not cover - Argo CD, cert-manager, Traefik, Kyverno -
  # downloaded from grafana.com by an init container at every start (Grafana keeps nothing on
  # disk), pinned by revision. Their Prometheus input points at the chart's datasource. The
  # chart's curl flags default to -k, which skips the TLS certificate check; -L follows
  # grafana.com's redirects.
  defaultCurlOptions: "-sLf"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: grafana-com
          folder: Components
          type: file
          options:
            path: /var/lib/grafana/dashboards/grafana-com
  dashboards:
    grafana-com:
      argocd-operational:
        gnetId: 19993
        revision: 9
        datasource: Prometheus
      argocd-applications:
        gnetId: 19974
        revision: 8
        datasource: Prometheus
      cert-manager:
        gnetId: 20842
        revision: 3
        datasource: Prometheus
      traefik:
        gnetId: 17347
        revision: 9
        datasource: Prometheus
      kyverno:
        gnetId: 15987
        revision: 2
        datasource: Prometheus

prometheus-node-exporter:
  # It needs the host's network, PID namespace and filesystem, which only an exempt
  # namespace allows.
  namespaceOverride: kube-system
  # Traefik's metrics already hold 9100 on the nodes' host network.
  service:
    port: 9101
    targetPort: 9101
  # kube-system has no LimitRange, so these are its only resources.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

kube-state-metrics:
  # Metrics from objects that report their state nowhere else. The mariadb-operator's status
  # conditions become kube_customresource_condition{customresource_kind, name, type, status},
  # valued with the condition's lastTransitionTime (alerts in kubernetes/components/mariadb).
  # k3s records every etcd snapshot as an ETCDSnapshotFile; each becomes
  # kube_customresource_etcd_snapshot_created{node, name, bucket}, bucket set only for the copy
  # in S3 (alerts in rules.yaml).
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: k8s.mariadb.com
              version: v1alpha1
              kind: MariaDB
            labelsFromPath: &objectLabels
              namespace: [metadata, namespace]
              name: [metadata, name]
            metrics: &conditionMetrics
              - name: condition
                help: Time of the object's last transition into each status condition.
                each:
                  type: Gauge
                  gauge:
                    path: [status, conditions]
                    labelsFromPath:
                      type: [type]
                      status: [status]
                      reason: [reason]
                    valueFrom: [lastTransitionTime]
          - groupVersionKind:
              group: k8s.mariadb.com
              version: v1alpha1
              kind: PhysicalBackup
            labelsFromPath: *objectLabels
            metrics: *conditionMetrics
          - groupVersionKind:
              group: k3s.cattle.io
              version: v1
              kind: ETCDSnapshotFile
            labelsFromPath:
              name: [metadata, name]
              node: [spec, nodeName]
              bucket: [spec, s3, bucket]
            metrics:
              - name: etcd_snapshot_created
                help: Creation time of an etcd snapshot k3s recorded.
                each:
                  type: Gauge
                  gauge:
                    path: [status, creationTime]
  rbac:
    extraRules:
      - apiGroups: [k8s.mariadb.com]
        resources: [mariadbs, physicalbackups]
        verbs: [list, watch]
      - apiGroups: [k3s.cattle.io]
        resources: [etcdsnapshotfiles]
        verbs: [list, watch]
