---
# ntfy topic and token (OpenBao secret/ntfy) and the token Gatus expects with the Watchdog
# heartbeat (secret/gatus), assembled into the files Alertmanager reads its receivers from. The
# topic is the secret on ntfy.sh's free plan, so the URLs only exist here, never in git.
# 1Password "ntfy | prod alerts"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=htj7nc5vbwet6osr3mfdm3b5yy&h=my.1password.com
# 1Password "Gatus | Prod | Watchdog token"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=zghx22b3o4mpxeglv3wzacdfwq&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ntfy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      data:
        url-critical: "https://ntfy.sh/{{ .topic }}?template=alertmanager&priority=5&tags=rotating_light"
        url-warning: "https://ntfy.sh/{{ .topic }}?template=alertmanager&priority=3&tags=warning"
        token: "{{ .token }}"
        watchdog-token: "{{ .watchdogToken }}"
  data:
    - secretKey: topic
      remoteRef:
        key: ntfy
        property: topic
    - secretKey: token
      remoteRef:
        key: ntfy
        property: token
    - secretKey: watchdogToken
      remoteRef:
        key: gatus
        property: watchdog-token
---
# Grafana's local admin, from OpenBao secret/grafana - the break-glass login, since everyday
# logins go through Zitadel.
# 1Password "Grafana | Prod | Admin"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=25tqaghtajnc3efoop2ve6jfze&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana
        property: admin-password
