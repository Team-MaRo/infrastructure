---
# ntfy topic and token (OpenBao secret/ntfy) and Uptime Kuma's push URL (secret/uptime-kuma),
# assembled into the files Alertmanager reads its receivers from. The topic is the secret on
# ntfy.sh's free plan, so the URLs only exist here, never in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ntfy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      data:
        url-critical: "https://ntfy.sh/{{ .topic }}?template=alertmanager&priority=5&tags=rotating_light"
        url-warning: "https://ntfy.sh/{{ .topic }}?template=alertmanager&priority=3&tags=warning"
        token: "{{ .token }}"
        watchdog-url: "{{ .watchdogUrl }}"
  data:
    - secretKey: topic
      remoteRef:
        key: ntfy
        property: topic
    - secretKey: token
      remoteRef:
        key: ntfy
        property: token
    - secretKey: watchdogUrl
      remoteRef:
        key: uptime-kuma
        property: watchdog-push-url
---
# Grafana's local admin, from OpenBao secret/grafana - the login until Zitadel provides SSO,
# and the break-glass login afterwards.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana
        property: admin-password
