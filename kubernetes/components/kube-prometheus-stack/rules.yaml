---
# Alerts for what this cluster's own machinery can leave broken without anything else
# noticing. The chart's default rules cover the rest.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster
  annotations:
    # The CRD arrives with the chart in the same sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: cluster
      rules:
        # The k3s upgrade Jobs and kured cordon a node and uncordon it when done. One that
        # stays cordoned means a failed upgrade Job or a drain that cannot finish.
        - alert: NodeCordonedTooLong
          expr: kube_node_spec_unschedulable == 1
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.node }} has been cordoned for over 2 hours."
            description: >-
              Check the upgrade Job in system-upgrade and kured's log in kube-system, fix the
              cause, then kubectl uncordon {{ $labels.node }}.

        # Every server uploads a snapshot at 00:00 and 12:00 UTC. The age of each node's newest
        # snapshot in S3 comes from k3s's own records (ETCDSnapshotFile, through kube-state-
        # metrics), not from k3s's upload counter: after a restart the counter reappears only
        # with the next upload, already at 1, which increase() cannot tell from no upload at
        # all (a false alarm after the failover test, 2026-09-29). The second part covers a
        # server with no snapshot in S3, once it has existed for 13 hours. The first part counts
        # only the servers: while k3s prunes old snapshots in S3, it keeps a record with
        # node="s3" for about a minute, which once fired as "s3 has not uploaded" (2026-10-13).
        - alert: EtcdSnapshotUploadMissing
          expr: >-
            (time() - max by (node) (kube_customresource_etcd_snapshot_created{bucket!=""}) > 13 * 3600
              and on (node) kube_node_role{role="etcd"})
            or
            (time() - max by (node) (kube_node_created and on (node) kube_node_role{role="etcd"}) > 13 * 3600
              unless on (node) kube_customresource_etcd_snapshot_created{bucket!=""})
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.node }} has not uploaded an etcd snapshot for 13 hours."
            description: >-
              Check k3s's log on the node (journalctl -u k3s | grep -i snapshot), the Secret
              kube-system/k3s-etcd-snapshot-s3-config and kubectl get etcdsnapshotfiles.
        - alert: EtcdSnapshotUploadFailed
          expr: sum by (instance) (increase(k3s_etcd_snapshot_save_s3_duration_seconds_count{status!="success"}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} failed to upload an etcd snapshot."
            description: >-
              Check k3s's log on the node (journalctl -u k3s | grep -i snapshot) and the
              Secret kube-system/k3s-etcd-snapshot-s3-config.

        # k3s renews its certificates when it starts within 120 days of their expiry. One
        # this close to expiring was not renewed, and an expired one stops the node.
        - alert: K3sCertificateExpiring
          expr: min by (instance, subject) (k3s_certificate_expiration_seconds) < 30 * 86400
          labels:
            severity: critical
          annotations:
            summary: "k3s certificate {{ $labels.subject }} on {{ $labels.instance }} expires in under 30 days."
            description: >-
              Restarting k3s on the node renews it (sudo systemctl restart k3s, one node at a
              time); k3s certificate rotate forces it.

        # Every volume, at three levels; a higher one silences the lower ones (the inhibit
        # rules in values.yaml). A volume can be grown with a bigger PVC request - Hetzner
        # volumes resize online - but never shrunk.
        - alert: PersistentVolumeUsageHigh
          expr: kubelet_volume_stats_used_bytes{job="kubelet"} / kubelet_volume_stats_capacity_bytes{job="kubelet"} > 0.80
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full."
            description: >-
              Over 80 %. Plan to grow it (a bigger storage request on its PVC) or to reduce
              what is kept on it.
        - alert: PersistentVolumeUsageCritical
          expr: kubelet_volume_stats_used_bytes{job="kubelet"} / kubelet_volume_stats_capacity_bytes{job="kubelet"} > 0.90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full."
            description: >-
              Over 90 %. Grow it soon (a bigger storage request on its PVC).
        - alert: PersistentVolumeAlmostFull
          expr: kubelet_volume_stats_used_bytes{job="kubelet"} / kubelet_volume_stats_capacity_bytes{job="kubelet"} > 0.95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full."
            description: >-
              Over 95 %: what writes to it will fail when it is full. Grow it now (a bigger
              storage request on its PVC).

        # A container at its memory limit is killed by the kernel, and every request it was
        # serving fails with it. Working set, as the kubelet counts it for the limit; only
        # containers with a limit. In a week before these alerts, none went above 86 %.
        - alert: ContainerMemoryNearLimit
          expr: >-
            max by (namespace, pod, container) (container_memory_working_set_bytes{container!=""})
            / on (namespace, pod, container)
            max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
            > 0.90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} uses {{ $value | humanizePercentage }} of its memory limit."
            description: >-
              Raise its memory limit, or lower what it may use (php-fpm workers, PHP's
              memory_limit, a cache size) - see the component's README.
        # A single kill only restarts the container, so nothing else would tell: it is no crash
        # loop unless it repeats. Fires for the restart that an OOM kill caused, in the last
        # 10 minutes.
        - alert: ContainerOOMKilled
          expr: >-
            (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1)
            and ignoring (reason)
            min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} was killed for exceeding its memory limit."
            description: >-
              Every request it served at that moment failed. Check its memory in Grafana and its
              log before the kill, then raise the limit or lower what it may use - see the
              component's README.
