---
# Alerts for what this cluster's own machinery can leave broken without anything else
# noticing. The chart's default rules cover the rest.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster
spec:
  groups:
    - name: cluster
      rules:
        # The k3s upgrade Jobs and kured cordon a node and uncordon it when done. One that
        # stays cordoned means a failed upgrade Job or a drain that cannot finish.
        - alert: NodeCordonedTooLong
          expr: kube_node_spec_unschedulable == 1
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.node }} has been cordoned for over 2 hours."
            description: >-
              Check the upgrade Job in system-upgrade and kured's log in kube-system, fix the
              cause, then kubectl uncordon {{ $labels.node }}.
        # kured skips a node that runs the MariaDB primary until mariadb's CronJob has moved the
        # primary away; if that cannot happen (the other MariaDB pod not ready or terminating, its
        # node cordoned or due for a reboot itself - the job's last line says which), the node waits
        # without being cordoned, so NodeCordonedTooLong does not see it. A day covers one missed
        # window plus the next.
        - alert: NodeRebootPending
          expr: max by (node) (kured_reboot_required) == 1
          for: 26h
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.node }} has been waiting for its reboot for over a day."
            description: >-
              Check kured's log on the node ("blocked") and the last line of the job log of
              mariadb-primary-off-rebooting-node in the mariadb namespace, which says why it
              did not switch - see kubernetes/components/kured/README.md.
        # unattended-upgrades installs from stable and stable-security every night at 03:30, so
        # an update from either still pending after two days means it stopped installing.
        # stable-updates is not among its origins and waits for Debian's next point release.
        - alert: NodeUpdatesPending
          expr: >-
            sum by (instance) (apt_upgrades_pending{origin=~"(.*,)?[^,]*/stable(-security)?(,.*)?"}) > 0
          for: 48h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}: {{ $value }} updates have waited over two days."
            description: >-
              unattended-upgrades should have installed them at 03:30. Check journalctl -u
              apt-daily-upgrade.service and /var/log/unattended-upgrades/ on the node
              (ansible/roles/os_updates).
        # The package lists are fetched every night at 03:00; without that, nothing new is seen
        # and NodeUpdatesPending stays silent.
        - alert: NodePackageListsStale
          expr: time() - apt_package_cache_timestamp_seconds > 2 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}: the package lists were last fetched over two days ago."
            description: >-
              Check journalctl -u apt-daily.service on the node; the fetch is moved to 03:00 by
              ansible/roles/os_updates.

        # inotify instances are limited per user, and containerd, k3s and every container
        # running as root share root's (ansible/roles/node_metrics README). At the limit, new
        # containers that watch files fail to start with "too many open files".
        - alert: NodeInotifyInstancesHigh
          expr: >-
            max by (instance, uid) (node_inotify_instances)
              / on (instance) group_left max by (instance) (node_inotify_max_user_instances)
            > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}: user {{ $labels.uid }} holds {{ $value | humanizePercentage }} of the inotify instance limit."
            description: >-
              Find what holds them (the command in ansible/roles/node_metrics/README.md,
              "Running it"); if it is genuine use, raise fs.inotify.max_user_instances in
              k3s_sysctls (ansible/roles/k3s/defaults/main.yml) and run the k3s role.
        # The node_metrics timers rewrite inotify.prom every minute and apt.prom every 15; a file
        # several runs old means its timer stopped, and the alerts on it judge stale numbers.
        - alert: NodeTextfileStale
          expr: >-
            time() - node_textfile_mtime_seconds{file!~".*/apt\\.prom"} > 600
            or
            time() - node_textfile_mtime_seconds{file=~".*/apt\\.prom"} > 2400
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}: {{ $labels.file }} has not been rewritten for several of its timer's runs."
            description: >-
              Check its timer on the node: systemctl status node-metrics-inotify.timer
              (inotify.prom) or prometheus-node-exporter-apt.timer (apt.prom), and journalctl
              -u for the service of the same name (ansible/roles/node_metrics).
        - alert: NodeTextfileScrapeError
          expr: node_textfile_scrape_error == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}: node-exporter cannot read its text files."
            description: >-
              node-exporter's log in kube-system says which file is unreadable or malformed
              (ansible/roles/node_metrics writes them).
        # The chart's NodeSystemdServiceFailed and NodeSystemdServiceCrashlooping go silent when
        # node-exporter cannot reach systemd, so that failure alerts on its own.
        - alert: NodeSystemdCollectorFailed
          expr: node_scrape_collector_success{collector="systemd"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}: node-exporter cannot read systemd's units."
            description: >-
              node-exporter's log in kube-system has the D-Bus error. It talks to the host's
              system bus through DBUS_SYSTEM_BUS_ADDRESS (values.yaml); check that
              /run/dbus/system_bus_socket exists on the node.

        # Every server uploads a snapshot at 00:00 and 12:00 UTC. The age of each node's newest
        # snapshot in S3 comes from k3s's own records (ETCDSnapshotFile, through kube-state-
        # metrics), not from k3s's upload counter: after a restart the counter reappears only
        # with the next upload, already at 1, which increase() cannot tell from no upload at
        # all (a false alarm after the failover test, 2026-09-29). The second part covers a
        # server with no snapshot in S3, once it has existed for 13 hours. The first part counts
        # only the servers: while k3s prunes old snapshots in S3, it keeps a record with
        # node="s3" for about a minute, which once fired as "s3 has not uploaded" (2026-10-13).
        - alert: EtcdSnapshotUploadMissing
          expr: >-
            (time() - max by (node) (kube_customresource_etcd_snapshot_created{bucket!=""}) > 13 * 3600
              and on (node) kube_node_role{role="etcd"})
            or
            (time() - max by (node) (kube_node_created and on (node) kube_node_role{role="etcd"}) > 13 * 3600
              unless on (node) kube_customresource_etcd_snapshot_created{bucket!=""})
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.node }} has not uploaded an etcd snapshot for 13 hours."
            description: >-
              Check k3s's log on the node (journalctl -u k3s | grep -i snapshot), the Secret
              kube-system/k3s-etcd-snapshot-s3-config and kubectl get etcdsnapshotfiles.
        - alert: EtcdSnapshotUploadFailed
          expr: sum by (instance) (increase(k3s_etcd_snapshot_save_s3_duration_seconds_count{status!="success"}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} failed to upload an etcd snapshot."
            description: >-
              Check k3s's log on the node (journalctl -u k3s | grep -i snapshot) and the
              Secret kube-system/k3s-etcd-snapshot-s3-config.

        # k3s renews its certificates when it starts within 120 days of their expiry. One
        # this close to expiring was not renewed, and an expired one stops the node.
        - alert: K3sCertificateExpiring
          expr: min by (instance, subject) (k3s_certificate_expiration_seconds) < 30 * 86400
          labels:
            severity: critical
          annotations:
            summary: "k3s certificate {{ $labels.subject }} on {{ $labels.instance }} expires in under 30 days."
            description: >-
              Restarting k3s on the node renews it (sudo systemctl restart k3s, one node at a
              time); k3s certificate rotate forces it.

        # An operator that hangs in one reconcile applies no more changes and repairs nothing it
        # owns, while everything it already runs looks healthy. Operators built on
        # controller-runtime (and Argo CD) report how long their oldest unfinished item has been
        # running; a normal pass takes seconds - highest outside the incident 17 s (Argo CD),
        # 2026-10-23..11-02. mariadb-operator hung for about 3.3 hours at a time, from 2026-10-29
        # until it was restarted on 2026-11-02. Grouped by the queue's name: Argo CD's queues
        # carry no controller label.
        - alert: ControllerReconcileStuck
          expr: max by (namespace, job, name) (workqueue_longest_running_processor_seconds) > 900
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}: the {{ $labels.name }} queue has been working on one item for {{ $value | humanizeDuration }}."
            description: >-
              The operator is stuck and applies no changes. Check its log, then restart its
              Deployment - see the component's README.

        # Every volume, at three levels; a higher one silences the lower ones (the inhibit
        # rules in values.yaml). A volume can be grown with a bigger PVC request - Hetzner
        # volumes resize online - but never shrunk. Prometheus' own volume is full by design
        # (retentionSize, about 82 % and 92 % while compacting), so only the 95 % level covers
        # it: that one means its cleanup failed.
        - alert: PersistentVolumeUsageHigh
          expr: kubelet_volume_stats_used_bytes{job="kubelet",persistentvolumeclaim!~"prometheus-kube-prometheus-stack-prometheus-db-.*"} / kubelet_volume_stats_capacity_bytes{job="kubelet"} > 0.80
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full."
            description: >-
              Over 80 %. Plan to grow it (a bigger storage request on its PVC) or to reduce
              what is kept on it.
        - alert: PersistentVolumeUsageCritical
          expr: kubelet_volume_stats_used_bytes{job="kubelet",persistentvolumeclaim!~"prometheus-kube-prometheus-stack-prometheus-db-.*"} / kubelet_volume_stats_capacity_bytes{job="kubelet"} > 0.90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full."
            description: >-
              Over 90 %. Grow it soon (a bigger storage request on its PVC).
        - alert: PersistentVolumeAlmostFull
          expr: kubelet_volume_stats_used_bytes{job="kubelet"} / kubelet_volume_stats_capacity_bytes{job="kubelet"} > 0.95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full."
            description: >-
              Over 95 %: what writes to it will fail when it is full. Grow it now (a bigger
              storage request on its PVC).

        # A container is killed when the memory the kernel cannot reclaim reaches its limit, and
        # every request it was serving fails with it. The limit counts all of the cgroup's
        # memory; at the limit the kernel first drops file cache, and without swap it cannot free
        # anonymous memory or shared memory. So: the working set (usage minus inactive file
        # cache) minus the active file cache = anonymous + shared memory + kernel memory.
        # - Not the working set alone: it counts active file cache, which the kernel drops at the
        #   limit - mariadb's primary sat at 91 % from the cache of its writes (2026-10-25),
        #   76 % against 53 % here (2026-11-02), without a kill.
        # - Not RSS (used 2026-10-25..11-02): on cgroup v2 it is anonymous memory only and misses
        #   shared memory - PHP's OPcache (256 MB per php-fpm pool) and Postgres' shared_buffers,
        #   which cannot be reclaimed without swap either (Alloy: RSS 18 %, this 46 %).
        # Only containers with a limit. Two levels under one name: above 80 % a warning (time to
        # raise the limit), above 90 % critical (the kill is near); the inhibit rule in
        # values.yaml silences the warning while the critical one fires. With limits at least
        # twice the request, a container normally sits near 50 %. Highest over
        # 2026-10-23..11-02: 75 % (mariadb's agent, then on the default limit).
        - alert: ContainerMemoryNearLimit
          expr: >-
            max by (namespace, pod, container) (
              container_memory_working_set_bytes{container!=""}
              - container_memory_total_active_file_bytes{container!=""}
            )
            / on (namespace, pod, container)
            max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
            > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} uses {{ $value | humanizePercentage }} of its memory limit."
            description: >-
              Raise its memory limit soon, or lower what it may use (php-fpm workers, PHP's
              memory_limit, a cache size) - see the component's README.
        - alert: ContainerMemoryNearLimit
          expr: >-
            max by (namespace, pod, container) (
              container_memory_working_set_bytes{container!=""}
              - container_memory_total_active_file_bytes{container!=""}
            )
            / on (namespace, pod, container)
            max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
            > 0.90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} uses {{ $value | humanizePercentage }} of its memory limit - an OOM kill is near."
            description: >-
              Raise its memory limit now, or lower what it may use (php-fpm workers, PHP's
              memory_limit, a cache size) - see the component's README.
        # A limit can hurt before it kills: processes wait while the kernel reclaims (or
        # re-reads) cache to stay under it. PSI measures that wait; above 10 % of the time for
        # 10 minutes the container is slowed down by its limit. Highest over 2026-10-23..11-02:
        # 0.25 % (Prometheus). Not memory.events "max": hitting the limit is normal for
        # containers with much file cache (Postgres 2.2 million times in those 10 days, unharmed).
        - alert: ContainerMemoryPressure
          expr: >-
            max by (namespace, pod, container) (
              rate(container_pressure_memory_waiting_seconds_total{container!=""}[5m])
            ) > 0.10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} waits for memory {{ $value | humanizePercentage }} of the time."
            description: >-
              Its memory limit slows it down: the kernel keeps reclaiming its cache. Raise the
              limit or lower what it may use - see the component's README.
        # A single kill only restarts the container, so nothing else would tell: it is no crash
        # loop unless it repeats. Fires for the restart that an OOM kill caused, in the last
        # 10 minutes - of a container or an init container (wp-cli in the WordPress sites'
        # plugins, which would otherwise only leave its pod in Init:CrashLoopBackOff).
        - alert: ContainerOOMKilled
          expr: >-
            (
              (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1)
              and ignoring (reason)
              min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
            )
            or
            (
              (kube_pod_init_container_status_restarts_total - kube_pod_init_container_status_restarts_total offset 10m >= 1)
              and ignoring (reason)
              min_over_time(kube_pod_init_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
            )
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} was killed for exceeding its memory limit."
            description: >-
              Every request it served at that moment failed. Check its memory in Grafana and its
              log before the kill, then raise the limit or lower what it may use - see the
              component's README.
    # The chart's two "failed to send" alerts (defaultRules.disabled in values.yaml), unchanged
    # except that the receiver watchdog is left out. Its webhook goes to Gatus, which stores in
    # PostgreSQL, so every Postgres switchover makes one delivery fail - 1 in ~8 over 15 minutes,
    # far above 1 %, and it paged as critical (2026-11-17). A heartbeat that really stops arriving
    # is Gatus' own alert (its external endpoint Watchdog, components/gatus/config.yaml).
    # receiver_name comes from Alertmanager's feature flag receiver-name-in-metrics.
    - name: alertmanager
      rules:
        - alert: AlertmanagerFailedToSendAlerts
          expr: |-
            (
              rate(alertmanager_notifications_failed_total{job="kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring",receiver_name!="watchdog"}[15m])
            /
              ignoring (reason) group_left rate(alertmanager_notifications_total{job="kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring",receiver_name!="watchdog"}[15m])
            )
            > 0.01
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: An Alertmanager instance failed to send notifications.
            description: >-
              Alertmanager {{ $labels.namespace }}/{{ $labels.pod }} failed to send
              {{ $value | humanizePercentage }} of notifications to {{ $labels.receiver_name }}
              ({{ $labels.integration }}).
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerfailedtosendalerts
        - alert: AlertmanagerClusterFailedToSendAlerts
          expr: |-
            min by (namespace, service, integration, receiver_name) (
              rate(alertmanager_notifications_failed_total{job="kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring",receiver_name!="watchdog"}[15m])
            /
              ignoring (reason) group_left rate(alertmanager_notifications_total{job="kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring",receiver_name!="watchdog"}[15m]) > 0
            )
            > 0.01
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: All Alertmanager instances in a cluster failed to send notifications to a critical integration.
            description: >-
              The minimum notification failure rate to {{ $labels.receiver_name }}
              ({{ $labels.integration }}) is {{ $value | humanizePercentage }}.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerclusterfailedtosendalerts
