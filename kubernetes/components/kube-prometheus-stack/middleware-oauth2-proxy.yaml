---
# The Zitadel login gate in front of the Prometheus and Alertmanager UIs (components/oauth2-proxy):
# Traefik asks oauth2-proxy about each request and passes it on only for a login with the role
# infra-admin. Traefik takes middleware only from the router's own namespace, hence monitoring's
# own copy. Grafana has its own Zitadel login and does not use it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc
    # Client X-Forwarded-* headers are dropped and Traefik sends its own, which oauth2-proxy
    # builds the redirect from. oauth2-proxy answers with a few KB; anything bigger is refused.
    trustForwardHeader: false
    maxResponseBodySize: 1048576  # 1 MiB
