---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
spec:
  # One instance only: it holds a SQLite file on a ReadWriteOnce volume.
  replicas: 1
  # The volume can only be attached to one node at a time, so an update stops the old pod
  # before starting the new one. A rolling update would wait forever on the attachment.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
    spec:
      # Kubernetes would otherwise inject UPTIME_KUMA_PORT=tcp://... for the Service of the
      # same name, which Uptime Kuma reads as the port to listen on.
      enableServiceLinks: false
      securityContext:
        # The rootless image's user, "node". Numeric because the image names it, and
        # runAsNonRoot can only be checked against a number.
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        # A fresh volume belongs to root; this hands it to the group on first mount.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uptime-kuma
          # Pinned; bumping the tag is the upgrade. slim leaves out the embedded MariaDB and
          # Chromium, neither of which is used here.
          image: docker.io/louislam/uptime-kuma:2.5.5-slim-rootless
          env:
            # Skips the first-start database wizard: SQLite, in /app/data.
            - name: UPTIME_KUMA_DB_TYPE
              value: sqlite
          ports:
            - name: http
              containerPort: 3001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Only memory differs from the namespace's LimitRange defaults: it uses about 130-150
          # MiB, and 2.x has had memory leaks, which 128Mi would turn into restarts.
          resources:
            requests:
              memory: 160Mi
            limits:
              memory: 512Mi
          # The image's own health check, a small binary that queries the local server.
          # Startup covers the database migrations of a first start or an upgrade.
          startupProbe:
            exec:
              command: ["extra/healthcheck"]
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["extra/healthcheck"]
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma
        - name: tmp
          emptyDir: {}
