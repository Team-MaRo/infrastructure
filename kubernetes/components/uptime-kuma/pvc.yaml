---
# SQLite database, uploads and screenshots. A Hetzner volume is a block device with ext4 on
# it, which SQLite is fine with - its warning is about network filesystems like NFS. 10 GB is
# Hetzner's minimum and far more than a few dozen monitors need.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
