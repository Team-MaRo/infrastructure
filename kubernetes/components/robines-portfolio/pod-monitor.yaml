---
# php-fpm's pool figures - busy and idle workers, queued requests, slow requests - served by nginx
# on the port metrics (config/default.conf). The job is robines-portfolio/php-fpm; alerts and the
# dashboard are kube-prometheus-stack's (php-fpm.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: php-fpm
  annotations:
    # The CRD comes with kube-prometheus-stack, another Application.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  podMetricsEndpoints:
    - port: metrics
