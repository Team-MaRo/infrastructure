; Uploads as large as prod-old allowed (its note: Cloudflare's upload limit is 100 MB).
upload_max_filesize = 100M
post_max_size = 100M

; PHP's default 128M is tight for WordPress's admin with this many plugins; 256M is what WordPress
; allows its admin pages anyway (WP_MAX_MEMORY_LIMIT) and fits the php-fpm container's 384Mi.
memory_limit = 256M

; WordPress cannot pass a CA to MySQL itself (wpdb only hands MYSQL_CLIENT_FLAGS to
; mysqli_real_connect), so PHP verifies MariaDB's certificate - with
; MYSQLI_CLIENT_SSL_VERIFY_SERVER_CERT among those flags (deployment.yaml) - against its default
; CA file: the image's public CAs plus the shared MariaDB's CA, written by the init container
; `core`. Every other outbound TLS (S3, wordpress.org, the plugins) keeps the public CAs.
openssl.cafile = /tls/ca-bundle.crt
