---
# The old WordPress site at old.robines.space (its record is in tofu/cloudflare); public, as on
# prod-old. No className: Traefik is the cluster's default IngressClass.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  tls:
    - hosts:
        - old.robines.space
      secretName: web-tls
  rules:
    - host: old.robines.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
