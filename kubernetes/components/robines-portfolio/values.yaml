---
# robines-portfolio, the old WordPress portfolio at old.robines.space (robines.space itself is a
# Cloudflare Worker), from the chart kubernetes/charts/wordpress (README). Only what differs from
# the chart's defaults.
#
# The OpenBao values the chart reads (secret/robines-portfolio, …), and their 1Password items:
# 1Password "Robines Portfolio CMS | Prod | App" (keys and salts, prod-old's)
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=fkyq7sgplhkvasmf3aiwh2acge&h=my.1password.com
# 1Password "MariaDB | Prod | robines-portfolio"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=swneckmu7nc3tkxv5c2njudv2q&h=my.1password.com
# 1Password "Hetzner | S3 | prod robines-portfolio"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=j3phtimnb5zbwonzf655meqrb4&h=my.1password.com
# 1Password "Hetzner | S3 | prod robines-portfolio uploads-proxy"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=3icb7ypn2ub7bk7x2yzbwhkrfm&h=my.1password.com
# 1Password "Mailomat | Prod | robines-portfolio" (the website's SMTP login at mailomat)
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=u747dsojova7eol3x2ikl3qxm4&h=my.1password.com
# 1Password "Valkey | Prod | robines-portfolio" (its user in valkey-cache)
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=27cbbdterppy35hbjvjoivmmn4&h=my.1password.com
#
# The pool keeps the chart's defaults (2026-10-18): (512 MiB limit - ~140 opcache and master - ~100
# headroom) / ~30 MB per worker (php-fpm's memory peak 22.5 MB) = 9, so the image's five fit; they
# have never all been busy. The limit leaves room for one request up to memory_limit's 256M beside
# the idle workers: ~140 + 3 x 30 + 266 = ~500 MiB.

hosts:
  - old.robines.space

# Everything prod-old had, active or not, except the premium theme mintraro-pro (inactive, not on
# wordpress.org).
plugins:
  - akismet
  - all-in-one-seo-pack
  - better-youtube-embed-block
  - block-for-mailchimp
  - cloudflare
  - duplicator
  - embedpress
  - font-awesome
  - galleryberg-gallery-block
  - google-analytics-for-wordpress
  - greenshift-animation-and-page-builder-blocks
  - jetpack
  - jetpack-boost
  - jetpack-protect
  - phpinfo-wp
  - svg-block
  - use-any-font
  - userfeedback-lite
  - wordpress-seo
  - wp-mail-smtp
  - wpconsent-cookies-banner-privacy-suite
  - wpforms-lite
themes:
  - mintraro
  - blogarise

languages:
  - de_CH

# Database 1 in valkey-cache (components/valkey-cache).
objectCache:
  database: 1

nginx:
  # Permissive like prod-old's, with the frames the site embeds (YouTube, Twitter).
  contentSecurityPolicy: "default-src * data: 'unsafe-eval' 'unsafe-inline'; frame-src blob: 'self' https://platform.twitter.com https://www.youtube.com/ https://www.youtube-nocookie.com/; worker-src blob:"
