---
# robines-portfolio, the old WordPress portfolio at old.robines.space (robines.space itself is a
# Cloudflare Worker), from the chart kubernetes/charts/wordpress (README). Only what differs from
# the chart's defaults.
#
# The pool keeps the chart's defaults (2026-10-18): (512 MiB limit - ~140 opcache and master - ~100
# headroom) / ~30 MB per worker (php-fpm's memory peak 22.5 MB) = 9, so the image's five fit; they
# have never all been busy. The limit leaves room for one request up to memory_limit's 256M beside
# the idle workers: ~140 + 3 x 30 + 266 = ~500 MiB.

hosts:
  - old.robines.space

# What the site uses; what prod-old had beyond that was removed 2026-10-22 (README "Plugins").
plugins:
  - better-youtube-embed-block
  - embedpress
  - galleryberg-gallery-block
  - jetpack
  - jetpack-boost
  - jetpack-protect
  - svg-block
  - wordpress-seo
  - wp-mail-smtp
  - wpforms-lite
  # The consent banner and the API Matomo's tracking reads it through (the chart's README "Web
  # analytics").
  - wpconsent-cookies-banner-privacy-suite
  - wp-consent-api
  # Connect Matomo: Matomo's reports in wp-admin, read with the view-only user
  # robines-portfolio-reports. Its own tracking stays off - the chart's mu-plugin counts (README
  # "Counted in Matomo").
  - wp-piwik
themes:
  - mintraro
  - blogarise

languages:
  - de_CH

# The site is site 2 in Matomo (components/matomo), which replaces Google Analytics (README
# "Counted in Matomo").
matomo:
  siteId: 2

# Database 1 in valkey-cache (components/valkey-cache).
objectCache:
  database: 1

# Varnish in front (chart README "Page cache"), the chart's size.
pageCache:
  enabled: true

# Login through Zitadel: the app robines-portfolio in the project of the same name
# (tofu/zitadel, project_robines_portfolio.tf); its secret below (OIDC_CLIENT_SECRET).
oidc:
  clientId: "395937536142279242"

# Content through Claude (chart README): the user's wife edits the site by chatting with Claude;
# the client ID of the app robines-portfolio-claude in tofu/zitadel.
mcp:
  clientId: "396201383902118276"

nginx:
  # Permissive like prod-old's, with the frames the site embeds (YouTube, Twitter).
  contentSecurityPolicy: "default-src * data: 'unsafe-eval' 'unsafe-inline'; frame-src blob: 'self' https://platform.twitter.com https://www.youtube.com/ https://www.youtube-nocookie.com/; worker-src blob:"

# Every secret the site reads: per entry in the secret store (key), which of its fields become
# which environment variable (env), with the 1Password item the entry comes from. They reach the
# WordPress containers through the Secret web (charts/wordpress, README "Secrets").
secrets:
  # 1Password "MariaDB | Prod | robines-portfolio"
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=swneckmu7nc3tkxv5c2njudv2q&h=my.1password.com
  - key: mariadb-apps/robines-portfolio
    env:
      WORDPRESS_DB_PASSWORD: password
  # 1Password "Robines Portfolio CMS | Prod | App" (keys and salts, prod-old's)
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=fkyq7sgplhkvasmf3aiwh2acge&h=my.1password.com
  - key: robines-portfolio
    env:
      WORDPRESS_AUTH_KEY: auth-key
      WORDPRESS_SECURE_AUTH_KEY: secure-auth-key
      WORDPRESS_LOGGED_IN_KEY: logged-in-key
      WORDPRESS_NONCE_KEY: nonce-key
      WORDPRESS_AUTH_SALT: auth-salt
      WORDPRESS_SECURE_AUTH_SALT: secure-auth-salt
      WORDPRESS_LOGGED_IN_SALT: logged-in-salt
      WORDPRESS_NONCE_SALT: nonce-salt
  # 1Password "Hetzner | S3 | prod robines-portfolio" (writes the uploads)
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=j3phtimnb5zbwonzf655meqrb4&h=my.1password.com
  - key: robines-portfolio-s3
    env:
      S3_KEY: access-key
      S3_SECRET: secret-key
  # 1Password "Mailomat | Prod | robines-portfolio" (the website's SMTP login at mailomat)
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=u747dsojova7eol3x2ikl3qxm4&h=my.1password.com
  - key: robines-portfolio-mailomat
    env:
      SMTP_USERNAME: username
      SMTP_PASSWORD: password
  # 1Password "Valkey | Prod | robines-portfolio" (its user in valkey-cache)
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=27cbbdterppy35hbjvjoivmmn4&h=my.1password.com
  - key: valkey-apps/robines-portfolio
    env:
      VALKEY_PASSWORD: password
  # 1Password "Zitadel | Prod | robines-portfolio" (the app's client secret)
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=p5zrexzctw27dvxg2y7e4czvla&h=my.1password.com
  - key: robines-portfolio-oidc
    env:
      OIDC_CLIENT_SECRET: client-secret

uploadsProxy:
  # The uploads proxy's read-only key (Secret uploads-proxy).
  secrets:
    # 1Password "Hetzner | S3 | prod robines-portfolio uploads-proxy"
    #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=3icb7ypn2ub7bk7x2yzbwhkrfm&h=my.1password.com
    - key: robines-portfolio-uploads-proxy-s3
      env:
        AWS_ACCESS_KEY_ID: access-key
        AWS_SECRET_ACCESS_KEY: secret-key
