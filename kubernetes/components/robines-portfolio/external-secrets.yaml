---
# WordPress's secrets as environment variables: the database password, the keys and salts that sign
# its cookies (prod-old's, so logins survive the move) and the key it writes uploads with.
# 1Password "Robines Portfolio CMS | Prod | App"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=fkyq7sgplhkvasmf3aiwh2acge&h=my.1password.com
# 1Password "MariaDB | Prod | robines-portfolio"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=swneckmu7nc3tkxv5c2njudv2q&h=my.1password.com
# 1Password "Hetzner | S3 | prod robines-portfolio"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=j3phtimnb5zbwonzf655meqrb4&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: WORDPRESS_DB_PASSWORD
      remoteRef:
        key: mariadb-apps/robines-portfolio
        property: password
    - secretKey: WORDPRESS_AUTH_KEY
      remoteRef:
        key: robines-portfolio
        property: auth-key
    - secretKey: WORDPRESS_SECURE_AUTH_KEY
      remoteRef:
        key: robines-portfolio
        property: secure-auth-key
    - secretKey: WORDPRESS_LOGGED_IN_KEY
      remoteRef:
        key: robines-portfolio
        property: logged-in-key
    - secretKey: WORDPRESS_NONCE_KEY
      remoteRef:
        key: robines-portfolio
        property: nonce-key
    - secretKey: WORDPRESS_AUTH_SALT
      remoteRef:
        key: robines-portfolio
        property: auth-salt
    - secretKey: WORDPRESS_SECURE_AUTH_SALT
      remoteRef:
        key: robines-portfolio
        property: secure-auth-salt
    - secretKey: WORDPRESS_LOGGED_IN_SALT
      remoteRef:
        key: robines-portfolio
        property: logged-in-salt
    - secretKey: WORDPRESS_NONCE_SALT
      remoteRef:
        key: robines-portfolio
        property: nonce-salt
    - secretKey: S3_KEY
      remoteRef:
        key: robines-portfolio-s3
        property: access-key
    - secretKey: S3_SECRET
      remoteRef:
        key: robines-portfolio-s3
        property: secret-key
---
# The uploads proxy's read-only key: the bucket policy lets it read, never write or delete.
# 1Password "Hetzner | S3 | prod robines-portfolio uploads-proxy"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=3icb7ypn2ub7bk7x2yzbwhkrfm&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uploads-proxy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: robines-portfolio-uploads-proxy-s3
        property: access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: robines-portfolio-uploads-proxy-s3
        property: secret-key
