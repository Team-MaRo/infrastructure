---
# wundexpertinplus, the old WordPress site of Wund Expertin Plus at old.wundexpertinplus.com
# (wundexpertinplus.com itself is a Cloudflare Worker), from the chart kubernetes/charts/wordpress
# (README). Only what differs from the chart's defaults. Brought back as it ran on prod-old until
# 2026-05-19; the clean-up follows (README "Next").

hosts:
  - old.wundexpertinplus.com

# What the site uses; prod-old's others were removed 2026-11-23 (README "Plugins").
plugins:
  - jetpack
  - jetpack-boost
  - jetpack-protect
  - polylang
  - wordpress-seo
  - wp-mail-smtp
  - wpforms-lite
  # The consent banner and the API Matomo's tracking reads it through (the chart's README "Web
  # analytics").
  - wpconsent-cookies-banner-privacy-suite
  - wp-consent-api
  # Connect Matomo: Matomo's reports in wp-admin, read with the view-only user
  # wundexpertinplus-reports. Its own tracking stays off - the chart's mu-plugin counts (README
  # "Counted in Matomo").
  - wp-piwik
themes:
  - customify

languages:
  - de_CH

# The site is site 4 in Matomo (components/matomo), the one Google Analytics' history went into
# (README "Counted in Matomo").
matomo:
  siteId: 4

# Its mail's events in mailomat-watch (token: api-token in secret/wundexpertinplus-mailomat).
mailomatWatch:
  domain: mailomat.wundexpertinplus.com

# Varnish in front (chart README "Page cache") stays off, like on the other sites.
pageCache:
  enabled: false

# Login through Zitadel: the app wundexpertinplus in the project "Wund Expertin Plus"
# (tofu/zitadel, project_wundexpertinplus.tf); its secret below (OIDC_CLIENT_SECRET).
oidc:
  clientId: "400903700693975791"

# Content through Claude (chart README); the client ID of the app wundexpertinplus-claude in
# tofu/zitadel.
mcp:
  clientId: "400934183486161647"

# Every secret the site reads: per entry in the secret store (key), which of its fields become
# which environment variable (env), with the 1Password item the entry comes from. They reach the
# WordPress containers through the Secret web (charts/wordpress, README "Secrets").
secrets:
  # 1Password "MariaDB | Prod | wundexpertinplus"
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=iuehqp5c4rhsnawqp5zhvjwgty&h=my.1password.com
  - key: mariadb-apps/wundexpertinplus
    env:
      WORDPRESS_DB_PASSWORD: password
  # 1Password "Wund Expertin Plus CMS | Prod | App" (keys and salts, prod-old's)
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=6uuspv364f2hs7apwlmevbcujy&h=my.1password.com
  - key: wundexpertinplus
    env:
      WORDPRESS_AUTH_KEY: auth-key
      WORDPRESS_SECURE_AUTH_KEY: secure-auth-key
      WORDPRESS_LOGGED_IN_KEY: logged-in-key
      WORDPRESS_NONCE_KEY: nonce-key
      WORDPRESS_AUTH_SALT: auth-salt
      WORDPRESS_SECURE_AUTH_SALT: secure-auth-salt
      WORDPRESS_LOGGED_IN_SALT: logged-in-salt
      WORDPRESS_NONCE_SALT: nonce-salt
  # 1Password "Hetzner | S3 | prod wundexpertinplus" (writes the uploads)
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=zyx2nlhgljreoo2fsjin3asxde&h=my.1password.com
  - key: wundexpertinplus-s3
    env:
      S3_KEY: access-key
      S3_SECRET: secret-key
  # 1Password "Mailomat | Prod | wundexpertinplus" (the website's SMTP login at mailomat)
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=2nr3n556yfo6aejcrmfqdzgaom&h=my.1password.com
  - key: wundexpertinplus-mailomat
    env:
      SMTP_USERNAME: username
      SMTP_PASSWORD: password
  # 1Password "Zitadel | Prod | wundexpertinplus" (the app's client secret)
  #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=2kjoqiwcmo6dtdyuseajil6ymm&h=my.1password.com
  - key: wundexpertinplus-oidc
    env:
      OIDC_CLIENT_SECRET: client-secret

uploadsProxy:
  # The uploads proxy's read-only key (Secret uploads-proxy).
  secrets:
    # 1Password "Hetzner | S3 | prod wundexpertinplus uploads-proxy"
    #   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=efxryvkeefiviz5rcpdtufguye&h=my.1password.com
    - key: wundexpertinplus-uploads-proxy-s3
      env:
        AWS_ACCESS_KEY_ID: access-key
        AWS_SECRET_ACCESS_KEY: secret-key
