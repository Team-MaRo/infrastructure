---
# The instances' metrics (port 9187: PostgreSQL's own statistics and the Barman Cloud plugin's
# backup state). Created here because the Cluster's enablePodMonitor is deprecated.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
  podMetricsEndpoints:
    - port: metrics
