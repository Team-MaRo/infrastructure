---
# The S3 key backups and WAL are written with (OpenBao secret/postgres-backups-s3); the bucket's
# policy admits only this key and the admin's.
# 1Password "Hetzner | S3 | prod postgres backups"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=xwoxypf5ibmqtcfl7gwjuxx4re&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backups-s3
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: access-key-id
      remoteRef:
        key: postgres-backups-s3
        property: access-key
    - secretKey: secret-access-key
      remoteRef:
        key: postgres-backups-s3
        property: secret-key
