---
# The chart reads its credentials from this Secret. The client ID is not secret and comes from
# tofu/zitadel (output oauth2_proxy_client_id); the client secret - regenerated in the console
# after tofu created the app - and the cookie secret, which encrypts the login cookie, are in
# OpenBao secret/oauth2-proxy (1Password "Zitadel | Prod | oauth2-proxy").
# 1Password "Zitadel | Prod | oauth2-proxy"
#   https://start.1password.com/open/i?a=RWQYBTIV4BG3RD74KLKHPJVTXU&v=rgb7ahgkjpry4bld5uyx5ya5au&i=7ckbf72eceri3t2s3cy7c5du2y&h=my.1password.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      data:
        client-id: "393064233706717537"
        client-secret: "{{ .clientSecret }}"
        cookie-secret: "{{ .cookieSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: oauth2-proxy
        property: client-secret
    - secretKey: cookieSecret
      remoteRef:
        key: oauth2-proxy
        property: cookie-secret
