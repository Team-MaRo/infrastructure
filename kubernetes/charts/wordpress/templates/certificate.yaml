---
# The site's certificate for Traefik, for all its names. The ClusterIssuer picks the DNS-01 solver
# by zone (components/cert-manager).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-tls
spec:
  secretName: web-tls
  dnsNames:
    {{- range sortAlpha .Values.hosts }}
    - {{ . }}
    {{- end }}
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
