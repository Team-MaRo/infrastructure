---
# WordPress from the stock images, without a build: the init containers assemble the site into an
# emptyDir at every start (core from the image, plugins and themes from wordpress.org per the
# values), php-fpm runs it, nginx serves it, and the uploads proxy serves the uploads from the
# private bucket. Nothing on the pod's disk needs to survive a restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  annotations:
    # A new image under the same tag rolls it out (components/keel).
    keel.sh/policy: force
    keel.sh/matchTag: "true"
    keel.sh/trigger: poll
    {{- if .Values.reloader }}
    # Read as environment variables at start (components/reloader).
    secret.reloader.stakater.com/reload: web,uploads-proxy
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
      annotations:
        # A changed configuration file rolls the pod (configmap.yaml).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # The preStop pause (10 s) plus php-fpm finishing running requests (up to 20 s,
      # files/php-fpm.conf), with room to spare over the default 30 s.
      terminationGracePeriodSeconds: 40
      securityContext:
        # www-data in the Debian WordPress image. The Alpine cli image's www-data is 82, so it
        # runs as 33 too; the nginx images keep their own user (101), with 33 as their group.
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The CA bundle PHP verifies MariaDB against (files/php.ini), then WordPress core and
        # wp-config.php into the empty html volume - the image's own entrypoint, which exits after
        # installing when called as docker-ensure-installed.sh.
        - name: core
          image: wordpress:7-php8.5-fpm
          imagePullPolicy: Always
          # Not under /var/www/html: the image declares that a VOLUME, so the runtime would put an
          # empty volume of its own there and the copy would never reach the pod's.
          workingDir: /wordpress
          command:
            - sh
            - -ec
            - |
              cat /etc/ssl/certs/ca-certificates.crt /etc/mariadb-ca/ca.crt > /tls/ca-bundle.crt
              # The image's tar sets the permissions of the directory it copies into, which
              # only the owner may: into the root-owned volume it copies every file and then
              # exits 2. So 33 creates html itself; the other containers mount it (subPath).
              mkdir -p html
              cd html
              exec docker-ensure-installed.sh true
          env:
            {{- include "wordpress.env" . | nindent 12 }}
          envFrom: &wordpress-secrets
            - secretRef:
                name: web
          securityContext: &restricted
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: html
              mountPath: /wordpress
            - name: tls
              mountPath: /tls
            - name: mariadb-ca
              mountPath: /etc/mariadb-ca
              readOnly: true
        # Plugins, themes and S3-Uploads, then - once the database holds the site - a database
        # update if a new WordPress needs one and the language packs (values languages), which
        # WordPress cannot fetch itself (DISALLOW_FILE_MODS). A failed language pack only leaves
        # English text, so it does not stop the start.
        - name: plugins
          image: wordpress:cli-2-php8.5
          imagePullPolicy: Always
          command:
            - sh
            - -ec
            - |
              cd /var/www/html/wp-content
              fetch() {
                curl -fsSL --retry 3 -o /tmp/download.zip "$1"
                unzip -qo /tmp/download.zip -d "$2"
                rm /tmp/download.zip
              }
              # The image brings Akismet and Hello Dolly into every site; a site that wants Akismet
              # lists it in its values, and the loop puts it back.
              rm -rf plugins/akismet plugins/hello.php
              grep -v '^#' /config/plugins.txt | while read -r kind slug version; do
                [ -n "$kind" ] || continue
                # Without a version, downloads.wordpress.org serves the development version (trunk),
                # not the release - Jetpack and Yoast ran pre-releases that way (2026-10-22). The API
                # names the release. A plugin wordpress.org closed has none (404); it keeps running
                # from trunk with a warning rather than keeping the site from starting. Any other
                # failure of the API stops the start, or an outage would put every site on trunk.
                if [ -z "$version" ]; then
                  code=$(curl -sSL --retry 3 -o /tmp/info.json -w '%{http_code}' "https://api.wordpress.org/${kind}s/info/1.2/?action=${kind}_information&request%5Bslug%5D=$slug")
                  if [ "$code" = 200 ]; then
                    version=$(php -r '$i = json_decode(file_get_contents("/tmp/info.json")); if (empty($i->version)) exit(1); echo $i->version;') \
                      || { echo "wordpress.org names no version for $kind $slug"; exit 1; }
                  elif [ "$code" = 404 ]; then
                    echo "WARNING: $kind $slug has no release on wordpress.org (closed?) - installing its development version; replace or remove it"
                  else
                    echo "wordpress.org's API answered $code for $kind $slug"; exit 1
                  fi
                fi
                fetch "https://downloads.wordpress.org/$kind/$slug${version:+.$version}.zip" "${kind}s"
              done
              # Not on wordpress.org; the release zip has its files at the root.
              mkdir -p plugins/s3-uploads mu-plugins
              fetch https://github.com/humanmade/S3-Uploads/releases/download/3.0.10/manual-install.zip plugins/s3-uploads
              cp /config/s3-uploads-hetzner.php mu-plugins/
              # The daily vulnerability check and, in a directory of its own so WordPress does not
              # load it, the script nginx's metrics port runs to report it (README "Vulnerability
              # check").
              cp /config/vulnerability-check.php mu-plugins/
              mkdir -p mu-plugins/vulnerability-check
              cp /config/vulnerability-metrics.php mu-plugins/vulnerability-check/metrics.php
              {{- if .Values.oidc.clientId }}
              cp /config/oidc.php mu-plugins/
              # Its translations, one per language, in a directory of their own: every .php
              # directly in mu-plugins/ would run as a plugin.
              mkdir -p mu-plugins/zitadel-login-languages
              cp /config/zitadel-login-*.l10n.php mu-plugins/zitadel-login-languages/
              {{- end }}
              {{- if .Values.mcp.clientId }}
              cp /config/mcp.php mu-plugins/
              {{- end }}
              {{- if .Values.pageCache.enabled }}
              cp /config/page-cache.php mu-plugins/
              {{- end }}
              {{- if .Values.matomo.siteId }}
              cp /config/matomo.php mu-plugins/
              {{- end }}
              {{- if .Values.objectCache.database }}
              # Redis Object Cache's drop-in, which its admin button would install - hidden under
              # DISALLOW_FILE_MODS. It works without the plugin activated.
              cp plugins/redis-cache/includes/object-cache.php .
              {{- end }}
              if wp core is-installed; then
                wp core update-db
                # Activated whatever wp-admin says, at every start: the login through Zitadel must
                # not depend on a click there, and Redis Object Cache deletes its drop-in when
                # deactivated - whoever deactivated it, the next start puts both back. S3-Uploads
                # runs as a must-use plugin anyway (s3-uploads-hetzner.php); active, the plugin
                # list shows it as used too - WordPress loads it with include_once, so not twice.
                wp plugin activate s3-uploads
                {{- if .Values.oidc.clientId }}
                wp plugin activate daggerhart-openid-connect-generic
                {{- end }}
                {{- if .Values.objectCache.database }}
                wp plugin activate redis-cache
                {{- end }}
                {{- if .Values.mcp.clientId }}
                wp plugin activate mcp-adapter enable-abilities-for-mcp
                {{- end }}
                {{- if .Values.pageCache.enabled }}
                wp plugin activate varnish-http-purge
                {{- end }}
                {{- with .Values.languages }}
                for l in {{ join " " . }}; do
                  wp language core install "$l" || echo "warning: $l for core not installed"
                  wp language plugin install --all "$l" || echo "warning: $l for plugins not installed"
                  wp language theme install --all "$l" || echo "warning: $l for themes not installed"
                done
                {{- end }}
              fi
          env:
            {{- with .Values.wpCli.memoryLimit }}
            # Only this short-lived container gets more memory for wp-cli (values
            # wpCli.memoryLimit).
            - name: WP_CLI_PHP_ARGS
              value: -d memory_limit={{ . }}
            {{- end }}
            {{- include "wordpress.env" . | nindent 12 }}
          envFrom: *wordpress-secrets
          securityContext: *restricted
          # Without a request it defaults to the limit: a pod counts as requesting its largest
          # init container's request for its whole life, so set one when the limit is large.
          resources:
            {{- toYaml .Values.wpCli.resources | nindent 12 }}
          volumeMounts:
            - name: html
              mountPath: /var/www/html
              subPath: html
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: config
              mountPath: /usr/local/etc/php/conf.d/zz-{{ .Release.Name }}.ini
              subPath: php.ini
              readOnly: true
      containers:
        - name: php-fpm
          image: wordpress:7-php8.5-fpm
          imagePullPolicy: Always
          # All containers get the stop signal at once, while Traefik still sends requests to the
          # pod for a moment; each keeps serving 10 s more, so the pod leaves the endpoints first.
          lifecycle: &drain
            preStop:
              sleep:
                seconds: 10
          env:
            {{- include "wordpress.env" . | nindent 12 }}
          envFrom: *wordpress-secrets
          securityContext: *restricted
          # Sized with the pool (values phpFpm, README "Sizing the pool").
          resources:
            {{- toYaml .Values.phpFpm.resources | nindent 12 }}
          volumeMounts:
            - name: html
              mountPath: /var/www/html
              subPath: html
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: config
              mountPath: /usr/local/etc/php/conf.d/zz-{{ .Release.Name }}.ini
              subPath: php.ini
              readOnly: true
            - name: config
              mountPath: /usr/local/etc/php-fpm.d/zz-{{ .Release.Name }}.conf
              subPath: php-fpm.conf
              readOnly: true
        {{- if .Values.pageCache.enabled }}
        # The page cache in front of nginx (files/default.vcl, README "Page cache"); the Service
        # sends every request here, it passes what is not for the cache to nginx on localhost.
        - name: varnish
          image: varnish:9.1
          imagePullPolicy: Always
          lifecycle: *drain
          # The image's entrypoint builds varnishd's command line from these and adds the args.
          env:
            # Varnish's usual port; 8080 is the uploads proxy's in this pod.
            - name: VARNISH_HTTP_PORT
              value: "6081"
            - name: VARNISH_SIZE
              value: {{ .Values.pageCache.size }}
          # Passed responses (everything not cached) flow through Transient memory, limited so a burst
          # cannot take the container's; transit_buffer lets Varnish read only 1M ahead of the
          # visitor instead of holding a whole file - without it a 200 MB download broke off at 33 MB
          # once Transient was full (tested 2026-10-22). Fewer idle threads than the default 100.
          args: ["-s", "Transient=malloc,64M", "-p", "transit_buffer=1M", "-p", "thread_pool_min=20"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: cache
              containerPort: 6081
          readinessProbe:
            tcpSocket:
              port: cache
          livenessProbe:
            tcpSocket:
              port: cache
          resources:
            {{- toYaml .Values.pageCache.resources | nindent 12 }}
          volumeMounts:
            # Its working directory: the compiled VCL (executed from here) and its statistics.
            - name: varnish
              mountPath: /var/lib/varnish
            - name: config
              mountPath: /etc/varnish/default.vcl
              subPath: default.vcl
              readOnly: true
        {{- end }}
        - name: nginx
          # Without docker.io/: Keel writes the short form back (components/keel).
          image: nginxinc/nginx-unprivileged:stable
          imagePullPolicy: Always
          lifecycle: *drain
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8081
            # php-fpm's pool figures (files/default.conf, pod-monitor.yaml).
            - name: metrics
              containerPort: 9253
          # robots.txt is answered by WordPress, so this exercises nginx, php-fpm and the database.
          # PHP sometimes takes over a second under load, and three slow answers in a row at the 1 s
          # default take the pod out of its Service (2026-10-05: a site failed it 60 times in a day
          # and left a wp-cron run without an endpoint), so the probes wait 10 s and run rarely;
          # each one is a full WordPress request.
          startupProbe:
            httpGet: &robots
              path: /robots.txt
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "wordpress.host" . }}
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet: *robots
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Liveness asks nginx alone, at the defaults: restarting nginx cannot help a slow PHP, and
          # through WordPress it turned a slow shop into a dead one (nginx restarted 19 times in 2.5
          # hours, 2026-10-11).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: html
              mountPath: /var/www/html
              subPath: html
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
        # Signs nginx's requests for /wp-content/uploads/ with the read-only key and streams the
        # files from the private bucket (nginx/nginx-s3-gateway). GET and HEAD only.
        - name: uploads-proxy
          image: ghcr.io/nginxinc/nginx-s3-gateway/nginx-oss-s3-gateway:unprivileged-oss
          imagePullPolicy: Always
          lifecycle: *drain
          envFrom:
            - secretRef:
                name: uploads-proxy
          env:
            - name: S3_BUCKET_NAME
              value: {{ include "wordpress.bucket" . }}
            - name: S3_SERVER
              value: nbg1.your-objectstorage.com
            - name: S3_SERVER_PORT
              value: "443"
            - name: S3_SERVER_PROTO
              value: https
            - name: S3_REGION
              value: nbg1
            # Not `path`: the gateway then signs `Host: <server>:443`, and Hetzner rejects that
            # signature (SignatureDoesNotMatch, tested 2026-10-03). Virtual-host style sends the
            # bucket's own host name without a port.
            - name: S3_STYLE
              value: virtual
            - name: AWS_SIGS_VERSION
              value: "4"
            - name: ALLOW_DIRECTORY_LIST
              value: "false"
            # The default (10g) would outgrow the pod's ephemeral storage and get it evicted.
            - name: PROXY_CACHE_MAX_SIZE
              value: 256m
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: proxy-cache
              mountPath: /var/cache/nginx/s3_proxy
      volumes:
        - name: html
          emptyDir:
            sizeLimit: 1Gi
        - name: tls
          emptyDir:
            sizeLimit: 1Mi
        - name: proxy-cache
          emptyDir:
            sizeLimit: 300Mi
        - name: config
          configMap:
            name: web-config
        - name: mariadb-ca
          configMap:
            name: mariadb-ca
        {{- if .Values.pageCache.enabled }}
        - name: varnish
          emptyDir:
            sizeLimit: 200Mi
        {{- end }}
