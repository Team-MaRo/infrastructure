---
# The pod's configuration files. deployment.yaml carries their checksum, so a change rolls the pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
data:
  # What the init container `plugins` installs into wp-content at every start, as
  # `<kind> <slug> [<version>]` (values plugins and themes). WordPress cannot install anything
  # itself (DISALLOW_FILE_MODS), so this list is the site's plugins and themes; whether a plugin is
  # active stays in the database. S3-Uploads is installed beside these (deployment.yaml).
  plugins.txt: |
    {{- range .Values.plugins }}
    plugin {{ . }}
    {{- end }}
    {{- if .Values.oidc.clientId }}
    plugin daggerhart-openid-connect-generic
    {{- end }}
    {{- if .Values.objectCache.database }}
    plugin redis-cache
    {{- end }}
    {{- if .Values.pageCache.enabled }}
    plugin varnish-http-purge 5.12.3
    {{- end }}
    {{- if .Values.mcp.clientId }}
    # Pinned: plugins in this field have had access-control flaws; an update is read first
    # (README "Content through Claude").
    plugin mcp-adapter 0.7.1
    plugin enable-abilities-for-mcp 2.13.7
    {{- end }}
    {{- range .Values.themes }}
    theme {{ . }}
    {{- end }}
  default.conf: |
    {{- tpl (.Files.Get "files/default.conf") . | nindent 4 }}
  php.ini: |
    {{- .Files.Get "files/php.ini" | nindent 4 }}
    {{- with .Values.phpIni }}
    ; This site's own settings (values phpIni), after the chart's so they win.
    {{- range $name, $value := . }}
    {{ $name }} = {{ $value }}
    {{- end }}
    {{- end }}
  php-fpm.conf: |
    {{- tpl (.Files.Get "files/php-fpm.conf") . | nindent 4 }}
  s3-uploads-hetzner.php: |
    {{- .Files.Get "files/s3-uploads-hetzner.php" | nindent 4 }}
  vulnerability-check.php: |
    {{- .Files.Get "files/vulnerability-check.php" | nindent 4 }}
  vulnerability-metrics.php: |
    {{- .Files.Get "files/vulnerability-metrics.php" | nindent 4 }}
  {{- if .Values.oidc.clientId }}
  oidc.php: |
    {{- tpl (.Files.Get "files/oidc.php") . | nindent 4 }}
  zitadel-login-de.l10n.php: |
    {{- .Files.Get "files/zitadel-login-de.l10n.php" | nindent 4 }}
  zitadel-login-es.l10n.php: |
    {{- .Files.Get "files/zitadel-login-es.l10n.php" | nindent 4 }}
  {{- end }}
  {{- if .Values.pageCache.enabled }}
  default.vcl: |
    {{- tpl (.Files.Get "files/default.vcl") . | nindent 4 }}
  page-cache.php: |
    {{- .Files.Get "files/page-cache.php" | nindent 4 }}
  {{- end }}
  {{- if .Values.matomo.siteId }}
  matomo.php: |
    {{- tpl (.Files.Get "files/matomo.php") . | nindent 4 }}
  {{- end }}
  {{- if .Values.mcp.clientId }}
  mcp.php: |
    {{- tpl (.Files.Get "files/mcp.php") . | nindent 4 }}
  {{- end }}
