---
# WordPress's secrets as environment variables: the database password, the keys and salts that sign
# its cookies, the key it writes uploads with, the SMTP login it sends mail with and its object
# cache's password. Their
# 1Password items are named in the site's values.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: WORDPRESS_DB_PASSWORD
      remoteRef:
        key: mariadb-apps/{{ .Release.Name }}
        property: password
    {{- range list "auth-key" "secure-auth-key" "logged-in-key" "nonce-key" "auth-salt" "secure-auth-salt" "logged-in-salt" "nonce-salt" }}
    - secretKey: WORDPRESS_{{ . | upper | replace "-" "_" }}
      remoteRef:
        key: {{ $.Release.Name }}
        property: {{ . }}
    {{- end }}
    - secretKey: S3_KEY
      remoteRef:
        key: {{ .Release.Name }}-s3
        property: access-key
    - secretKey: S3_SECRET
      remoteRef:
        key: {{ .Release.Name }}-s3
        property: secret-key
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: {{ .Release.Name }}-mailomat
        property: username
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: {{ .Release.Name }}-mailomat
        property: password
    {{- if .Values.objectCache.database }}
    - secretKey: VALKEY_PASSWORD
      remoteRef:
        key: valkey-apps/{{ .Release.Name }}
        property: password
    {{- end }}
---
# The uploads proxy's read-only key: the bucket policy lets it read, never write or delete.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uploads-proxy
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Release.Name }}-uploads-proxy-s3
        property: access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Release.Name }}-uploads-proxy-s3
        property: secret-key
