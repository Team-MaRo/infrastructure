---
# The WordPress containers' secrets as environment variables, exactly as the site's values list
# them (secrets): one entry per variable, from the entry and field given there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    {{- include "wordpress.secretData" .Values.secrets | nindent 4 }}
{{- if .Values.oidc.clientId }}
{{- $_ := include "wordpress.secretRef" (dict "secrets" .Values.secrets "name" "OIDC_CLIENT_SECRET") }}
{{- end }}
---
# The uploads proxy's read-only key, as the site's values list it (uploadsProxy.secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uploads-proxy
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    {{- include "wordpress.secretData" .Values.uploadsProxy.secrets | nindent 4 }}
