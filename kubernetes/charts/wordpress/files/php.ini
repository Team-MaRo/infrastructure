; Uploads as large as prod-old allowed (its note: Cloudflare's upload limit is 100 MB).
upload_max_filesize = 100M
post_max_size = 100M

; PHP's default 128M is tight for WordPress's admin with many plugins (one site ran out with
; MonsterInsights migrating its data); 256M is what WordPress allows its admin pages anyway
; (WP_MAX_MEMORY_LIMIT) and fits the php-fpm container's limit beside the idle workers (README,
; "Sizing the pool"). wp-cli can get more (values wpCli.memoryLimit).
memory_limit = 256M

; WordPress cannot pass a CA to MySQL itself (wpdb only hands MYSQL_CLIENT_FLAGS to
; mysqli_real_connect), so PHP verifies MariaDB's certificate - with
; MYSQLI_CLIENT_SSL_VERIFY_SERVER_CERT among those flags (_helpers.tpl) - against its default CA
; file: the image's public CAs plus the shared MariaDB's CA, written by the init container `core`.
; Every other outbound TLS (S3, wordpress.org, the plugins) keeps the public CAs.
openssl.cafile = /tls/ca-bundle.crt
; The opcache beside the image's opcache-recommended.ini (128M, 8M strings, 4000 files), which was
; full on every site (Site Health 2026-10-22): arepazo has over 20,000 PHP files, so the cache
; kept filling up, being thrown away and recompiled (hit rate 88 %). The interned strings are
; part of memory_consumption (measured), so the pod's shared memory grows by 128M.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
; The files never change while the pod runs - assembled at start, DISALLOW_FILE_MODS - so PHP need
; not look at every file's timestamp every two seconds.
opcache.validate_timestamps = 0
