# nginx in front of php-fpm, both in the {{ .Release.Name }} pod. TLS is Traefik's; requests reach
# here only through it. nginx uses the first matching regex location, so the denies come before the
# PHP rule.

# How long browsers keep a static file: a year when its URL carries WordPress' ?ver=, which changes
# with every theme or plugin update, a week otherwise. expires rather than add_header, since an
# add_header in a location drops the server's security headers there.
map $arg_ver $static_expires {
    ""      7d;
    default 1y;
}

server {
    listen 8081;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 100M;

    # nginx's own redirects (a directory without its slash, e.g. /wp-admin) carry only the path:
    # an absolute one would name what nginx sees - http and port 8081 - instead of the site's
    # address behind Traefik.
    absolute_redirect off;

    # The visitor's address. Every request comes through Cloudflare and Traefik, so the address
    # nginx sees is the node's and Traefik's X-Real-IP is Cloudflare's - a shared one that got
    # arepazo's login page locked by Jetpack (2026-10-21). Cloudflare names the visitor in
    # CF-Connecting-IP; only Traefik reaches this port, so it is taken from any sender. 443 is open
    # to everyone (tofu/hcloud firewall), so a client that skips Cloudflare can set the header
    # itself and pick the address plugins see - the same trade-off as Traefik's rate limit.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;

    # Room for the headers of one PHP response: logging out redirects to Zitadel with the whole ID
    # token in the URL and deletes a cookie per plugin, more than the default 4k (arepazo answered
    # 502, "upstream sent too big header").
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
{{- with .Values.nginx.contentSecurityPolicy }}
    add_header Content-Security-Policy "{{ . }}" always;
{{- end }}

    # Uploads live in the private bucket: the uploads proxy beside this container signs the request
    # and streams the file. ^~ keeps the static-file rules below from taking these. Cookies have no
    # business at the bucket.
    location ^~ /wp-content/uploads/ {
{{- with .Values.nginx.deniedUploadPaths }}
        # Private files plugins keep under uploads, each with an .htaccess that hides it from
        # Apache; nginx never reads those, so only this does.
        location ~ ^/wp-content/uploads/(?:{{ join "|" . }})/ {
            deny all;
        }
{{- end }}
        # Uploads are files, never code or server configuration.
        location ~ /\. {
            deny all;
        }
        location ~* \.(?:s?html?|php|js|swf)$ {
            deny all;
        }

        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        expires 7d;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

{{- if .Values.matomo.siteId }}
    # Matomo's tracker from the site's own address (README "Web analytics"): ad blockers know
    # /matomo.js and /matomo.php on any host, not these. Straight to Matomo inside the cluster, as the
    # host name it answers to, with the visitor's address (real_ip above) where Matomo reads it.
    # Resolved per request, so the site starts and runs while Matomo is away; the site's cookies
    # stay here.
    location = /m/a.js {
        resolver 10.43.0.10 valid=30s;
        set $matomo matomo.matomo.svc.cluster.local;
        proxy_pass http://$matomo/matomo.js;
        proxy_set_header Host matomo.d3strukt0r.dev;
        proxy_set_header Cookie "";
        expires 1h;
    }
    location = /m/e {
        resolver 10.43.0.10 valid=30s;
        set $matomo matomo.matomo.svc.cluster.local;
        proxy_pass http://$matomo/matomo.php$is_args$args;
        proxy_set_header Host matomo.d3strukt0r.dev;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";
    }
{{- end }}

    # The liveness probe: nginx answers alone, so a slow PHP never gets nginx restarted
    # (deployment.yaml). Reachable from outside as well; it reveals nothing.
    location = /healthz {
        access_log off;
        return 204;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* ^/(?:wp-links-opml\.php|wp-config\.php|wp-config-sample\.php|wp-comments-post\.php|readme\.html|license\.txt)$ {
        deny all;
    }

    # XML-RPC only for WordPress.com, which reaches Jetpack through it (values nginx.xmlrpcAllow);
    # for anyone else it is a password-guessing door. The address is the visitor's from Cloudflare
    # (real_ip above), with the same caveat. As an exact match it wins before every regex location.
    location = /xmlrpc.php {
{{- range .Values.nginx.xmlrpcAllow }}
        allow {{ . }};
{{- end }}
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_pass 127.0.0.1:9000;
    }

    # PHP under wp-content and wp-includes is never called directly - except TinyMCE's loader,
    # which as an exact match wins before any regex location.
    location = /wp-includes/js/tinymce/wp-tinymce.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_pass 127.0.0.1:9000;
    }
    location ~* ^/(?:wp-content|wp-includes)/.*\.php$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Replaces the request's X-Real-IP (Traefik's, Cloudflare's address) with the visitor's,
        # for plugins that read it - Jetpack does (its trusted_ip_header).
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    location ~* \.(?:css(?:\.map)?|js(?:\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv)$ {
        expires $static_expires;
        access_log off;
    }

    location ~* \.(?:svgz?|ttf|ttc|otf|eot|woff2?)$ {
        add_header Access-Control-Allow-Origin "*";
        expires $static_expires;
        access_log off;
    }
}

# php-fpm's pool figures for Prometheus (pod-monitor.yaml), in Prometheus' format straight from
# php-fpm (openmetrics, PHP 8.1+): no exporter needed. Only this port, which neither the Service
# nor the Ingress knows, so it is reachable inside the cluster only. The query is fixed, so the
# per-request detail (?full, with request URLs) never leaves the pod. A hung php-fpm answers 504
# within 2 s instead of holding the scrape.
server {
    listen 9253;
    server_name _;
    access_log off;

    location = /metrics {
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /status;
        fastcgi_param SCRIPT_FILENAME /status;
        fastcgi_param QUERY_STRING openmetrics;
        fastcgi_connect_timeout 1s;
        fastcgi_read_timeout 2s;
        fastcgi_pass 127.0.0.1:9001;
    }

    # The daily vulnerability check's result (files/vulnerability-check.php), from the main pool:
    # a fixed script that reads one option, so nothing else under this port runs PHP.
    location = /wordpress {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/wp-content/mu-plugins/vulnerability-check/metrics.php;
        fastcgi_connect_timeout 1s;
        fastcgi_read_timeout 5s;
        fastcgi_pass 127.0.0.1:9000;
    }

    location / {
        return 404;
    }
}
