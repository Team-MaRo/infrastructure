---
# Only Cloudflare reaches the sites whose names Cloudflare proxies: every route of such a name
# carries this middleware first (<namespace>_cloudflare-only@kubernetescrd). A client that knows a
# node's address - DNS-only names like the registry publish them - and talks to it directly gets
# 403 instead of the site, and so can no longer set CF-Connecting-IP itself on a proxied route.
# DNS-only routes leave it out (README). No namespace: Traefik takes a route's middlewares only
# from the route's own namespace, so every app gets its own copy of this one file - a chart of ours
# as the subchart cloudflare-only, a Kustomize directory by listing this directory (README).
#
# No ipStrategy: Traefik runs on the host network, so the connection's own address is the
# Cloudflare server that opened it - exactly what to check.
#
# Cloudflare's ranges, from https://api.cloudflare.com/client/v4/ips on 2026-10-28, etag
# 38f79d050aa027e3be3865e495dcc9bc. Gatus alerts when that etag changes (components/gatus).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflare-only
spec:
  ipAllowList:
    sourceRange:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
