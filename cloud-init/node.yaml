#cloud-config

# Base image: Debian 13 (trixie)
# Purpose:    prepare a Kubernetes node (the distribution is installed afterwards, by Ansible)

users:
  - name: d3strukt0r
    groups: [sudo]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMyo6EpbVTkB97J+PgeHxcB3td2knOowuSXckRanvqBL

# Tells cloud-init to write "PasswordAuthentication no" into its own
# /etc/ssh/sshd_config.d/50-cloud-init.conf drop-in. Without this, that file
# can override your hardening, because sshd uses the FIRST value it sees.
ssh_pwauth: false
disable_root: true

package_update: true
package_upgrade: true
packages:
  - fail2ban

write_files:
  # This must sort before 50-cloud-init.conf.
  - path: /etc/ssh/sshd_config.d/00-hardening.conf
    permissions: '0644'
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      MaxAuthTries 3
      X11Forwarding no
      AllowAgentForwarding no
      AllowUsers d3strukt0r

  # Debian cloud images ship without rsyslog, so there is no /var/log/auth.log.
  # backend = systemd makes fail2ban read the journal instead.
  - path: /etc/fail2ban/jail.local
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 3
      bantime = 1h

  # Required for pod networking.
  - path: /etc/sysctl.d/99-kubernetes.conf
    permissions: '0644'
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1

runcmd:
  - systemctl enable --now fail2ban

power_state:
  mode: reboot
  condition: true
  timeout: 60
  message: Rebooting after initial cloud-init run